document: rfc-3986
kind: security-consideration
summary: Maliciously constructed URIs may use percent-encoding tricks, obscured characters, or syntactic ambiguity to mislead users or bypass security controls. When a URI violates scheme-specific restrictions, the resolution process should flag it as an error rather than silently ignore unused parts.
section: "7.2"
topics:
    - security
    - http
