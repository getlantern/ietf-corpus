document: rfc-3986
kind: wire-format
summary: Percent-encoding represents a data octet as the character triplet pct-encoded = "%" HEXDIG HEXDIG, where the two hex digits encode the octet's numeric value. Uppercase and lowercase hex digits are equivalent, but producers SHOULD use uppercase for consistency.
section: "2.1"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-09"
