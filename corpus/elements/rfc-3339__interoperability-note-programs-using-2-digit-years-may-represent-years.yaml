document: rfc-3339
kind: interoperability-note
summary: Programs using 2-digit years may represent years after 1999 as three digits (by subtracting 1900 without checking digit count) or as non-numeric characters. Robust parsers may add 1900 to three-digit years or detect and handle non-numeric decade values.
