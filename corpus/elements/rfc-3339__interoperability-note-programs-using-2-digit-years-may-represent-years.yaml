document: rfc-3339
kind: interoperability-note
summary: Programs using 2-digit years may represent years after 1999 as three digits or as non-numeric decade characters. Implementations wishing to interoperate with such broken software may add 1900 to three-digit years and detect non-numeric decades.
section: "3"
