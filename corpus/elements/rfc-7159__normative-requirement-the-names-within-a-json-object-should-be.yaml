document: rfc-7159
kind: normative-requirement
summary: 'The names within a JSON object SHOULD be unique. When duplicate names appear, behavior is unpredictable: implementations variously report the last pair, signal an error, or report all pairs including duplicates.'
section: "4"
rfc2119_level: SHOULD
