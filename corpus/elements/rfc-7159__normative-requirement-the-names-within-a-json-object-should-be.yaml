document: rfc-7159
kind: normative-requirement
summary: The names within a JSON object SHOULD be unique. When names are not unique, behavior is unpredictable; many implementations report only the last name/value pair, others error or report all pairs including duplicates.
section: "4"
rfc2119_level: SHOULD
topics:
    - json
