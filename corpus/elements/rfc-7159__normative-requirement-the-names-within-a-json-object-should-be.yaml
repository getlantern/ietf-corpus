document: rfc-7159
kind: normative-requirement
summary: The names within a JSON object SHOULD be unique. When names are not unique, behavior of receiving software is unpredictable — many implementations report only the last pair, others report an error, and some report all pairs including duplicates.
section: "4"
rfc2119_level: SHOULD
topics:
    - json
