document: rfc-7159
kind: normative-requirement
summary: 'The names within a JSON object SHOULD be unique. When names are not unique, behavior of receiving software is unpredictable: implementations variously report the last value, an error, or all duplicate pairs.'
section: "4"
rfc2119_level: SHOULD
topics:
    - json
