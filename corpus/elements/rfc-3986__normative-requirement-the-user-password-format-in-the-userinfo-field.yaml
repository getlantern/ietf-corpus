document: rfc-3986
kind: normative-requirement
summary: The 'user:password' format in the userinfo field is deprecated. Applications SHOULD NOT render as clear text any data after the first colon in userinfo (unless empty), and SHOULD reject storage of such data in unencrypted form, as passing authentication in clear text has proven a security risk.
section: 3.2.1
rfc2119_level: SHOULD NOT
topics:
    - security
    - privacy
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
