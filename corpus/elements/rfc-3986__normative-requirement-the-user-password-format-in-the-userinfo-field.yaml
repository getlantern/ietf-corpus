document: rfc-3986
kind: normative-requirement
summary: The "user:password" format in the userinfo field is deprecated. Applications should not render as clear text any data after the first ":" in userinfo unless it is empty, and should reject storage of such data in unencrypted form.
section: 3.2.1
rfc2119_level: SHOULD NOT
topics:
    - security
    - http
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-23"
