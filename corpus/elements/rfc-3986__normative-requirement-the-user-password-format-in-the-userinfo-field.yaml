document: rfc-3986
kind: normative-requirement
summary: The "user:password" format in the userinfo field is deprecated. Applications SHOULD NOT render as clear text any data after the first colon in userinfo (unless it is empty), and SHOULD reject storage of such data in unencrypted form; passing authentication in clear text has proven to be a security risk.
section: 3.2.1
rfc2119_level: SHOULD NOT
topics:
    - security
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-20"
