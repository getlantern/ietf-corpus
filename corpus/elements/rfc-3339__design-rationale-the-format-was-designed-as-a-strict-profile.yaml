document: rfc-3339
kind: design-rationale
summary: The format was designed as a strict profile of ISO 8601 rather than the full grammar, because the complete ISO 8601 syntax is too complex for Internet protocols. Simplicity is achieved by making most fields and punctuation mandatory, eliminating optional elements that cause interoperability bugs.
section: "5.5"
