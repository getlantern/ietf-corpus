document: rfc-3986
kind: wire-format
summary: 'The host subcomponent is one of: an IP-literal (IPv6 or future address in square brackets), an IPv4 address in dotted-decimal form, or a registered name (`host = IP-literal / IPv4address / reg-name`). IPv4 is disambiguated from reg-name by first-match-wins.'
section: 3.2.2
topics:
