document: rfc-3986
kind: design-rationale
summary: URIs provide identification, not access; the presence of a URI neither guarantees nor implies resource accessibility. Operations on a resource are defined by the protocols and data formats that use URIs — URI 'resolution' (determining an access mechanism) and 'dereferencing' (performing an action) are conceptually distinct from identification.
section: 1.2.2
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-09"
