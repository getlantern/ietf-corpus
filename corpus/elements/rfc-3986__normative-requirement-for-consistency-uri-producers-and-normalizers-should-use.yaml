document: rfc-3986
kind: normative-requirement
summary: For consistency, URI producers and normalizers SHOULD use uppercase hexadecimal digits for all percent-encodings, and SHOULD decode percent-encoded unreserved characters to their unencoded equivalents.
section: "2.1"
rfc2119_level: SHOULD
