document: rfc-3339
kind: interoperability-note
summary: For lexicographic sorting of timestamps to produce time-ordered results, all timestamps must share the same timezone string (all 'Z' or all '+00:00') and the same number of fractional-second digits; optional punctuation or differing offset representations break this property.
section: "5.1"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
