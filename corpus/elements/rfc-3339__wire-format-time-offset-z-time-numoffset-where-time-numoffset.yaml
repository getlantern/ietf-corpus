document: rfc-3339
kind: wire-format
summary: time-offset = "Z" / time-numoffset, where time-numoffset = ("+" / "-") time-hour ":" time-minute. The suffix "Z" denotes UTC offset of 00:00; numeric offsets represent local time minus UTC.
