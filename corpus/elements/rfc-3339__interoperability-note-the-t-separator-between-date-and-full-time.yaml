document: rfc-3339
kind: interoperability-note
summary: The 'T' separator between date and full-time may be replaced by a space for readability in applications that choose to do so, and 'T' and 'Z' may be lower case; environments that are case-sensitive (e.g., XML) may restrict to upper case only.
section: "5.6"
