document: rfc-3339
kind: interoperability-note
summary: The "T" separator between date and full-time, and the "Z" suffix, may alternatively be lowercase "t" or "z" per ABNF and ISO 8601. However, some environments (e.g., XML) distinguish case, and specifications using this format in such environments may restrict to uppercase only.
