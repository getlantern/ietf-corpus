document: rfc-3339
kind: interoperability-note
summary: The "T" separator between date and full-time and the "Z" suffix are case-insensitive per ABNF and ISO 8601, but some environments (e.g., XML) are case-sensitive; specifications in such environments may restrict to upper case only.
