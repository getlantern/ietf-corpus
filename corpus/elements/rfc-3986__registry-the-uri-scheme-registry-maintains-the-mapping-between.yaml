document: rfc-3986
kind: registry
summary: The URI scheme registry maintains the mapping between scheme names and their specifications. New URI scheme registration is governed by BCP35. Scheme specifications must define their own syntax so that all matching strings also match the absolute-URI grammar.
section: "3.1"
topics:
