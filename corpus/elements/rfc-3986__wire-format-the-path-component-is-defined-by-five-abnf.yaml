document: rfc-3986
kind: wire-format
summary: 'The path component is defined by five ABNF rules to handle all valid cases: path-abempty (begins with "/" or empty), path-absolute (begins with "/" but not "//"), path-noscheme, path-rootless, and path-empty. Dot-segments "." and ".." are defined for relative reference.'
section: "3.3"
topics:
