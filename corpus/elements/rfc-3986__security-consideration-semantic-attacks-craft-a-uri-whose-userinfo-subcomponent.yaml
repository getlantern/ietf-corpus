document: rfc-3986
kind: security-consideration
summary: Semantic attacks craft a URI whose userinfo subcomponent resembles a trusted host name (e.g., "http://trusted.example.com@evil.example.net/") to mislead users. Applications rendering URIs for user feedback SHOULD visually distinguish the userinfo subcomponent from the host.
section: "7.6"
topics:
    - security
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-13"
