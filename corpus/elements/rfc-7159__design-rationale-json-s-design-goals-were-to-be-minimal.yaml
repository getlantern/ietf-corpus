document: rfc-7159
kind: design-rationale
summary: JSON's design goals were to be minimal, portable, textual, and a subset of JavaScript. Deriving from ECMAScript object literals was an intentional choice to maximize language-independent portability while retaining syntactic familiarity for JavaScript developers.
