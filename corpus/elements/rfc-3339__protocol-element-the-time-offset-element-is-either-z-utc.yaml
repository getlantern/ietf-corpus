document: rfc-3339
kind: protocol-element
summary: The time-offset element is either "Z" (UTC, offset 00:00) or a numeric offset expressed as ('+' / '-') HH:MM, calculated as local time minus UTC. Alphabetic time zone labels are explicitly rejected due to past interoperability failures.
section: "5.6"
