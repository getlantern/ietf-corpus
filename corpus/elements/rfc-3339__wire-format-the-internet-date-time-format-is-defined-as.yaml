document: rfc-3339
kind: wire-format
summary: The Internet Date/Time Format is defined as `date-time = full-date "T" full-time`, where `full-date = date-fullyear "-" date-month "-" date-mday` (YYYY-MM-DD) and `full-time = partial-time time-offset`. The separator "T" and UTC suffix "Z" may be upper or lower case; applications generating this format SHOULD use upper case.
section: "5.6"
