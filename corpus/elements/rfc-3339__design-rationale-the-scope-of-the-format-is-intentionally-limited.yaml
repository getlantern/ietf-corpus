document: rfc-3339
kind: design-rationale
summary: The scope of the format is intentionally limited to timestamps (instants in time) for current-era dates (0000AD–9999AD) with a stated UTC relationship; time periods, intervals, recurring events, and scheduling semantics are explicitly out of scope.
section: "1"
