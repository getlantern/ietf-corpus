document: rfc-3986
kind: wire-format
summary: 'IPv4 addresses in URIs must use dotted-decimal notation: four decimal octets 0–255 separated by ".". Other dotted-notation forms accepted by some platforms (octal, hex) are not allowed by the URI grammar.'
section: 3.2.2
