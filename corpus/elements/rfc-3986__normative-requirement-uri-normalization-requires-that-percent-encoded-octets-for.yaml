document: rfc-3986
kind: normative-requirement
summary: URI normalization requires that percent-encoded octets for unreserved characters SHOULD be decoded, the default port SHOULD be omitted, and the scheme and host SHOULD be lowercased. URIs differing only in these normalized forms are equivalent.
section: 6.2.2
rfc2119_level: SHOULD
topics:
    - http
