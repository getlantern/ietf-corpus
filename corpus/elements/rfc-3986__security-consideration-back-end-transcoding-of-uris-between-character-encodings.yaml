document: rfc-3986
kind: security-consideration
summary: Back-end transcoding of URIs between character encodings can produce or consume percent-encoding sequences that represent reserved characters, changing URI semantics. Implementations must decode percent-encoded octets before applying reverse transcoding to recover local names.
section: "7.3"
topics:
    - security
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-25"
