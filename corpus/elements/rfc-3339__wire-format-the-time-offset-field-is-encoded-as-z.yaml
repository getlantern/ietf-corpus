document: rfc-3339
kind: wire-format
summary: The time-offset field is encoded as "Z" for UTC or as a numeric offset time-numoffset = ("+" / "-") time-hour ":" time-minute. Alphabetic timezone abbreviations are not permitted. Numeric offsets represent local time minus UTC.
section: "5.6"
