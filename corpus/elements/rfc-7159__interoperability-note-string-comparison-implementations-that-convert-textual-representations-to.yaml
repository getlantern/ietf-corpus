document: rfc-7159
kind: interoperability-note
summary: String comparison implementations that convert textual representations to Unicode code-unit sequences and compare numerically are interoperable. Implementations that compare escaped and unescaped forms without normalizing them first may incorrectly find "a\\b" and "a\u005Cb" unequal.
section: "8.3"
topics:
    - json
