document: rfc-3986
kind: security-consideration
summary: Semantic attacks craft URIs whose userinfo or other visible components resemble trusted domain names, misleading users about the resource's actual origin. Applications rendering URIs for user feedback should visually distinguish the userinfo component from the host to prevent this confusion.
section: "7.6"
topics:
    - security
