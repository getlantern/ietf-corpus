document: rfc-3339
kind: design-rationale
summary: The full ISO 8601 grammar is deemed too complex for most Internet protocols because it allows multiple representations and partial representations. This profile achieves simplicity by making most fields and punctuation mandatory, retaining only fractional seconds as optional.
section: "5.5"
