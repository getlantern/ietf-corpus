document: rfc-3339
kind: design-rationale
summary: The full ISO 8601 grammar is deemed too complex for Internet protocols. This document defines a strict profile — a conformant subset of the ISO 8601 extended format — making almost all fields and punctuation mandatory to achieve simplicity and true interoperability.
section: "5.5"
