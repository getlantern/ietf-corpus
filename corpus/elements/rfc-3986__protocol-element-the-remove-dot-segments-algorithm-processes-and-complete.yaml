document: rfc-3986
kind: protocol-element
summary: 'The remove_dot_segments algorithm processes "." and ".." complete path segments using two buffers: the input is consumed left-to-right, removing "../" and "./" prefixes, replacing "/." with "/", treating "/.." as removal of the last output segment, and moving all other segments to output. Excess ".." segments beyond the hierarchy root are silently discarded.'
section: 5.2.4
topics:
    - http
