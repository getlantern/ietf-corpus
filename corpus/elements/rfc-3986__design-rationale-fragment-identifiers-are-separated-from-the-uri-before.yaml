document: rfc-3986
kind: design-rationale
summary: Fragment identifiers are separated from the URI before any dereference and processed solely by the user agent. This prevents information providers from denying reference authors the right to link to specific portions of a resource, and keeps fragment semantics media-type-defined rather than scheme-defined.
section: "3.5"
topics:
    - http
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-04"
