summary: 'Numbers are represented in base 10 with an optional leading minus sign, an integer component (no leading zeros), an optional fraction (decimal point followed by one or more digits), and an optional exponent (E or e, optional sign, one or more digits). Infinity and NaN are not permitted. Grammar: `number = [ minus ] int [ frac ] [ exp ]`.'
