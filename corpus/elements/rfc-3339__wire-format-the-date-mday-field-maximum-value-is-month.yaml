document: rfc-3339
kind: wire-format
summary: 'The date-mday field maximum value is month- and year-dependent: February has 28 in normal years and 29 in leap years; April, June, September, November have 30; all other months have 31. The hour field is restricted to 00-23; ISO 8601''s value of 24 is not permitted.'
