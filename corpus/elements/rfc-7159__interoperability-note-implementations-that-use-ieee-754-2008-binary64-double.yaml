document: rfc-7159
kind: interoperability-note
summary: Implementations that use IEEE 754-2008 binary64 (double precision) provide good interoperability for numbers within that range and precision. Integers in the range [-(2**53)+1, (2**53)-1] are exactly interoperable; numbers outside this range or with extreme precision may cause interoperability problems.
