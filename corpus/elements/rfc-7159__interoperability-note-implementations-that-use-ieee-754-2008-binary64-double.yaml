document: rfc-7159
kind: interoperability-note
summary: Implementations that use IEEE 754-2008 binary64 (double precision) achieve good interoperability. Integers in the range [-(2**53)+1, (2**53)-1] are exactly interoperable; numbers outside this range or with greater precision than double can offer may indicate interoperability problems.
