document: rfc-3986
kind: protocol-element
summary: A relative reference (relative-ref = relative-part [ "?" query ] [ "#" fragment ]) may be a network-path reference (begins "//"), absolute-path reference (begins "/"), or relative-path reference (begins with a non-slash). A path segment containing ":" cannot be the first segment of a relative-path reference and must be preceded by "./".
section: "4.2"
topics:
    - http
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-27"
