document: rfc-3986
kind: state-machine
summary: 'The reference resolution algorithm transforms a URI reference R against a base URI Base into target URI T. If R has a scheme, T takes R''s components directly (with dot-segments removed). If R lacks a scheme but has an authority, T takes R''s authority and path. Otherwise, T inherits base components progressively: authority, then path (merged with base path and dot-segments removed), then query, always appending R''s fragment.'
section: 5.2.2
topics:
    - http
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-23"
