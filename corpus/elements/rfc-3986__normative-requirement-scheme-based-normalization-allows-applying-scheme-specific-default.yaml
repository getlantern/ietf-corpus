document: rfc-3986
kind: normative-requirement
summary: 'Scheme-based normalization allows applying scheme-specific default values: for example, omitting an empty port or default port (e.g., port 80 for http), normalizing an empty path to "/" when an authority is present, and treating an absent userinfo the same as an empty userinfo.'
section: 6.2.3
rfc2119_level: SHOULD
topics:
    - http
