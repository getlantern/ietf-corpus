document: rfc-3339
kind: protocol-element
summary: 'The time-offset field encodes the relationship of local time to UTC: "Z" means UTC exactly (+00:00), a numeric time-numoffset of the form (+/-)HH:MM means local time minus UTC, and "-00:00" is a special convention meaning UTC is known but the local offset is unknown.'
section: 4.2, 4.3, 5.6
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-20"
