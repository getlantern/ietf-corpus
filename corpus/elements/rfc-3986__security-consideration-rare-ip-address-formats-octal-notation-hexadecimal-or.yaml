document: rfc-3986
kind: security-consideration
summary: Rare IP address formats (octal notation, hexadecimal, or fewer than four dotted-decimal octets) may be accepted by some host platforms but are not valid URI syntax. An implementation accepting such formats could be tricked into connecting to an unexpected host.
section: "7.4"
topics:
    - security
    - ip
