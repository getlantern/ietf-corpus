document: rfc-7159
kind: interoperability-note
summary: String comparison implementations that convert escaped characters to Unicode code units before comparing numerically are interoperable. Implementations that compare strings with escaped characters unconverted may incorrectly find that 'a\\b' and 'a\u005Cb' are not equal.
section: "8.3"
topics:
    - json
