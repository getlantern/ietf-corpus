document: rfc-7159
kind: design-rationale
summary: RFC 7159 broadened the definition of a valid JSON text to allow any JSON value (not just objects or arrays as RFC 4627 required), because implementations generating only objects or arrays remain interoperable with all conforming implementations, while the restriction served no practical purpose.
section: "1.3"
topics:
    - json
