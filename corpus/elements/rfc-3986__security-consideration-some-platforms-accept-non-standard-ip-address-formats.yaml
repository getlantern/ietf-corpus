document: rfc-3986
kind: security-consideration
summary: Some platforms accept non-standard IP address formats (octal notation, fewer than four octets, hexadecimal) that may bypass access controls. Only the standard dotted-decimal four-octet IPv4 form is permitted by the URI grammar; implementations should reject other dotted-notation forms.
section: "7.4"
topics:
    - security
    - http
    - ip
