document: rfc-3986
kind: security-consideration
summary: Some platforms accept non-standard IP address formats (octal notation, dotted hexadecimal, fewer than four octets) that are forbidden by the URI grammar but may be resolved by lower-level routines, potentially allowing a URI to bypass security checks that test only the canonical dotted-decimal form.
section: "7.4"
topics:
    - security
    - ip
