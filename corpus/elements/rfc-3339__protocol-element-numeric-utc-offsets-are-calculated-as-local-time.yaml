document: rfc-3339
kind: protocol-element
summary: Numeric UTC offsets are calculated as "local time minus UTC" and are expressed as (+/-)HH:MM. For example, 18:50:00-04:00 equals 22:50:00Z. Alphabetic time zone labels are explicitly not used due to historical interoperability failures.
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
