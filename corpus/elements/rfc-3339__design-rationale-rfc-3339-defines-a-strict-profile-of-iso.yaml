document: rfc-3339
kind: design-rationale
summary: 'RFC 3339 defines a strict profile of ISO 8601 rather than adopting the full grammar because ISO 8601''s complete syntax is too complex for Internet protocols: it includes partial representations, redundant forms, and rarely exercised options that reduce interoperability by escaping test coverage.'
section: "5.5"
