document: rfc-3339
kind: wire-format
summary: date-fullyear is exactly 4 ASCII digits (0000–9999); date-month is 2 digits (01–12); date-mday is 2 digits whose maximum value depends on month and year (28–31); time-hour is 2 digits (00–23); time-minute is 2 digits (00–59); time-second is 2 digits (00–58, 00–59, or 00–60 depending on leap-second rules).
section: "5.6"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-11"
