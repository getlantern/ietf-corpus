document: rfc-3339
kind: design-rationale
summary: 'A balance is struck between human readability and interoperability: the format "10/11/1996" is globally ambiguous, and the RFC 822 textual month abbreviations led to implementations substituting translated or non-standard forms, causing interoperability failures.'
section: "5.2"
