document: rfc-3986
kind: protocol-element
summary: The authority component has the form [ userinfo "@" ] host [ ":" port ], preceded by "//" and terminated by the next "/", "?", "#", or end of URI. The host subcomponent may be an IP literal enclosed in brackets, an IPv4 dotted-decimal address, or a registered name.
section: "3.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-25"
