document: rfc-3986
kind: security-consideration
summary: Sensitive information such as passwords SHOULD NOT be embedded in URIs, as URIs appear in server logs, Referer headers, and browser history in plaintext. The deprecated userinfo password field is a primary vector for accidental credential exposure.
section: "7.5"
topics:
    - security
    - privacy
