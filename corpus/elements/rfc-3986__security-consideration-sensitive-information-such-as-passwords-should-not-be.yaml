document: rfc-3986
kind: security-consideration
summary: Sensitive information such as passwords SHOULD NOT be included in URIs, as URIs are often logged, passed in Referer headers, or stored in browser history. The format "user:password@host" in userinfo has proven to be a security risk in nearly every case where it has been used.
section: "7.5"
topics:
    - security
    - privacy
    - http
