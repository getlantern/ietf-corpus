document: rfc-3986
kind: interoperability-note
summary: Some older implementations fail to separate the query and fragment components from the path before merging base and reference paths during relative resolution, causing misinterpretation if the query contains "/../" or "/./". All URI parsers must be capable of correctly handling these abnormal but valid cases.
section: 5.2.4
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
