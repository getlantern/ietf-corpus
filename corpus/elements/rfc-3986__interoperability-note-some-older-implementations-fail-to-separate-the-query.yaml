document: rfc-3986
kind: interoperability-note
summary: Some older implementations fail to separate the query and/or fragment components from the path before merging with the base path and removing dot-segments, causing failures when query strings contain "/../" or "/./". Parsers must perform this separation before path merging.
section: 5.2.4
topics:
    - http
