document: rfc-3986
kind: interoperability-note
summary: Some older implementations fail to separate the query and/or fragment components from the path before merging with the base path during relative reference resolution. This causes interoperability failure when the query component contains the strings "/../" or "/./".
section: 5.2.4
topics:
    - http
