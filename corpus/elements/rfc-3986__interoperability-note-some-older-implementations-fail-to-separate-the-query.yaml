document: rfc-3986
kind: interoperability-note
summary: Some older implementations fail to separate the query and fragment components from the path before merging paths and removing dot-segments, causing failures when query strings contain "/../" or "/./". All parsers should handle the abnormal resolution examples in Section 5.4.2.
section: 5.2.4
topics:
    - http
