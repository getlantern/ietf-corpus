document: rfc-3986
kind: design-rationale
summary: A URI provides identification only; it does not imply or guarantee resource accessibility. Operations (access, update, retrieve) are defined by the protocols and data formats that use URIs, not by this specification. This separation allows URIs to be used purely as names.
section: 1.2.2
topics:
    - http
