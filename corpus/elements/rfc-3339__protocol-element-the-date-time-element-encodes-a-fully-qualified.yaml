document: rfc-3339
kind: protocol-element
summary: The date-time element encodes a fully qualified instant in time as full-date "T" full-time, with full-date carrying a 4-digit year, 2-digit month, and 2-digit day, and full-time carrying hours, minutes, seconds, optional fractional seconds, and a mandatory UTC offset.
