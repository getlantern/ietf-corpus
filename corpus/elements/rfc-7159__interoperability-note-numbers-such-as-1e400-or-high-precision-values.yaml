document: rfc-7159
kind: interoperability-note
summary: Numbers such as 1E400 or high-precision values like 3.141592653589793238462643383279 may indicate interoperability problems, since they imply the producer expects greater numeric range or precision than is widely available in IEEE 754 double-precision implementations.
