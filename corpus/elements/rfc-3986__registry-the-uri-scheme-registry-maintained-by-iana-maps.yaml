document: rfc-3986
kind: registry
summary: The URI scheme registry, maintained by IANA, maps scheme names to their specifications. Registration of new URI schemes is governed by BCP35. Each scheme specification must define syntax ensuring all conforming strings match the absolute-URI grammar.
