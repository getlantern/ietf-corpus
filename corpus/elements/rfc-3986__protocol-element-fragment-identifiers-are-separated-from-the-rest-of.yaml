document: rfc-3986
kind: protocol-element
summary: Fragment identifiers are separated from the rest of the URI prior to dereference and are resolved solely by the user agent, independent of the URI scheme. This prevents information providers from denying reference authors the right to refer selectively to resource content.
section: "3.5"
topics:
    - http
