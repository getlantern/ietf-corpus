document: rfc-3986
kind: protocol-element
summary: Component recomposition reconstructs a URI string from parsed components by appending scheme+":", then "//"+authority if defined, then path, then "?"+query if defined, then "#"+fragment if defined. The distinction between an undefined component (delimiter absent) and an empty component (delimiter present, no content) is preserved.
section: "5.3"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-09"
