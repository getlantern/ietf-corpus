document: rfc-3986
kind: normative-requirement
summary: URI producers and normalizers SHOULD use uppercase hexadecimal digits for all percent-encodings, and SHOULD NOT create percent-encodings for characters in the unreserved set (ALPHA, DIGIT, "-", ".", "_", "~").
section: "2.1"
rfc2119_level: SHOULD
topics:
