document: rfc-3986
kind: normative-requirement
summary: URI producers and normalizers SHOULD use uppercase hexadecimal digits for all percent-encodings. Percent-encoded octets in unreserved character ranges (ALPHA, DIGIT, hyphen, period, underscore, tilde) SHOULD NOT be created and SHOULD be decoded to their unreserved equivalents by normalizers.
section: "2.1"
rfc2119_level: SHOULD
topics:
    - http
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-27"
