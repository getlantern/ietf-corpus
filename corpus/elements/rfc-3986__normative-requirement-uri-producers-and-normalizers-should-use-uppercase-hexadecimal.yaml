document: rfc-3986
kind: normative-requirement
summary: URI producers and normalizers SHOULD use uppercase hexadecimal digits for all percent-encodings for consistency, since uppercase and lowercase hex digits in percent-encoded octets are equivalent.
section: "2.1"
rfc2119_level: SHOULD
