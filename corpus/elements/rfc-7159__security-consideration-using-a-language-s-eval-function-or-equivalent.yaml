document: rfc-7159
kind: security-consideration
summary: Using a language's eval() function (or equivalent) to parse JSON texts constitutes an unacceptable security risk because the text may contain executable code alongside data declarations. This applies to JavaScript and any other language in which JSON syntax is a subset of the language syntax.
section: "12"
topics:
    - json
    - security
