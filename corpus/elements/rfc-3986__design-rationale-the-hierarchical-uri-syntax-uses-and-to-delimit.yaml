document: rfc-3986
kind: design-rationale
summary: The hierarchical URI syntax uses "/", "?", and "#" to delimit components, enabling scheme-independent relative referencing. This allows document trees to be simultaneously accessible via multiple schemes (file, http, ftp) and moved without changing relative references — a key motivation for the relative-reference mechanism.
section: 1.2.3
