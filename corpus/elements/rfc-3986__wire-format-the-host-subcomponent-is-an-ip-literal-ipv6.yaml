document: rfc-3986
kind: wire-format
summary: The host subcomponent is an IP-literal (IPv6 or IPvFuture enclosed in square brackets), an IPv4address in dotted-decimal form (four dec-octets 0–255 separated by "."), or a reg-name. Square brackets are allowed only here in URI syntax. A "first-match-wins" rule disambiguates IPv4address from reg-name.
section: 3.2.2
topics:
