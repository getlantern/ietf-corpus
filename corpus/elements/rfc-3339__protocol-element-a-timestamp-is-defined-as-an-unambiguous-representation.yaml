document: rfc-3339
kind: protocol-element
summary: A timestamp is defined as an unambiguous representation of an instant in time, always carrying an explicit UTC offset. All timestamps in this profile are in the current era (0000AD–9999AD) and express a single instant, not a period or interval.
section: "1"
