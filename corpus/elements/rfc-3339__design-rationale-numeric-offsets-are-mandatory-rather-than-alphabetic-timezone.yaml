document: rfc-3339
kind: design-rationale
summary: Numeric offsets are mandatory (rather than alphabetic timezone strings) because alphabetic timezone strings have historically caused poor interoperability, as documented in RFC 822 and RFC 1123. RFC 2822 made numeric offsets mandatory in email for the same reason.
section: "4.2"
topics:
    - email
