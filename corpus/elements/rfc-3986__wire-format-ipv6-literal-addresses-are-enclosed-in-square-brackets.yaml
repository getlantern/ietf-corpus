document: rfc-3986
kind: wire-format
summary: IPv6 literal addresses are enclosed in square brackets (e.g., "[2001:db8::1]") within the host subcomponent — the only place square brackets appear in URI syntax. A 128-bit address is eight colon-separated 16-bit hex pieces, with optional "::" elision of consecutive zero-valued pieces.
