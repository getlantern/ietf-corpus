document: rfc-3986
kind: protocol-element
summary: 'The path component uses five ABNF rules: path-abempty (begins with "/" or is empty), path-absolute (begins with "/" not "//"), path-noscheme (no colon in first segment), path-rootless, and path-empty. Dot-segments ("." and "..") represent relative position in the hierarchy and are removed during resolution.'
section: "3.3"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
