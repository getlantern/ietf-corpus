document: rfc-3339
kind: interoperability-note
summary: An offset of "-00:00" indicates that UTC is known but the local offset is unknown. This is semantically distinct from "+00:00" or "Z", which imply UTC is the preferred reference point. This convention follows RFC 2822.
section: "4.3"
topics:
