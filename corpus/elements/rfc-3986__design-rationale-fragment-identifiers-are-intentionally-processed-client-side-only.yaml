document: rfc-3986
kind: design-rationale
summary: Fragment identifiers are intentionally processed client-side only and not sent to the origin server, preventing information providers from denying reference authors the right to selectively refer to portions of a resource. This also makes deploying new media types easier than defining new URI schemes, since fragment semantics are media-type-defined.
section: "3.5"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-09"
