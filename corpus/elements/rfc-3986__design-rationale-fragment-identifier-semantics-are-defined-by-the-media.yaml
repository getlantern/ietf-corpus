document: rfc-3986
kind: design-rationale
summary: Fragment identifier semantics are defined by the media type of the retrieved representation rather than by the URI scheme, and fragment identifiers are processed solely client-side. This prevents scheme specifications from controlling selective referencing and makes new media types easier to deploy than new identification schemes.
section: "3.5"
topics:
    - http
