document: rfc-3986
kind: design-rationale
summary: Fragment identifier semantics are defined by the media type of the retrieved representation, not the URI scheme; scheme specifications cannot redefine fragment behavior. The fragment is separated from the URI before any dereference and processed entirely by the user agent, preventing information providers from blocking selective referencing by authors.
section: "3.5"
topics:
    - http
