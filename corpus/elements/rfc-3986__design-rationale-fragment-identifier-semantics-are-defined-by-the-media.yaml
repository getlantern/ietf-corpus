document: rfc-3986
kind: design-rationale
summary: Fragment identifier semantics are defined by the media type of the retrieved representation, not by the URI scheme, making them orthogonal to scheme definition. This prevents information providers from denying reference authors the right to selectively refer to content within a resource.
section: "3.5"
topics:
    - http
