document: rfc-3986
kind: security-consideration
summary: Sensitive information (e.g., access credentials, session tokens) should not be embedded in URIs, as URIs may appear in server logs, Referer headers, browser history, or other accessible locations. Use of 'user:password' in userinfo is explicitly deprecated for this reason.
section: "7.5"
topics:
    - security
    - privacy
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-30"
