document: rfc-3339
kind: security-consideration
summary: The local time zone offset included in a timestamp may reveal the geographic location of a site, which could be exploited to determine when systems are less likely to be monitored and more susceptible to security probes. Sites may choose to emit times in UTC only to mitigate this.
section: "7"
topics:
    - security
    - privacy
