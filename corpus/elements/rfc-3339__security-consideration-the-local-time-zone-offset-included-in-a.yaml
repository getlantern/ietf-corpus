document: rfc-3339
kind: security-consideration
summary: The local time zone offset included in a timestamp may reveal information useful to an attacker for determining when a site is less likely to be monitored; sites concerned about this may choose to emit timestamps in UTC only (using "Z" offset).
section: "7"
topics:
    - security
    - privacy
