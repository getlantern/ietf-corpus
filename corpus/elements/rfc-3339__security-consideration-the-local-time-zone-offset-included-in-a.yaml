document: rfc-3339
kind: security-consideration
summary: The local time zone offset included in a timestamp may reveal when systems are less likely to be monitored, potentially aiding adversaries in timing attacks or probes. Sites concerned about this may choose to emit timestamps in UTC only.
section: "7"
topics:
    - security
    - privacy
