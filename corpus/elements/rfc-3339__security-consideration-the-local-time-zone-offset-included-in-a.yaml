document: rfc-3339
kind: security-consideration
summary: The local time zone offset included in a timestamp may reveal when systems are less likely to be monitored, potentially assisting adversaries in choosing optimal times for security probes. Sites concerned about this may choose to emit times in UTC only (Z offset).
section: "7"
topics:
    - security
    - privacy
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-06"
