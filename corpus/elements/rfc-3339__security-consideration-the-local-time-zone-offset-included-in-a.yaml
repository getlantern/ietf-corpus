document: rfc-3339
kind: security-consideration
summary: The local time zone offset included in a timestamp may reveal information useful to an attacker for determining when systems are less likely to be monitored and thus more susceptible to probing. Sites may choose to emit timestamps in UTC only to avoid disclosing this information.
section: "7"
topics:
    - security
    - privacy
