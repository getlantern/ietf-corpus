document: rfc-3986
kind: design-rationale
summary: The fragment identifier is processed solely by the user agent rather than passed to the server or handled by scheme-specific logic. This prevents resource providers from denying reference authors the right to refer to sub-parts of a resource, and makes new media type definitions easier to deploy than new URI schemes.
section: "3.5"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
