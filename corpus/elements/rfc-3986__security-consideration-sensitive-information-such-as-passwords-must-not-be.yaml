document: rfc-3986
kind: security-consideration
summary: Sensitive information such as passwords MUST NOT be stored in the userinfo subcomponent as clear text. The "user:password" format in userinfo is deprecated; applications should not render data after the first ":" in userinfo and should reject storing it unencrypted.
section: "7.5"
rfc2119_level: MUST NOT
topics:
    - security
    - privacy
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-11"
