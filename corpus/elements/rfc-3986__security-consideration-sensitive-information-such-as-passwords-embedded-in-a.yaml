document: rfc-3986
kind: security-consideration
summary: Sensitive information such as passwords embedded in a URI should be avoided; if present, applications must not render it in clear text. Back-end transcoding of percent-encoded octets can expose data or alter interpretation if decoding occurs before scheme-specific parsing separates components.
section: "7.3"
topics:
    - security
    - privacy
    - http
