document: rfc-3339
kind: interoperability-note
summary: The 'T' separator and 'Z' suffix may be lowercase ('t' or 'z') per ABNF and ISO 8601, but applications generating the format SHOULD use uppercase. Case-sensitive environments (e.g. XML) MAY restrict to uppercase-only.
section: "5.6"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-13"
