document: rfc-3339
kind: interoperability-note
summary: The 'T' separator and 'Z' suffix may be lower case ('t' or 'z') per ABNF and ISO 8601, but specifications in case-sensitive environments (e.g., XML) may require upper case. Generators SHOULD use upper case to maximize compatibility.
section: "5.6"
