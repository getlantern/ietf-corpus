document: rfc-3339
kind: interoperability-note
summary: The "T" separator and "Z" suffix may be lowercase ("t", "z") per ABNF and ISO 8601 rules, but case-sensitive environments (e.g., XML) may further restrict these to uppercase only. Generators SHOULD use uppercase.
section: "5.6"
