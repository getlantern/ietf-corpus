document: rfc-7159
kind: security-consideration
summary: Using JavaScript's `eval()` function (or equivalent in other languages) to parse JSON texts constitutes an unacceptable security risk, since a JSON text that conforms to the host language's syntax could contain executable code alongside data declarations. JSON parsers should never use eval()-like functions.
section: "12"
topics:
    - json
    - security
