document: rfc-3986
kind: wire-format
summary: 'A scheme name is defined as: scheme = ALPHA *( ALPHA / DIGIT / "+" / "-" / "." ). Schemes are case-insensitive but the canonical form is lowercase; documents that specify schemes must use lowercase letters.'
