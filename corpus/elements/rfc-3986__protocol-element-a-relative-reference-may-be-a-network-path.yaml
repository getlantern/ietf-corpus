document: rfc-3986
kind: protocol-element
summary: A relative reference may be a network-path reference (begins with "//"), an absolute-path reference (begins with "/"), or a relative-path reference (no leading slash). A relative-path reference's first segment cannot contain a colon, as it would be mistaken for a scheme name; such segments must be preceded by "./".
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
