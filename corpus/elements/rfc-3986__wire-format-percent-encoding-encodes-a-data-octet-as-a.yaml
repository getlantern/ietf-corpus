document: rfc-3986
kind: wire-format
summary: 'Percent-encoding encodes a data octet as a character triplet: "%" followed by two hexadecimal digits representing the octet''s numeric value (e.g., "%20" for the space character). The ABNF rule is: pct-encoded = "%" HEXDIG HEXDIG.'
section: "2.1"
