document: rfc-3986
kind: wire-format
summary: 'Percent-encoding encodes a data octet as a character triplet: the percent character "%" followed by two uppercase hexadecimal digits (pct-encoded = "%" HEXDIG HEXDIG). Uppercase and lowercase hex digits are equivalent, but producers SHOULD use uppercase.'
section: "2.1"
topics:
    - http
