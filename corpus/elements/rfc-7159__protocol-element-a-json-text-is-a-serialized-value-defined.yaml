document: rfc-7159
kind: protocol-element
summary: A JSON text is a serialized value, defined as 'ws value ws'. This relaxes the RFC 4627 constraint that required a JSON text to be an object or array; any JSON value (string, number, boolean, null, object, or array) is a valid JSON text.
