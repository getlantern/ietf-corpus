document: rfc-3339
kind: interoperability-note
summary: Two-digit year representations are deprecated. If a 2-digit year is received, it should be accepted ONLY if an incorrect interpretation will not cause a protocol or processing failure (e.g., logging only). Programs should also handle broken software producing 3-digit years or non-numeric decade characters.
section: "3"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-09"
