document: rfc-3986
kind: security-consideration
summary: URIs can be maliciously constructed to mislead users or bypass access controls, for example by embedding misleading userinfo before an "@" to impersonate a trusted host name. When a URI violates scheme-specific restrictions, the resolver should flag it as an error rather than silently ignoring unused parts.
section: "7.2"
topics:
    - security
