document: rfc-3986
kind: security-consideration
summary: URIs can be maliciously constructed to mislead users, particularly via the userinfo subcomponent crafted to look like a trusted host name (e.g., "http://trusted.example.com@evil.example.net/"). Applications should render userinfo distinctly from the host to aid user recognition.
section: "7.6"
topics:
    - http
    - security
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-08"
