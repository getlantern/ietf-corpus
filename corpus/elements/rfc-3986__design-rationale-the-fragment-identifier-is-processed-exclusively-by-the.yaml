document: rfc-3986
kind: design-rationale
summary: The fragment identifier is processed exclusively by the user agent and is stripped from the URI before any scheme-specific dereference. This design prevents resource providers from denying authors the right to refer selectively to portions of a resource, and makes fragment semantics orthogonal to scheme definitions.
section: "3.5"
topics:
    - http
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-23"
