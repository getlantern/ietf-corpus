document: rfc-3986
kind: wire-format
summary: 'The scheme component must match: scheme = ALPHA *( ALPHA / DIGIT / "+" / "-" / "." ). It must begin with a letter; subsequent characters may be letters, digits, plus, hyphen, or period. Schemes are case-insensitive but the canonical form is lowercase.'
section: "3.1"
topics:
