document: rfc-3986
kind: security-consideration
summary: Sensitive information such as passwords or private keys should not be included in URIs, as URIs are frequently logged, cached, bookmarked, and exposed in Referer headers. The userinfo subcomponent is a particular risk; its use for authentication credentials should be rejected.
section: "7.5"
topics:
    - security
    - privacy
