document: rfc-3986
kind: security-consideration
summary: Rare IP address formats — such as dotted notation with fewer than four parts, hexadecimal, or octal octets — may be accepted by some platforms but are not allowed by the URI grammar. Implementations accepting such forms risk being deceived about the actual network address being accessed.
section: "7.4"
topics:
    - security
    - ip
