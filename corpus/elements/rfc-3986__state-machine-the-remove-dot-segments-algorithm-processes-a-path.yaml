document: rfc-3986
kind: state-machine
summary: 'The remove_dot_segments algorithm processes a path using two buffers: remove leading "../" or "./"; replace "/./" or "/." (as complete segment) with "/"; replace "/../" or "/.." with "/" and pop the last output segment; remove final lone "." or ".."; otherwise move the first path segment to the output. This normalizes all dot-segments in a referenced path.'
section: 5.2.4
topics:
    - http
