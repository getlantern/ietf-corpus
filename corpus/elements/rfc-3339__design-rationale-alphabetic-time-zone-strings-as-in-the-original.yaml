document: rfc-3339
kind: design-rationale
summary: Alphabetic time zone strings (as in the original RFC 822 email format) caused poor interoperability because different implementations assigned different UTC offsets to the same abbreviation; RFC 2822 subsequently mandated numeric offsets, a decision this profile adopts.
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-04"
