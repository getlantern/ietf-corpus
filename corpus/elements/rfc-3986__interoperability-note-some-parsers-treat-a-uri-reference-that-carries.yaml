document: rfc-3986
kind: interoperability-note
summary: Some parsers treat a URI reference that carries the same scheme as the base URI as a relative reference (ignoring the scheme). This is a known loophole from RFC 1630; its use should be avoided but is permitted for backward compatibility with legacy implementations.
section: 5.4.2
topics:
    - http
