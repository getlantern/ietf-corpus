document: rfc-3339
kind: normative-requirement
summary: The time-second field MAY carry the value "60" only at the end of months in which a leap second occurs (June 30 or December 31). Applications should not generate timestamps involving inserted leap seconds until after the IERS announces them.
section: "5.7"
rfc2119_level: MAY
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-11"
