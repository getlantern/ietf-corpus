document: rfc-3986
kind: protocol-element
summary: 'A base URI for resolving relative references is established in order of decreasing precedence: (1) embedded in content, (2) base URI of the encapsulating entity, (3) the retrieval URI (last URI after any redirects), and (4) application-defined default. A base URI must conform to the absolute-URI syntax and must be stripped of any fragment component.'
section: "5.1"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
