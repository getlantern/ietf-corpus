document: rfc-3986
kind: protocol-element
summary: 'The remove_dot_segments algorithm processes "." and ".." path segments using an input/output buffer loop: "./" and "../" prefixes are stripped; "/./" is replaced by "/"; "/../" removes the last output segment; lone "." or ".." are removed.'
