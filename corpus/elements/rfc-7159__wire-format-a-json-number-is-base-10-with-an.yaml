document: rfc-7159
kind: wire-format
summary: A JSON number is base-10 with an optional leading minus, an integer component (no leading zeros), an optional fraction (decimal point followed by one or more digits), and an optional exponent (E or e, optional sign, one or more digits). Values such as Infinity and NaN are not permitted.
