document: rfc-3986
kind: design-rationale
summary: The slash ("/"), question mark ("?"), and number sign ("#") delimit the hierarchical components of a URI, enabling scheme-independent relative references. Relative references allow document trees to be partially independent of their location and access scheme, supporting portability across "file", "http", and "ftp" simultaneously.
section: 1.2.3
topics:
    - http
