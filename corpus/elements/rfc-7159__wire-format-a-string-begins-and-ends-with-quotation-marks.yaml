summary: A string begins and ends with quotation marks (U+0022). Control characters U+0000 through U+001F, quotation mark, and reverse solidus must be escaped. BMP characters may use \uXXXX (6-char) sequences; non-BMP characters use 12-character UTF-16 surrogate pair sequences.
