document: rfc-3339
kind: wire-format
summary: A leap second is represented as YYYY-MM-DDT23:59:60Z; this form occurs simultaneously in all time zones so that UTC offset relationships are unaffected. The timestamp form for a leap second in a non-UTC zone shifts the 60-second moment by the zone offset (e.g., 1990-12-31T15:59:60-08:00).
section: Appendix D
extracted_by: claude-sonnet-4-6
