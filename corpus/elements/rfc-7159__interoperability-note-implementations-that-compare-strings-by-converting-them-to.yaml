document: rfc-7159
kind: interoperability-note
summary: Implementations that compare strings by converting them to Unicode code-unit sequences and comparing numerically are interoperable. Implementations that compare escape sequences unconverted may incorrectly find that "a\\b" and "a\u005Cb" are unequal.
section: "8.3"
topics:
    - json
