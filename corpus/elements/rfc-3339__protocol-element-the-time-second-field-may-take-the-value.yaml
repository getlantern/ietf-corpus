document: rfc-3339
kind: protocol-element
summary: The `time-second` field may take the value "60" to represent an inserted leap second, occurring at the end of months when a leap second is added (historically June 30 or December 31, expressed as XXXX-06-30T23:59:60Z or XXXX-12-31T23:59:60Z). A subtracted leap second reduces the maximum to "58".
section: "5.7"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-08"
