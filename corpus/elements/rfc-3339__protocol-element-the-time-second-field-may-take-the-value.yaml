document: rfc-3339
kind: protocol-element
summary: 'The time-second field MAY take the value "60" at the end of months in which a positive leap second occurs (to date: June 30 or December 31), represented as XXXX-MM-DDT23:59:60Z. A negative leap second reduces the maximum value to "58". Leap seconds in non-UTC zones occur at the same instant globally, shifted by the zone offset.'
section: "5.7"
