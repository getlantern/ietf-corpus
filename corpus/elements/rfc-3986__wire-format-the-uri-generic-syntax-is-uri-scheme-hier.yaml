kind: wire-format
summary: 'The URI generic syntax is: URI = scheme ":" hier-part [ "?" query ] [ "#" fragment ], where hier-part covers four path variants with optional authority. Scheme and path are required; authority, query, and fragment are optional components delimited by ":" "/" "?" and "#" respectively.'
