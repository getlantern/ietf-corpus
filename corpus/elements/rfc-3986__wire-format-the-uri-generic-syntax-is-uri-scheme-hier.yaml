document: rfc-3986
kind: wire-format
summary: 'The URI generic syntax is: URI = scheme ":" hier-part [ "?" query ] [ "#" fragment ], where hier-part is either "//" authority path-abempty or one of three path-only forms (path-absolute, path-rootless, path-empty). Scheme and path are always present, though path may be empty.'
