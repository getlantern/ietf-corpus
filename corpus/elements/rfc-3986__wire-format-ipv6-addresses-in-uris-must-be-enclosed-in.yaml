document: rfc-3986
kind: wire-format
summary: 'IPv6 addresses in URIs must be enclosed in square brackets: IP-literal = "[" ( IPv6address / IPvFuture ) "]". Square brackets are permitted nowhere else in URI syntax. IPvFuture reserves a version-flagged extension point: "v" 1*HEXDIG "." 1*(unreserved / sub-delims / ":").'
section: 3.2.2
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-13"
