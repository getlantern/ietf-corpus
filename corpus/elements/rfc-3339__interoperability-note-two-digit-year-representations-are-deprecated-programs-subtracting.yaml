document: rfc-3339
kind: interoperability-note
summary: Two-digit year representations are deprecated. Programs subtracting 1900 from a year may produce three-digit years (for years after 1999) or non-numeric decade characters; implementations wishing to handle such broken software must detect and interpret these cases appropriately.
section: "3"
