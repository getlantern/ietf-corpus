document: rfc-3986
kind: protocol-element
summary: Unreserved characters (ALPHA / DIGIT / "-" / "." / "_" / "~") are allowed in any URI component without encoding. A URI differing from another only in the percent-encoding of an unreserved character is equivalent to it.
section: "2.3"
topics:
