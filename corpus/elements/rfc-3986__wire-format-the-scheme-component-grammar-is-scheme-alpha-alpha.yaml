document: rfc-3986
kind: wire-format
summary: 'The scheme component grammar is: scheme = ALPHA *( ALPHA / DIGIT / "+" / "-" / "." ), beginning with a letter. Canonical form is lowercase; implementations should accept uppercase as equivalent but must only produce lowercase scheme names.'
section: "3.1"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
