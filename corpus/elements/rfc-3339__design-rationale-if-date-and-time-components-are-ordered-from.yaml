document: rfc-3339
kind: design-rationale
summary: If date and time components are ordered from least to most precise (year, month, day, hour, minute, second), timestamps can be lexicographically sorted as strings — a useful property for ordering events. The presence of optional punctuation would violate this characteristic.
section: "5.1"
