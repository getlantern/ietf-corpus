document: rfc-3339
kind: design-rationale
summary: If date and time components are ordered from least precise (year) to most precise (second/fraction), timestamps can be sorted lexicographically using strcmp() when zones and fractional-digit counts are uniform. Optional punctuation would violate this property.
section: "5.1"
