document: rfc-3986
kind: normative-requirement
summary: A base URI must be established before parsing URI references that might be relative, must conform to the absolute-URI syntax rule (no fragment allowed), and must be in absolute form. If obtained from a URI reference, it must be converted to absolute form and stripped of any fragment component.
section: "5.1"
rfc2119_level: MUST
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
