summary: 'Base URI precedence for resolving relative references, from highest to lowest: (1) base URI embedded in content (e.g., HTML base element), (2) base URI of the encapsulating entity (message/multipart), (3) the retrieval URI (last URI after redirects), (4) application-dependent default.'
