document: rfc-3986
kind: design-rationale
summary: The URI syntax is restricted to letters, digits, and a small set of special characters to support global transcription — the ability to write a URI on a napkin, read it, and type it on any keyboard. The ability to transcribe was considered more important than allowing the most semantically meaningful characters.
section: 1.2.1
topics:
    - http
