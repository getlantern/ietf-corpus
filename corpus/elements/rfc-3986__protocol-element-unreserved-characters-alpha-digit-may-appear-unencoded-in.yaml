document: rfc-3986
kind: protocol-element
summary: Unreserved characters (ALPHA / DIGIT / "-" / "." / "_" / "~") may appear unencoded in any URI component. URIs that differ only in the replacement of an unreserved character with its percent-encoded equivalent identify the same resource.
section: "2.3"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
