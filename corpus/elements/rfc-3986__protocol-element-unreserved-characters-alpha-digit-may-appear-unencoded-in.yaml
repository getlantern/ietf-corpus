document: rfc-3986
kind: protocol-element
summary: Unreserved characters (ALPHA / DIGIT / "-" / "." / "_" / "~") may appear unencoded in any URI component. URIs differing only by replacement of an unreserved character with its percent-encoded equivalent are equivalent and identify the same resource.
section: "2.3"
topics:
    - http
