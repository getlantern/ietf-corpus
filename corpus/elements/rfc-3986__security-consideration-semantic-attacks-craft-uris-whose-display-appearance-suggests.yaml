document: rfc-3986
kind: security-consideration
summary: Semantic attacks craft URIs whose display appearance suggests a trusted authority while the actual authority differs — for example, by placing a trusted domain name in the userinfo component ("http://trusted.example@evil.example/"). Applications should render userinfo in a visually distinct way to alert users.
section: "7.6"
topics:
    - security
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-25"
