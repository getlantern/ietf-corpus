document: rfc-3986
kind: design-rationale
summary: The generic URI syntax is intentionally a superset of all scheme-specific syntaxes, enabling scheme-independent parsing of URI references. This decouples the evolution of identification schemes from the protocols and data formats that use URIs.
section: 1.1.1
topics:
    - http
