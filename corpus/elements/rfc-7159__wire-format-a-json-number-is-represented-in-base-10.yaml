document: rfc-7159
kind: wire-format
summary: A JSON number is represented in base 10 as '[ minus ] int [ frac ] [ exp ]'. Leading zeros are not allowed; Infinity and NaN are not permitted; an optional minus may prefix the integer component, and an optional exponent begins with 'e' or 'E'.
