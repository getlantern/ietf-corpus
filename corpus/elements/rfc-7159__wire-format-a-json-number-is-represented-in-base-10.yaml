document: rfc-7159
kind: wire-format
summary: 'A JSON number is represented in base 10: an optional minus sign, an integer part (no leading zeros), an optional fraction part (decimal point followed by one or more digits), and an optional exponent part (e or E, optional sign, one or more digits). Infinity and NaN are not permitted.'
