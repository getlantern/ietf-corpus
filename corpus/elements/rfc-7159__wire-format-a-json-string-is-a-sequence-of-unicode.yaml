document: rfc-7159
kind: wire-format
summary: 'A JSON string is a sequence of Unicode characters enclosed in quotation marks. Characters that MUST be escaped include: quotation mark (U+0022), reverse solidus (U+005C), and control characters U+0000 through U+001F. BMP characters may use \uXXXX six-character sequences; non-BMP characters require a 12-character UTF-16 surrogate pair escape.'
section: "7"
topics:
    - json
