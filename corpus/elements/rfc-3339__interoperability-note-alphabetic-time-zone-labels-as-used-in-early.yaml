document: rfc-3339
kind: interoperability-note
summary: Alphabetic time zone labels (as used in early email) have caused poor interoperability in the past; RFC 2822 made numeric offsets mandatory. This specification adopts numeric offsets exclusively.
section: "4.2"
topics:
    - email
