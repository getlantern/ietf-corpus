document: rfc-7159
kind: wire-format
summary: A JSON string begins and ends with quotation marks (%x22). All Unicode characters may appear unescaped except quotation mark, reverse solidus, and control characters U+0000–U+001F. BMP characters may be escaped as \uXXXX (six characters); non-BMP characters are encoded as a 12-character UTF-16 surrogate pair (e.g., \uD834\uDD1E for U+1D11E).
section: "7"
topics:
