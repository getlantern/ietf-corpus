document: rfc-3986
kind: design-rationale
summary: The URI character set is deliberately limited to basic Latin letters, digits, and a few special characters to enable global transcription across diverse input devices, languages, and media. The ability to transcribe a URI from one medium to another (e.g., napkin to keyboard) was considered more important than using maximally meaningful character choices.
section: 1.2.1
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
