document: rfc-3339
kind: protocol-element
summary: The time-offset element is either the literal "Z" (UTC, offset +00:00) or a numeric offset of the form "+HH:MM" or "-HH:MM" representing local time minus UTC. Alphabetic timezone strings are not permitted.
section: "5.6"
