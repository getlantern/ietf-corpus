document: rfc-3986
kind: protocol-element
summary: The query component begins at the first "?" and ends at "#" or end of URI; it may contain pchar, "/", and "?". The fragment component begins at "#" and extends to end of URI; its semantics are defined by the resource's media type and processed solely by the user agent.
section: "3.4"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-13"
