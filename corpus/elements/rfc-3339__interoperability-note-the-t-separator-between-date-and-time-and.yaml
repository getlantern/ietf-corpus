document: rfc-3339
kind: interoperability-note
summary: The "T" separator between date and time, and the "Z" suffix for UTC, may each be either upper or lower case per ABNF and ISO 8601. Applications in case-sensitive environments such as XML may restrict these to upper case only.
section: "5.6"
