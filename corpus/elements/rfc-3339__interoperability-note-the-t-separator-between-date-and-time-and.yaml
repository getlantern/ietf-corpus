document: rfc-3339
kind: interoperability-note
summary: The "T" separator between date and time and the "Z" UTC suffix may alternatively be lower case "t" or "z" per ABNF and ISO 8601. Case-sensitive environments (e.g., XML) may restrict these to upper case only.
section: "5.6"
