document: rfc-3986
kind: interoperability-note
summary: Some parsers allow a scheme name in a relative reference when it is identical to the base URI's scheme (a loophole from RFC 1630). Use should be avoided, but it is permitted for backward compatibility; a non-strict parser may optionally ignore such a redundant scheme to ease transition.
section: 5.4.2
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
