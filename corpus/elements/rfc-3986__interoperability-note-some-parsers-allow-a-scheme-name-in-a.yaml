document: rfc-3986
kind: interoperability-note
summary: Some parsers allow a scheme name in a relative reference if it is identical to the base URI's scheme (treated as a same-scheme relative reference rather than an absolute URI). This is a loophole from prior specifications; its use should be avoided but is allowed for backward compatibility.
section: 5.4.2
topics:
    - http
