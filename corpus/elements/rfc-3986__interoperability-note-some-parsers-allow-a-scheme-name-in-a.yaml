document: rfc-3986
kind: interoperability-note
summary: Some parsers allow a scheme name in a relative reference when it matches the base URI's scheme (non-strict mode). This is a loophole from prior specifications; its use should be avoided but is allowed for backward compatibility.
section: 5.4.2
topics:
    - http
