document: rfc-3986
kind: normative-requirement
summary: A non-ASCII registered name representing an internationalized domain name intended for DNS resolution must be transformed to IDNA encoding [RFC3490] prior to name lookup. URI producers should provide registered names in IDNA encoding rather than percent-encoding to maximize interoperability with legacy resolvers.
section: 3.2.2
rfc2119_level: MUST
topics:
    - dns
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-25"
