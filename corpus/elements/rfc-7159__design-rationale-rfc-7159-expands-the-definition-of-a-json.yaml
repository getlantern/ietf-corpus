document: rfc-7159
kind: design-rationale
summary: RFC 7159 expands the definition of a JSON text to be any JSON value, removing the RFC 4627 constraint that required a JSON text to be an object or an array. This change reflects real-world usage and allows values such as strings, numbers, and booleans to stand alone as valid JSON texts.
section: "2"
topics:
    - json
