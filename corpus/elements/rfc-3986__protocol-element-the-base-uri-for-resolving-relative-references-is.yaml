document: rfc-3986
kind: protocol-element
summary: 'The base URI for resolving relative references is established in order of precedence: (1) base URI embedded in content, (2) base URI from the encapsulating entity, (3) the retrieval URI (using the last URI after redirects), (4) application-defined default. The base URI must conform to the absolute-URI syntax.'
section: "5.1"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-25"
