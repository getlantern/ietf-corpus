document: rfc-3339
kind: wire-format
summary: The time component is encoded as time-hour ':' time-minute ':' time-second [time-secfrac], where time-second is 2DIGIT with valid range 00-58, 00-59, or 00-60 depending on leap second rules. The optional time-secfrac is '.' followed by one or more digits.
section: "5.6"
