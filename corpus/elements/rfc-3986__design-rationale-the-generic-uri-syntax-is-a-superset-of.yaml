document: rfc-3986
kind: design-rationale
summary: The generic URI syntax is a superset of all valid URIs so that a parser can extract the five major components without knowing scheme-specific requirements. This decouples the evolution of identification schemes from the evolution of protocols and implementations that use URIs, allowing future schemes to be defined independently.
section: 1.1.1
