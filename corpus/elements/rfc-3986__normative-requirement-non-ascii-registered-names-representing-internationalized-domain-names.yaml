document: rfc-3986
kind: normative-requirement
summary: Non-ASCII registered names representing internationalized domain names intended for DNS resolution MUST be transformed to IDNA encoding prior to name lookup. URI producers MUST NOT use percent-encoding in the host subcomponent unless it represents a UTF-8 character sequence.
section: 3.2.2
rfc2119_level: MUST
topics:
    - dns
