document: rfc-3339
kind: normative-requirement
summary: Internet clients SHOULD be prepared to transform dates into a display format suitable for the locality, including translating UTC to local time, since no date and time format is readable according to all countries' conventions.
section: "5.2"
rfc2119_level: SHOULD
