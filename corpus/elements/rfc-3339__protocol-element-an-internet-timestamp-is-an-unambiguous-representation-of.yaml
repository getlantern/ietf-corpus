document: rfc-3339
kind: protocol-element
summary: An Internet timestamp is an unambiguous representation of an instant in time expressed as a full-date 'T' full-time string with an explicit UTC offset. All timestamps must be in the range 0000AD to 9999AD and have a stated relationship to UTC.
section: "1"
