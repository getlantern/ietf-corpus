document: rfc-7159
kind: protocol-element
summary: 'A JSON text is a serialized value conforming to the grammar `JSON-text = ws value ws`. The value may be any JSON type: object, array, number, string, or the literals false, null, or true. This removes RFC 4627''s constraint that a JSON text must be an object or an array.'
section: "2"
topics:
