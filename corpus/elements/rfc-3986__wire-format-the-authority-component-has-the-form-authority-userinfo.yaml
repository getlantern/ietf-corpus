document: rfc-3986
kind: wire-format
summary: 'The authority component has the form: authority = [ userinfo "@" ] host [ ":" port ]. It is preceded by "//" and terminated by the next "/", "?", "#", or end of URI. If authority is present, the path must be empty or begin with "/".'
section: "3.2"
topics:
