document: rfc-3986
kind: wire-format
summary: The authority subcomponent has the structure [ userinfo "@" ] host [ ":" port ]. It is preceded by "//" and terminated by the next "/", "?", "#", or end of URI. The port delimiter ":" should be omitted when the port is empty.
