document: rfc-3339
kind: interoperability-note
summary: Numeric offsets only represent time zones differing from UTC by an integral number of minutes; many historical time zones differ by a non-integral number of minutes. Applications must convert such timestamps to the closest representable UTC offset (e.g., the 1937 Netherlands example of +00:20).
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
