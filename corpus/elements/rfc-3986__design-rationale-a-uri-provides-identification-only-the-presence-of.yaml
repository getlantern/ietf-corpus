document: rfc-3986
kind: design-rationale
summary: A URI provides identification only; the presence of a URI does not imply that the resource is accessible or that access will be attempted. Operations on resources are defined by the protocols that use URIs, not by this specification, separating the concern of naming from the concern of access.
section: 1.2.2
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
