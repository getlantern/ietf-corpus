document: rfc-3986
kind: protocol-element
summary: The fragment identifier (fragment = *( pchar / "/" / "?" )) is separated from the URI before dereference and is processed solely by the user agent; its semantics are defined by the media type of the retrieved representation, not by the URI scheme.
section: "3.5"
