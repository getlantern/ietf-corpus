document: rfc-3986
kind: protocol-element
summary: The fragment identifier (fragment = *( pchar / "/" / "?" )) is separated from the rest of the URI prior to dereference and is handled solely by the user agent. Fragment semantics are defined by the media type of the retrieved representation, not by the URI scheme.
section: "3.5"
topics:
    - http
