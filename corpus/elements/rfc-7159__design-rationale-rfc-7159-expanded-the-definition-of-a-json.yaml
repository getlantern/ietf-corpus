document: rfc-7159
kind: design-rationale
summary: RFC 7159 expanded the definition of a JSON text to allow any JSON value (not just objects or arrays) as the top-level element. This reflects widespread implementation practice and real-world usage where single strings, numbers, or booleans are exchanged as JSON texts.
section: "1.3"
topics:
    - json
