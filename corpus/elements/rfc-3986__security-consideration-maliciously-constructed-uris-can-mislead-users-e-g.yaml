document: rfc-3986
kind: security-consideration
summary: Maliciously constructed URIs can mislead users, e.g., by embedding deceptive userinfo that resembles a trusted domain name before the "@" (semantic attack). Applications rendering URIs for user feedback SHOULD distinguish the userinfo subcomponent visually.
section: "7.2"
rfc2119_level: SHOULD
topics:
    - security
    - privacy
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-11"
