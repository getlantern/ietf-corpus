document: rfc-3986
kind: registry
summary: The IANA URI scheme registry maps scheme names to their defining specifications. Registration of new URI schemes is governed by BCP 35. Each scheme specification must define its own syntax such that all scheme-specific URIs also match the absolute-URI grammar.
section: "3.1"
topics:
