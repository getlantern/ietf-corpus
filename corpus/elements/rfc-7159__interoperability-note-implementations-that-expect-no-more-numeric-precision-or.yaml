document: rfc-7159
kind: interoperability-note
summary: Implementations that expect no more numeric precision or range than IEEE 754-2008 binary64 (double precision) achieve good interoperability. Integers in the range [-(2**53)+1, (2**53)-1] are interoperable in that all implementations will agree exactly on their values.
