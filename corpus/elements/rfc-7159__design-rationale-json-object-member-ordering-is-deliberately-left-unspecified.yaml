document: rfc-7159
kind: design-rationale
summary: JSON object member ordering is deliberately left unspecified. JSON parsing libraries differ on whether they expose member ordering to callers; implementations that do not depend on member ordering are interoperable across all such implementations.
section: "4"
topics:
