document: rfc-3986
kind: protocol-element
summary: A URI consists of five hierarchical components — scheme, authority, path, query, and fragment — delimited by ":" (after scheme), "//" (before authority), "?" (before query), and "#" (before fragment). Each component serves a distinct role in resource identification.
