document: rfc-3986
kind: protocol-element
summary: 'A URI consists of five hierarchical components — scheme, authority, path, query, and fragment — following the grammar: URI = scheme ":" hier-part [ "?" query ] [ "#" fragment ]. The scheme and path are required (path may be empty); authority, query, and fragment are optional.'
