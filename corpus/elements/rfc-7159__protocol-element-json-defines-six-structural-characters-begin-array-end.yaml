document: rfc-7159
kind: protocol-element
summary: 'JSON defines six structural characters: begin-array ([), end-array (]), begin-object ({), end-object (}), name-separator (:), and value-separator (,). Insignificant whitespace (space, tab, line feed, carriage return) is allowed before or after any structural character.'
