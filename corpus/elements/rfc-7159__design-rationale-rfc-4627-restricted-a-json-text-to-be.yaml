document: rfc-7159
kind: design-rationale
summary: RFC 4627 restricted a JSON text to be an object or array; RFC 7159 lifts this restriction so any JSON value (including bare strings, numbers, and literals) is a valid JSON text. This aligns with ECMAScript 5.1 and ECMA-404 and reflects actual implementation practice.
section: "1.3"
topics:
    - json
