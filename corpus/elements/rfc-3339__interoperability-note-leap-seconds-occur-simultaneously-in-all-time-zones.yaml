document: rfc-3339
kind: interoperability-note
summary: Leap seconds occur simultaneously in all time zones (as XXXX-MM-DDT23:59:60Z in UTC), and the leap-second point is shifted by the zone offset in non-UTC representations, so that time-zone relationships are preserved.
section: "5.7"
