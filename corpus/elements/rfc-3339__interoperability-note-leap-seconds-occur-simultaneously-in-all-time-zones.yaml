document: rfc-3339
kind: interoperability-note
summary: Leap seconds occur simultaneously in all time zones, so the leap second point shifts by the zone offset in non-UTC representations (e.g., 1990-12-31T15:59:60-08:00 equals 1990-12-31T23:59:60Z). Implementations must account for this shift when comparing timestamps across zones.
section: "5.7"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-18"
