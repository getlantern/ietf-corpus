document: rfc-3339
kind: interoperability-note
summary: Leap seconds occur simultaneously in all time zones; in non-UTC time zones the leap second point is shifted by the zone offset, so a leap second at 23:59:60Z appears at 15:59:60-08:00 in Pacific Standard Time.
section: "5.7"
