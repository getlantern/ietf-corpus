document: rfc-3339
kind: interoperability-note
summary: Leap seconds occur simultaneously in all time zones; in non-UTC zones the leap second point is shifted by the zone offset but represents the same instant. Applications must account for this when validating time-second = 60 in non-Z timestamps.
section: "5.7"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-27"
