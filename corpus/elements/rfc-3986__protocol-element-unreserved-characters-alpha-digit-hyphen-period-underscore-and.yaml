document: rfc-3986
kind: protocol-element
summary: Unreserved characters — ALPHA, DIGIT, hyphen, period, underscore, and tilde — may appear unencoded in any URI component. A URI differing only in percent-encoding of an unreserved character is equivalent to the unencoded form.
section: "2.3"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-11"
