summary: 'Characters outside the Basic Multilingual Plane (above U+FFFF) are encoded in JSON strings as 12-character UTF-16 surrogate pair sequences: \uHHHH\uHHHH. For example, the G clef (U+1D11E) is represented as ''\uD834\uDD1E''.'
