document: rfc-3339
kind: security-consideration
summary: The local time zone offset in a timestamp may reveal information about when systems at a site are less likely to be monitored, potentially aiding adversaries in timing security probes. Sites may choose to emit times in UTC only to avoid disclosing this information.
section: "7"
topics:
