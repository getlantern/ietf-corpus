document: rfc-3339
kind: security-consideration
summary: The local time zone offset in a timestamp may reveal information about when systems at a site are less likely to be monitored, potentially aiding targeted attacks. Sites concerned about this may choose to emit timestamps in UTC only (using "Z" or "+00:00").
section: "7"
topics:
    - security
    - privacy
