document: rfc-3339
kind: security-consideration
summary: The local time zone offset in a timestamp may reveal the geographic location of a site, enabling attackers to infer times when systems are less monitored and more susceptible to probing. Sites concerned about this may wish to emit timestamps in UTC only (using 'Z' offset).
section: "7"
topics:
    - security
    - privacy
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
