document: rfc-3339
kind: security-consideration
summary: The local time zone offset in a timestamp may reveal when a site is likely to be less monitored, potentially making it more susceptible to security probes. Sites concerned about this may choose to emit only UTC timestamps, omitting local offset information.
section: "7"
topics:
    - security
    - privacy
