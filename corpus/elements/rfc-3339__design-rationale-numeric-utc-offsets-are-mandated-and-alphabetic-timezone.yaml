document: rfc-3339
kind: design-rationale
summary: Numeric UTC offsets are mandated (and alphabetic timezone abbreviations prohibited) because past attempts to label offsets with alphabetic strings caused poor interoperability in Internet mail, as documented in RFC 822 and RFC 1123 experience.
section: "4.2"
topics:
    - email
