document: rfc-3986
kind: wire-format
summary: 'A URI is defined as: URI = scheme ":" hier-part [ "?" query ] [ "#" fragment ], where hier-part is one of "//" authority path-abempty, path-absolute, path-rootless, or path-empty. The scheme and path components are always required; the path may be empty.'
