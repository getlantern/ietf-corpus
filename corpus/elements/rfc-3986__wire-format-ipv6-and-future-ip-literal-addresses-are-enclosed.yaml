document: rfc-3986
kind: wire-format
summary: 'IPv6 and future IP literal addresses are enclosed in square brackets: IP-literal = "[" ( IPv6address / IPvFuture ) "]". Square brackets are permitted only in this position in the URI syntax. IPvFuture uses a version flag prefix "v" 1*HEXDIG ".".'
section: 3.2.2
extracted_by: claude-sonnet-4-6
