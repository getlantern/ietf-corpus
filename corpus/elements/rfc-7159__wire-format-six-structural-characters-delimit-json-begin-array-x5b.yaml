document: rfc-7159
kind: wire-format
summary: 'Six structural characters delimit JSON: begin-array %x5B, end-array %x5D, begin-object %x7B, end-object %x7D, name-separator %x3A (colon), and value-separator %x2C (comma). Insignificant whitespace (space %x20, tab %x09, line feed %x0A, carriage return %x0D) is allowed before or after any structural character.'
