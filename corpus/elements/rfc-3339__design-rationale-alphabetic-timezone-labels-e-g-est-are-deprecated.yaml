document: rfc-3339
kind: design-rationale
summary: Alphabetic timezone labels (e.g., 'EST') are deprecated and numeric offsets made mandatory because alphabetic strings caused poor interoperability historically; RFC 2822 codified the numeric requirement for email.
section: "4.2"
topics:
