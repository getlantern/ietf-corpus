document: rfc-3986
kind: interoperability-note
summary: Some older, erroneous implementations fail to separate the query and/or fragment component from the path before merging with the base path and removing dot-segments, causing incorrect resolution when query strings contain "/../" or "/./" sequences.
section: 5.2.4
