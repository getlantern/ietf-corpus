document: rfc-3339
kind: wire-format
summary: The numeric UTC offset time-numoffset is encoded as "+" or "-" followed by time-hour ":" time-minute, representing an integral number of minutes difference from UTC. Non-integral historical offsets cannot be represented exactly and must be rounded to the nearest representable value.
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-11"
