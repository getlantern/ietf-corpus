document: rfc-7159
kind: design-rationale
summary: JSON text was redefined from RFC 4627's constraint (object or array only) to allow any JSON value, because implementations that generate only objects or arrays remain interoperable with all compliant parsers, while the looser definition enables simpler use cases.
section: "2"
