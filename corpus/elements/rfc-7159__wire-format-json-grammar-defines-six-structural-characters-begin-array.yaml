document: rfc-7159
kind: wire-format
summary: 'JSON grammar defines six structural characters: begin-array (%x5B), begin-object (%x7B), end-array (%x5D), end-object (%x7D), name-separator (%x3A colon), and value-separator (%x2C comma). Insignificant whitespace (space, tab, line feed, carriage return) is allowed before or after any structural character.'
