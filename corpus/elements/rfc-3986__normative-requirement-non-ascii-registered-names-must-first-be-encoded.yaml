document: rfc-3986
kind: normative-requirement
summary: Non-ASCII registered names must first be encoded according to UTF-8 and then each octet percent-encoded. URI producing applications must not use percent-encoding in host unless it represents a UTF-8 character sequence. For internationalized domain names intended for DNS resolution, the name must be transformed to IDNA encoding prior to lookup.
section: 3.2.2
rfc2119_level: MUST NOT
topics:
    - dns
