document: rfc-3986
kind: wire-format
summary: 'Unreserved characters are defined as: unreserved = ALPHA / DIGIT / "-" / "." / "_" / "~". URIs differing only in percent-encoding of unreserved characters are equivalent; normalizers should decode percent-encoded unreserved characters rather than leaving them encoded.'
section: "2.3"
topics:
    - http
