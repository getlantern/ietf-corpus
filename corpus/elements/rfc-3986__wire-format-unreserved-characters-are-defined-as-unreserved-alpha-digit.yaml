document: rfc-3986
kind: wire-format
summary: 'Unreserved characters are defined as: unreserved = ALPHA / DIGIT / "-" / "." / "_" / "~". URIs that differ only in the replacement of an unreserved character with its percent-encoded equivalent identify the same resource.'
