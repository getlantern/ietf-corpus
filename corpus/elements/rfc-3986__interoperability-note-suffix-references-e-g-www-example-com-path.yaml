document: rfc-3986
kind: interoperability-note
summary: Suffix references (e.g., "www.example.com/path") are frequently used in traditional media but are not formal URI syntax and rely on application-specific heuristics that change over time. They should be avoided in machine-readable contexts and must never be used in situations where long-term references are expected.
section: "4.5"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
