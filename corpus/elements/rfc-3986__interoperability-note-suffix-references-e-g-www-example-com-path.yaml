document: rfc-3986
kind: interoperability-note
summary: Suffix references (e.g., "www.example.com/path") are commonly used in traditional media but rely on context heuristics that change over time. They should be avoided in machine-readable or long-term references and cannot be used where a relative reference is expected.
section: "4.5"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-11"
