document: rfc-3986
kind: interoperability-note
summary: Suffix references (e.g., "www.example.com/path") lack a standard set of disambiguation heuristics and those heuristics change over time. They should be avoided whenever possible and never used where long-term references are expected.
section: "4.5"
topics:
    - http
