document: rfc-7159
kind: registry
summary: RFC 7159 updates the MIME media type registration for 'application/json'. The registration specifies no required or optional parameters, binary encoding considerations, and no 'charset' parameter (adding one has no effect on compliant recipients). File extension is .json.
