document: rfc-7159
kind: design-rationale
summary: RFC 7159 expands the definition of a valid JSON text from 'object or array' (RFC 4627) to 'any JSON value'. This change was made because the stricter constraint was inconsistent with other JSON specifications and with widespread implementation practice; generators that produce only objects or arrays remain interoperable.
section: "1.3"
topics:
    - json
