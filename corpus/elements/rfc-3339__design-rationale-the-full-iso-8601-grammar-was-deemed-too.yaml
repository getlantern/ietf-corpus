document: rfc-3339
kind: design-rationale
summary: The full ISO 8601 grammar was deemed too complex for Internet protocols; this document defines a strict conformant subset that makes most fields and punctuation mandatory, eliminating rarely used options (except fractional seconds) to reduce parsing bugs from untested code paths.
section: "5.5"
