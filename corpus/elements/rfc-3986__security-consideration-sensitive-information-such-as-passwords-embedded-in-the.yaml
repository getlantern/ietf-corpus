document: rfc-3986
kind: security-consideration
summary: Sensitive information such as passwords embedded in the userinfo component is exposed in every request, referrer headers, server logs, and browser history. Passing authentication information in clear text in a URI has proven a security risk in almost every case.
section: "7.5"
topics:
