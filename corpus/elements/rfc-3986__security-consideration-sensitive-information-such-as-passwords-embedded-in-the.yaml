document: rfc-3986
kind: security-consideration
summary: Sensitive information such as passwords embedded in the userinfo component should be avoided because URIs may be stored in logs, bookmarks, referrer headers, or transmitted in plain text. Clear-text passing of authentication information in URIs has proven to be a security risk in nearly every case.
section: "7.5"
topics:
    - security
    - http
    - privacy
