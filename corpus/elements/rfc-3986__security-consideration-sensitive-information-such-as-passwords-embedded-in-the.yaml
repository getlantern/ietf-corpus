document: rfc-3986
kind: security-consideration
summary: Sensitive information such as passwords embedded in the userinfo component may be inadvertently exposed in server logs, referrer headers, and browsing history. Applications should not include sensitive information in URIs and should render userinfo passwords as redacted or absent.
section: "7.5"
topics:
    - security
    - privacy
