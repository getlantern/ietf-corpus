document: rfc-3986
kind: security-consideration
summary: Sensitive information such as passwords embedded in the userinfo component of a URI is a security risk. Applications may choose to ignore or reject userinfo password data when received as part of a reference, and SHOULD reject its storage in unencrypted form.
section: "7.5"
topics:
    - security
    - http
