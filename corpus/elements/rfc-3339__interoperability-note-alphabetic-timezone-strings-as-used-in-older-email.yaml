document: rfc-3339
kind: interoperability-note
summary: Alphabetic timezone strings (as used in older email formats) have resulted in poor interoperability; RFC 2822 therefore made numeric offsets mandatory. RFC 3339 follows this precedent by requiring numeric time-numoffset.
section: "4.2"
topics:
    - email
