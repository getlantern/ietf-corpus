document: rfc-7159
kind: normative-requirement
summary: JSON text SHALL be encoded in UTF-8, UTF-16, or UTF-32. The default encoding is UTF-8, and UTF-8-encoded texts are the most widely readable; many implementations cannot successfully read UTF-16 or UTF-32.
section: "8.1"
rfc2119_level: REQUIRED
topics:
    - json
