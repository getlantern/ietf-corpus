document: rfc-7159
kind: normative-requirement
summary: JSON text SHALL be encoded in UTF-8, UTF-16, or UTF-32. The default encoding is UTF-8; UTF-8-encoded texts are interoperable in the sense that the maximum number of implementations can read them.
