document: rfc-7159
kind: normative-requirement
summary: JSON text SHALL be encoded in UTF-8, UTF-16, or UTF-32, with UTF-8 as the default. Implementations MUST NOT add a byte order mark (BOM) to the beginning of a JSON text; parsers MAY ignore a BOM rather than treating it as an error.
section: "8.1"
rfc2119_level: MUST NOT
topics:
    - json
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-18"
