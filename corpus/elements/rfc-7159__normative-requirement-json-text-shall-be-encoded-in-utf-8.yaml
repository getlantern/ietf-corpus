document: rfc-7159
kind: normative-requirement
summary: JSON text SHALL be encoded in UTF-8, UTF-16, or UTF-32. UTF-8 is the default and most interoperable encoding, as many implementations cannot successfully read UTF-16 or UTF-32.
section: "8.1"
rfc2119_level: REQUIRED
