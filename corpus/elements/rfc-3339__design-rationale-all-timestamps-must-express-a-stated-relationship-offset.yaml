document: rfc-3339
kind: design-rationale
summary: All timestamps must express a stated relationship (offset) to UTC. The specification explicitly excludes unqualified local time because interpretation would fail for approximately 23/24 of the globe, making its interoperability problems unacceptable.
section: "4.4"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-13"
