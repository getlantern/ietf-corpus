document: rfc-3339
kind: design-rationale
summary: The format restricts the hour to values 00-23, explicitly excluding the ISO 8601 value of 24, in order to reduce confusion. ISO 8601 permits hour 24 to denote midnight at end of day.
section: "5.7"
