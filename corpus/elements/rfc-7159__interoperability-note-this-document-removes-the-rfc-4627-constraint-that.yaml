document: rfc-7159
kind: interoperability-note
summary: This document removes the RFC 4627 constraint that a JSON text must be an object or array; a JSON text may now be any JSON value. Implementations generating only objects or arrays remain interoperable with all conforming parsers.
section: "2"
topics:
    - json
