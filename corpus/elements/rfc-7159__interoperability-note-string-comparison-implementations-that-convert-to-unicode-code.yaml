document: rfc-7159
kind: interoperability-note
summary: String comparison implementations that convert to Unicode code unit sequences and compare numerically are interoperable; implementations that compare escaped characters without decoding may incorrectly find 'a\\b' and 'a\u005Cb' unequal.
