document: rfc-7159
kind: interoperability-note
summary: The ABNF grammar permits member names and string values to contain bit sequences that cannot encode valid Unicode characters, such as "\uDEAD" (a single unpaired UTF-16 surrogate). Software receiving such values behaves unpredictably and may suffer fatal runtime exceptions.
section: "8.2"
topics:
    - json
