document: rfc-3339
kind: design-rationale
summary: Date and time components are ordered from most significant (year) to least significant (second), so that timestamps with the same time zone and fractional-second precision can be sorted lexicographically using a simple string comparison (e.g., C's strcmp()).
section: "5.1"
