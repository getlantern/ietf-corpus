summary: 'The host subcomponent is: host = IP-literal / IPv4address / reg-name. IPv6 and future IP literals are enclosed in square brackets (the only place square brackets are allowed in URI syntax); IPv4address uses dotted-decimal notation with exactly four decimal octets 0–255.'
