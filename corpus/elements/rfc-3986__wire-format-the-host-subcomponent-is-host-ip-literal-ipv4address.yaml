document: rfc-3986
kind: wire-format
summary: 'The host subcomponent is: host = IP-literal / IPv4address / reg-name. IPv6 and future IP version literals are enclosed in square brackets (IP-literal = "[" ( IPv6address / IPvFuture ) "]"); only the standard dotted-decimal four-octet form is allowed for IPv4 by this grammar.'
