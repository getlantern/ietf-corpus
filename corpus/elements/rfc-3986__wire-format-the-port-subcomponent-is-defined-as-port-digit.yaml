document: rfc-3986
kind: wire-format
summary: The port subcomponent is defined as port = *DIGIT, an optional decimal number following the host delimited by a single colon. Producers and normalizers should omit the port and its ":" delimiter when the port is empty or equals the scheme's default.
section: 3.2.3
