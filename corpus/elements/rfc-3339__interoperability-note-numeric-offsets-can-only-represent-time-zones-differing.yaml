document: rfc-3339
kind: interoperability-note
summary: Numeric offsets can only represent time zones differing from UTC by an integral number of minutes. Many historical time zones differ by a non-integral number of minutes (e.g., Netherlands at +00:19:32.13); applications must convert such timestamps to the closest representable UTC offset.
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-07-26"
