summary: A string is zero or more Unicode characters enclosed in quotation marks (%x22). Characters U+0000–U+001F, quotation mark, and reverse solidus must be escaped. Escape sequences use `\uXXXX` (six characters) for BMP characters or a 12-character UTF-16 surrogate pair sequence for characters outside the BMP.
