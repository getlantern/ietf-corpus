document: rfc-3339
kind: design-rationale
summary: Numeric UTC offsets are mandatory (replacing alphabetic timezone labels) because alphabetic strings caused poor interoperability in early Internet mail, as documented in RFC 822 and RFC 1123. Numeric offsets are calculated as local time minus UTC.
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-06"
