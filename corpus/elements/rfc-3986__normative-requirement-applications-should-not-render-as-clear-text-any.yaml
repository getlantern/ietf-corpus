document: rfc-3986
kind: normative-requirement
summary: Applications SHOULD NOT render as clear text any data after the first colon in a userinfo subcomponent unless that data is empty (indicating no password). The "user:password" format in userinfo is deprecated, as passing authentication information in clear text has proven to be a security risk in almost every case.
section: 3.2.1
rfc2119_level: SHOULD NOT
topics:
    - http
    - security
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-18"
