document: rfc-3986
kind: security-consideration
summary: Sensitive information such as passwords in userinfo or credentials in query components should not be included in URIs, as such data may be stored in logs, referrer headers, or browser history. The passing of authentication information in clear text has proven to be a security risk in virtually every case it has been used.
section: "7.5"
topics:
    - security
