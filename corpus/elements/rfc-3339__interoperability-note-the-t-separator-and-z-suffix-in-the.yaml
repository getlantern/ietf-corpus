document: rfc-3339
kind: interoperability-note
summary: The "T" separator and "Z" suffix in the date-time syntax may alternatively be lower-case "t" or "z" per ABNF and ISO 8601, but applications generating the format should prefer upper case. Some environments (e.g., XML) may further restrict to require upper case.
section: "5.6"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
