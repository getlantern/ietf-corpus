document: rfc-3986
kind: protocol-element
summary: 'The path uses five ABNF rules: path-abempty (begins with "/" or empty), path-absolute (begins with "/" but not "//"), path-noscheme (non-colon first segment), path-rootless (segment first), and path-empty. Dot-segments "." and ".." express relative position in the hierarchy and are removed during reference resolution.'
section: "3.3"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-25"
