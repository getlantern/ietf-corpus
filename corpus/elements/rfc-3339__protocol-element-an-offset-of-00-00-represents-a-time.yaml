document: rfc-3339
kind: protocol-element
summary: An offset of "-00:00" represents a time where the UTC value is known but the local offset is unknown. This differs semantically from "+00:00" or "Z", which imply UTC is the preferred reference point. This convention mirrors RFC 2822 email practice.
section: "4.3"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
