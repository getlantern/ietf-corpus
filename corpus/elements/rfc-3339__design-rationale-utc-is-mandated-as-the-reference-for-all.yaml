document: rfc-3339
kind: design-rationale
summary: UTC is mandated as the reference for all Internet timestamps because daylight saving rules for local time zones are convoluted, can change unpredictably based on local law, and prevent true interoperability. The specification explicitly does not cater to local time zone rules.
section: "4.1"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
