document: rfc-3986
kind: protocol-element
summary: Reserved characters are split into gen-delims (":", "/", "?", "#", "[", "]", "@") and sub-delims ("!", "$", "&", "'", "(", ")", "*", "+", ",", ";", "="). They serve as structural delimiters; URIs differing only in whether a reserved character is percent-encoded are not equivalent.
section: "2.2"
