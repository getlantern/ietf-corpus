document: rfc-3986
kind: protocol-element
summary: Reserved characters are split into gen-delims (":", "/", "?", "#", "[", "]", "@") and sub-delims ("!", "$", "&", "'", "(", ")", "*", "+", ",", ";", "="). URIs differing only in whether a reserved character is percent-encoded versus literal are not equivalent and cannot be compared interchangeably.
section: "2.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
