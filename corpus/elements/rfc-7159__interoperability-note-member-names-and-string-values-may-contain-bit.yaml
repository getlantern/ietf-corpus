document: rfc-7159
kind: interoperability-note
summary: Member names and string values may contain bit sequences that cannot encode valid Unicode characters (e.g., unpaired UTF-16 surrogates such as '\uDEAD'). The behavior of software receiving such values is unpredictable and may cause fatal runtime exceptions.
section: "8.2"
