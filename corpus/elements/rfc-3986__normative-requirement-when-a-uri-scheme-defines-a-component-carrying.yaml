document: rfc-3986
kind: normative-requirement
summary: When a URI scheme defines a component carrying UCS textual data, the data SHOULD first be encoded as UTF-8 octets and only non-unreserved octets percent-encoded. URI producing applications MUST NOT use percent-encoding in the host component unless it is used to represent a UTF-8 character sequence.
section: "2.5"
rfc2119_level: MUST NOT
topics:
    - dns
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
