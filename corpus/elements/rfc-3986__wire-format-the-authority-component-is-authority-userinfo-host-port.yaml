document: rfc-3986
kind: wire-format
summary: 'The authority component is: authority = [ userinfo "@" ] host [ ":" port ]. The host is one of: IP-literal (IPv6 or IPvFuture in square brackets), IPv4address in four-octet dotted-decimal notation, or reg-name. The first-match-wins rule disambiguates IPv4address from reg-name.'
section: "3.2"
topics:
    - dns
