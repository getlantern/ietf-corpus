document: rfc-3986
kind: wire-format
summary: 'The authority component is: authority = [ userinfo "@" ] host [ ":" port ], preceded by "//" and terminated by the next "/", "?", "#", or end of URI. The host subcomponent may be an IP-literal, IPv4address, or reg-name and is case-insensitive.'
section: "3.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-09"
