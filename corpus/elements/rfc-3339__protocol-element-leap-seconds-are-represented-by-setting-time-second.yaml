document: rfc-3339
kind: protocol-element
summary: Leap seconds are represented by setting time-second to '60'. A leap second inserted at end of day appears as YYYY-MM-DDT23:59:60Z and occurs simultaneously in all time zones; the point is shifted by offset in non-UTC zones.
section: "5.7"
