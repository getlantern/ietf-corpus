document: rfc-3339
kind: protocol-element
summary: Leap seconds are represented by setting time-second to "60" at the end of months in which a leap second occurs (historically June 30 or December 31), yielding timestamps of the form YYYY-MM-DDT23:59:60Z. A subtracted leap second allows time-second as low as "58".
section: "5.7"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-27"
