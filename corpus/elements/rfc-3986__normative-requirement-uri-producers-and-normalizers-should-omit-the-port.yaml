document: rfc-3986
kind: normative-requirement
summary: URI producers and normalizers SHOULD omit the port component and its ":" delimiter if the port is empty or if its value equals the scheme's default (e.g., port 80 for "http").
section: 3.2.3
rfc2119_level: SHOULD
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-20"
