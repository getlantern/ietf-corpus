document: rfc-3339
kind: design-rationale
summary: UTC is preferred over local time because daylight saving rules are convoluted and can change unpredictably based on local law. The specification explicitly does not cater to local time zone rules in order to achieve true interoperability.
section: "4.1"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-08"
