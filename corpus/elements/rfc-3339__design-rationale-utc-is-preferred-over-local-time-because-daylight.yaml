document: rfc-3339
kind: design-rationale
summary: UTC is preferred over local time because daylight saving rules for local time zones are convoluted and can change based on local law at unpredictable times. True interoperability is best achieved using UTC, and the specification explicitly does not cater to local time zone rules.
section: "4.1"
