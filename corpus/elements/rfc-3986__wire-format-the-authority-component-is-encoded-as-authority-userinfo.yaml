document: rfc-3986
kind: wire-format
summary: 'The authority component is encoded as: authority = [ userinfo "@" ] host [ ":" port ], preceded by "//" and terminated by the next "/", "?", "#", or end of URI. Userinfo is: userinfo = *( unreserved / pct-encoded / sub-delims / ":" ).'
section: "3.2"
