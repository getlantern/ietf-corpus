document: rfc-3986
kind: normative-requirement
summary: When a new URI scheme component represents Universal Character Set text, data SHOULD first be encoded as UTF-8 octets, and only those octets outside the unreserved set should be percent-encoded. This ensures non-ASCII characters are represented uniformly.
section: "2.5"
rfc2119_level: SHOULD
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-13"
