document: rfc-7159
kind: interoperability-note
summary: Implementations that compare object member names by converting escape sequences to Unicode code units and comparing numerically (code unit by code unit) are interoperable. Implementations that compare escaped characters unconverted may incorrectly find that `"a\\b"` and `"a\u005Cb"` are not equal.
section: "8.3"
topics:
    - json
