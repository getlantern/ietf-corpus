document: rfc-7159
kind: interoperability-note
summary: Implementations that compare object member names by converting to Unicode code-unit sequences and comparing numerically are interoperable. Implementations that compare escaped and unescaped representations directly may incorrectly treat 'a\\b' and 'a\u005Cb' as unequal.
section: "8.3"
topics:
