document: rfc-3986
kind: interoperability-note
summary: Some parsers allow a scheme name to appear in a relative reference if it matches the base URI scheme — a loophole from RFC 1630. Its use should be avoided but is allowed for backward compatibility. Strict parsers and non-strict parsers will resolve "http:g" against an http base URI differently.
section: 5.4.2
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
