document: rfc-3986
kind: security-consideration
summary: Back-end transcoding between character encodings (e.g., EBCDIC to UTF-8) applied to URI components can alter percent-encoded sequences in ways that bypass security filters. All security-relevant URI processing must occur after a single, consistent decode step.
section: "7.3"
topics:
    - security
