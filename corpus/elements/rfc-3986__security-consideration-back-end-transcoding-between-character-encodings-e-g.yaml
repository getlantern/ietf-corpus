document: rfc-3986
kind: security-consideration
summary: Back-end transcoding between character encodings (e.g., EBCDIC to UTF-8) can introduce double-encoding or incorrect decoding of percent-encoded octets if implementations fail to decode before transcoding, potentially producing incorrect resource identifiers.
section: "7.3"
topics:
