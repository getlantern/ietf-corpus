document: rfc-7159
kind: interoperability-note
summary: This revision removed the RFC 4627 constraint that a JSON text must be an object or array; a JSON text can now be any JSON value. Implementations that generate only objects or arrays remain interoperable as all implementations will accept these.
section: "2"
topics:
    - json
