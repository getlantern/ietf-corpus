document: rfc-3986
kind: normative-requirement
summary: If data for a URI component would conflict with a reserved character's role as a delimiter, the conflicting data MUST be percent-encoded before the URI is formed. A reserved character found in a component with no known delimiting role must be interpreted as the data octet of its US-ASCII encoding.
section: "2.2"
rfc2119_level: MUST
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-20"
