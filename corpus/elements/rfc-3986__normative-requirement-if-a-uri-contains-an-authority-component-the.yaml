document: rfc-3986
kind: normative-requirement
summary: If a URI contains an authority component, the path must either be empty or begin with "/". If no authority is present, the path cannot begin with "//". A relative-path reference's first segment cannot contain ":" as it would be mistaken for a scheme name.
section: "3.3"
rfc2119_level: MUST
topics:
    - http
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-23"
