document: rfc-3986
kind: security-consideration
summary: Sensitive information such as passwords, keys, and local file paths should not be embedded in URIs because URIs are routinely shared, logged, cached, and displayed. The deprecated userinfo "user:password" format in particular passes credentials in the clear to any party that observes the URI.
section: "7.5"
topics:
    - security
    - privacy
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
