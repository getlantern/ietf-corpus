document: rfc-7159
kind: interoperability-note
summary: Good interoperability is achieved by implementations that expect no more precision or range than IEEE 754-2008 binary64 (double precision). Integers in the range [-(2**53)+1, (2**53)-1] are exactly interoperable; numbers outside this range or with excessive precision may cause interoperability problems.
