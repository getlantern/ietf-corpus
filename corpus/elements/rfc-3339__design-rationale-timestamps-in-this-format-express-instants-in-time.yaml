document: rfc-3339
kind: design-rationale
summary: Timestamps in this format express instants in time only; time periods, intervals, and recurring events are explicitly out of scope. All dates and times are assumed to be in the current era (0000AD–9999AD) with a stated UTC offset.
section: "1"
