document: rfc-3339
kind: interoperability-note
summary: If a 2-digit year is received, it should be accepted ONLY if an incorrect interpretation will not cause a protocol or processing failure (e.g., if used only for logging or tracing). Programs should also handle broken software that represents post-1999 years as three digits or non-numeric decades.
section: "3"
