document: rfc-3986
kind: protocol-element
summary: A fragment identifier is indicated by "#" and terminated by end of URI. Fragment semantics are defined by the media type of the retrieved representation, are independent of the URI scheme, and are processed solely by the user agent; the fragment is separated from the rest of the URI prior to any dereference and is never sent to the server.
section: "3.5"
topics:
    - http
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-18"
