document: rfc-3986
kind: normative-requirement
summary: The remove_dot_segments algorithm must be applied after path extraction to eliminate "." and ".." complete path segments from the target URI path. More ".." segments than hierarchical levels in the base path are silently consumed rather than treated as errors.
section: 5.2.4
rfc2119_level: MUST
topics:
    - http
