document: rfc-3986
kind: normative-requirement
summary: A base URI used for relative reference resolution MUST conform to the absolute-URI syntax rule and MUST be stripped of any fragment component before use. If obtained from a URI reference, it must first be converted to absolute form.
section: "5.1"
rfc2119_level: MUST
topics:
    - http
