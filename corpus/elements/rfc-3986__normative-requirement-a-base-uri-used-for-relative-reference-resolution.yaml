document: rfc-3986
kind: normative-requirement
summary: A base URI used for relative reference resolution MUST conform to the absolute-URI syntax rule (scheme, hier-part, optional query, no fragment). If the base URI was itself obtained from a URI reference, it must be converted to absolute form and stripped of any fragment before use.
section: "5.1"
rfc2119_level: MUST
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-20"
