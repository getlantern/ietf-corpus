document: rfc-7159
kind: design-rationale
summary: RFC 7159 changes the definition of 'JSON text' from RFC 4627's constraint (object or array only) to allow any JSON value, including primitives. This reflects observed practice and improves consistency with ECMAScript and ECMA-404 specifications.
section: "1.3"
topics:
    - json
