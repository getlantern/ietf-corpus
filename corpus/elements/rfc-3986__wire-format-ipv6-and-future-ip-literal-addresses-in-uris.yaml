document: rfc-3986
kind: wire-format
summary: 'IPv6 and future IP literal addresses in URIs are enclosed in square brackets: IP-literal = "[" ( IPv6address / IPvFuture ) "]". IPvFuture uses a version flag "v" followed by hex digits and a dot; this bracketed form is the only place square brackets are permitted in URI syntax.'
section: 3.2.2
topics:
