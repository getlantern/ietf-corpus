document: rfc-7159
kind: security-consideration
summary: Using JavaScript's eval() function (or eval()-like functions in other languages) to parse JSON texts constitutes an unacceptable security risk because the text could contain executable code along with data declarations. JSON is a subset of JavaScript that excludes assignment and invocation, but eval() does not enforce this constraint.
section: "12"
topics:
    - json
    - security
