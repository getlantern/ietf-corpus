summary: 'Date fields use fixed-width decimal: date-fullyear = 4DIGIT, date-month = 2DIGIT (01-12), date-mday = 2DIGIT (01-28/29/30/31 depending on month/year). All punctuation (hyphens, colons, "T") is mandatory.'
