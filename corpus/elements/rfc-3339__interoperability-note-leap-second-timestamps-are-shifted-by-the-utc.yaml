document: rfc-3339
kind: interoperability-note
summary: Leap second timestamps are shifted by the UTC offset in non-Z time zones, occurring at the same instant globally. For example, a leap second at 23:59:60Z also appears as 15:59:60-08:00 in Pacific Standard Time.
section: "5.7"
