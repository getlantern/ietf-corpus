document: rfc-3339
kind: interoperability-note
summary: Attempts to label local time-zone offsets with alphabetic strings (as in early RFC 822) have caused poor interoperability; RFC 2822 therefore mandates numeric offsets, and this profile inherits that requirement.
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-11"
