document: rfc-3986
kind: design-rationale
summary: The fragment identifier is resolved client-side rather than sent to the server in order to prevent information providers from denying reference authors the right to selectively refer to content within a resource. This also lets new media types define their own fragment semantics without requiring new URI schemes.
section: "3.5"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
