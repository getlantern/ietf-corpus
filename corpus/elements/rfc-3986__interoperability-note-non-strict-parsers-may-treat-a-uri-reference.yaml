document: rfc-3986
kind: interoperability-note
summary: Non-strict parsers may treat a URI reference as relative even when it contains a scheme component identical to the base URI's scheme, a behavior identified as a loophole in RFC 1630. Strict parsers must not apply this rule; its use should be avoided but is allowed for backward compatibility.
section: 5.2.2
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-09"
