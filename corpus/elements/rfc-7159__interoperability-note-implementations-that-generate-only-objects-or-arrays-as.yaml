document: rfc-7159
kind: interoperability-note
summary: Implementations that generate only objects or arrays as top-level JSON texts remain interoperable with all conforming parsers, even though RFC 7159 expanded the definition to allow any value as a JSON text. Senders restricting to object or array achieve backward compatibility with RFC 4627 receivers.
section: "2"
topics:
