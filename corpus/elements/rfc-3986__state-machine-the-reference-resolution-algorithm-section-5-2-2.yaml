document: rfc-3986
kind: state-machine
summary: 'The reference resolution algorithm (Section 5.2.2) transforms a URI reference R into target URI T by: if R has a scheme, use R''s components verbatim; else if R has authority, use base scheme plus R''s components; else merge paths from base URI and apply remove_dot_segments.'
section: 5.2.2
