document: rfc-3986
kind: interoperability-note
summary: Some parsers allow the scheme name in a relative reference if it matches the base URI scheme (a loophole in RFC 1630). Its use should be avoided but is allowed for backward compatibility; strict parsers treat it as an absolute URI.
section: 5.4.2
topics:
    - http
