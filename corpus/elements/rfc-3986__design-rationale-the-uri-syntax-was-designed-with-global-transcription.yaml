document: rfc-3986
kind: design-rationale
summary: The URI syntax was designed with global transcription as a primary goal, restricting characters to the basic Latin alphabet, digits, and a few special characters so URIs can be written on paper and re-entered on any keyboard. The ability to transcribe a URI across media was considered more important than having maximally meaningful component names.
section: 1.2.1
extracted_by: claude-sonnet-4-6
