document: rfc-3339
kind: normative-requirement
summary: A gateway host correcting unqualified local times MUST correct those times before transmitting to other hosts. Unqualified local time is deemed unacceptable for the Internet because interpretation fails in approximately 23/24 of the globe.
section: "4.4"
rfc2119_level: MUST
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-06"
