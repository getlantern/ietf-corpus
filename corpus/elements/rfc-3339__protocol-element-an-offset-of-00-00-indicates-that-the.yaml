document: rfc-3339
kind: protocol-element
summary: An offset of '-00:00' indicates that the time in UTC is known but the offset to local time is unknown. This is semantically distinct from '+00:00' or 'Z', which imply UTC is the preferred reference point.
section: "4.3"
extracted_by: claude-sonnet-4-6
