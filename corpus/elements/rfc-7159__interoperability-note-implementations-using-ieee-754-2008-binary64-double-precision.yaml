document: rfc-7159
kind: interoperability-note
summary: Implementations using IEEE 754-2008 binary64 (double precision) achieve good interoperability; integers in the range [-(2**53)+1, (2**53)-1] are exactly interoperable. Numbers requiring greater magnitude or precision (e.g., 1E400) indicate potential interoperability problems.
