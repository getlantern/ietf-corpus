document: rfc-7159
kind: interoperability-note
summary: Implementations using IEEE 754-2008 binary64 (double precision) achieve good interoperability for numbers within that range and precision. Integer values in the range [-(2**53)+1, (2**53)-1] are exactly interoperable. Numbers like 1E400 or high-precision decimals indicate potential interoperability problems.
