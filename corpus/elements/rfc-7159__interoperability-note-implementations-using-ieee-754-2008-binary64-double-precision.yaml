document: rfc-7159
kind: interoperability-note
summary: Implementations using IEEE 754-2008 binary64 (double precision) achieve good interoperability for numbers within that range and precision. Integers in [-(2**53)+1, (2**53)-1] are exactly interoperable. Numbers such as 1E400 or very long decimals may cause interoperability failures.
