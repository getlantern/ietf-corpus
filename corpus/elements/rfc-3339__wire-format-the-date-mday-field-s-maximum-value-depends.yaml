document: rfc-3339
kind: wire-format
summary: 'The date-mday field''s maximum value depends on month and year: 28 for February in a normal year, 29 in a leap year, 30 for April/June/September/November, and 31 for the remaining months. A year is a leap year if divisible by 4, except centennial years must also be divisible by 400.'
section: "5.7"
