document: rfc-3339
kind: interoperability-note
summary: ISO 8601 numeric offsets represent only time zones differing from UTC by an integral number of minutes. Historical time zones with non-integral offsets (e.g., Netherlands +00:19:32.13) must be converted to the closest representable UTC offset.
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-25"
