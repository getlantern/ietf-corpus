document: rfc-3339
kind: interoperability-note
summary: ISO 8601 numeric offsets represent only time zones differing from UTC by an integral number of minutes. Applications dealing with historical timestamps from zones with non-integral-minute offsets must convert them to a representable zone before encoding.
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-27"
