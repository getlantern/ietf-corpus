document: rfc-3339
kind: interoperability-note
summary: ISO 8601 numeric offsets represent only time zones differing from UTC by an integral number of minutes. Many historical time zones differ by a non-integral number of minutes; applications must convert such timestamps to the nearest representable UTC offset (as illustrated by the 1937 Netherlands example at +00:20).
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
