document: rfc-3339
kind: interoperability-note
summary: ISO 8601 numeric offsets represent only time zones differing from UTC by an integral number of minutes. Historical time zones with non-integral offsets cannot be represented exactly and require rounding to the nearest representable value.
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-04"
