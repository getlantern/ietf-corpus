document: rfc-3986
kind: design-rationale
summary: 'URI characters are restricted to basic Latin letters, digits, and a few special characters primarily to support global transcription: a URI must be writable on paper, typeable across keyboard layouts, and transferable between media. This requirement outweighed the goal of allowing maximally expressive component names.'
section: 1.2.1
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-13"
