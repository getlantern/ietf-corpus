document: rfc-3986
kind: protocol-element
summary: 'The remove_dot_segments algorithm resolves "." and ".." complete path segments using an input/output buffer loop: "./" and "../" prefixes are stripped; "/." prefix is replaced with "/"; "/.." prefix is replaced with "/" and the last output segment is removed; lone "." or ".." are deleted; otherwise the first path segment moves to output. Excess ".." segments cannot traverse above the root.'
section: 5.2.4
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-20"
