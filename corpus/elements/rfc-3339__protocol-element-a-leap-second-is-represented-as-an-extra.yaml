document: rfc-3339
kind: protocol-element
summary: A leap second is represented as an extra second at the end of a day in UTC with a timestamp of the form YYYY-MM-DDT23:59:60Z. In non-UTC zones, the leap second point is shifted by the zone offset so it occurs at the same instant globally.
section: D
