document: rfc-3339
kind: protocol-element
summary: Numeric offsets represent only time zones that differ from UTC by an integral number of minutes, per ISO 8601. Historical time zones with non-integral minute offsets (e.g., Netherlands +00:19:32.13) must be approximated to the nearest representable offset.
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-18"
