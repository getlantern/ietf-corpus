document: rfc-7159
kind: protocol-element
summary: 'A JSON text is a serialized value: any JSON value (object, array, number, string, true, false, or null), optionally surrounded by insignificant whitespace. RFC 7159 removes the RFC 4627 constraint that a JSON text must be an object or array.'
