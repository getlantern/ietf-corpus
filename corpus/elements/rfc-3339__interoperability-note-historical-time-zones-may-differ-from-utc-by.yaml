document: rfc-3339
kind: interoperability-note
summary: Historical time zones may differ from UTC by a non-integral number of minutes (e.g., Netherlands was +00:19:32.13 before 1937). Such timestamps cannot be represented exactly and must be converted to the nearest representable UTC offset.
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
