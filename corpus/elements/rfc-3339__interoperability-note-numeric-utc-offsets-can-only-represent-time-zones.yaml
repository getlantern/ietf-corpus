document: rfc-3339
kind: interoperability-note
summary: Numeric UTC offsets can only represent time zones that differ from UTC by an integral number of minutes, per ISO 8601. Historical time zones with non-integral minute offsets (e.g., Netherlands pre-1937 at +00:19:32.13) must be approximated to the nearest representable offset.
section: "4.2"
