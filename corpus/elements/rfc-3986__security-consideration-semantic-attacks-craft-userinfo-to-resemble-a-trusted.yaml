document: rfc-3986
kind: security-consideration
summary: Semantic attacks craft userinfo to resemble a trusted hostname, e.g., "http://trusted.example.com@malicious.example.com/". Applications rendering URIs for user feedback SHOULD visually distinguish the userinfo subcomponent from the host to prevent such deception.
section: "7.6"
topics:
    - security
    - http
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-27"
