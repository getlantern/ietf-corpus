document: rfc-3339
kind: design-rationale
summary: Alphabetic time zone abbreviations (e.g., "EST", "PST") were rejected because past attempts to label local offsets with alphabetic strings resulted in poor interoperability. RFC 2822 mandated numeric offsets for the same reason.
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-27"
