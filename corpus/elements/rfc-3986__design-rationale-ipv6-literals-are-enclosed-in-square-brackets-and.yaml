document: rfc-3986
kind: design-rationale
summary: IPv6 literals are enclosed in square brackets ("[" and "]") to unambiguously distinguish them from the colon-delimited port in the authority component. Square brackets are the only place in URI syntax where these characters are allowed, and a version flag ("v" HEXDIG ".") is reserved for future IP literal formats.
section: 3.2.2
topics:
