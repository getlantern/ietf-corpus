document: rfc-3986
kind: wire-format
summary: 'Percent-encoding represents a data octet as a character triplet: the "%" character followed by two hexadecimal digits (pct-encoded = "%" HEXDIG HEXDIG). Uppercase and lowercase hex digits are equivalent; URI producers should use uppercase for consistency.'
section: "2.1"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
