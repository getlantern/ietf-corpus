document: rfc-3986
kind: wire-format
summary: 'Percent-encoding represents a data octet as a character triplet: the percent character "%" followed by two hexadecimal digits (pct-encoded = "%" HEXDIG HEXDIG). Uppercase A–F are equivalent to lowercase a–f; URI producers and normalizers should use uppercase for all percent-encodings.'
section: "2.1"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
