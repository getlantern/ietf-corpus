document: rfc-3986
kind: wire-format
summary: 'Percent-encoding represents a data octet as a three-character triplet: "%" followed by exactly two hexadecimal digits (e.g., "%20" for the space character). Uppercase hex digits A–F are equivalent to a–f.'
