document: rfc-3986
kind: wire-format
summary: 'Percent-encoding represents a data octet as a triplet: the percent character "%" followed by two uppercase hexadecimal digits (`pct-encoded = "%" HEXDIG HEXDIG`). Uppercase and lowercase hex digits are equivalent; producers and normalizers should use uppercase.'
section: "2.1"
topics:
    - http
