document: rfc-3986
kind: wire-format
summary: 'Percent-encoding represents a data octet as a three-character triplet: the percent character "%" followed by two uppercase hexadecimal digits (pct-encoded = "%" HEXDIG HEXDIG). Uppercase hex digits A-F are equivalent to lowercase a-f; producers and normalizers should use uppercase.'
section: "2.1"
topics:
    - http
