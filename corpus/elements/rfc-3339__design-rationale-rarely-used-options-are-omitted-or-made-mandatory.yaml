document: rfc-3339
kind: design-rationale
summary: 'Rarely used options are omitted or made mandatory to avoid interoperability failures: bugs in parsers for rarely used options are unlikely to be caught in testing. Fractional seconds is the only retained optional field, expected only for applications requiring strict ordering or unusual precision.'
section: "5.3"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-11"
