document: rfc-3986
kind: interoperability-note
summary: The fragment identifier is separated from the rest of the URI prior to any dereference and resolved solely by the user agent, regardless of URI scheme. In standard HTTP, the fragment is never transmitted to the origin server.
section: "3.5"
topics:
