document: rfc-3986
kind: interoperability-note
summary: Some older parsers fail to separate a reference's query or fragment from the path before merging with the base path and removing dot-segments, causing failures when query strings contain "/./" or "/../". Compliant implementations must separate all components prior to path merge.
section: 5.2.4
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-13"
