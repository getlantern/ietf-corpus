document: rfc-7159
kind: protocol-element
summary: 'An object is zero or more name/value members enclosed in curly brackets, where each name is a string, separated from its value by a colon, and successive members are separated by commas. The grammar is: `object = begin-object [ member *( value-separator member ) ] end-object`.'
