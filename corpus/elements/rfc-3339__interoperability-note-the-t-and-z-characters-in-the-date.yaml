document: rfc-3339
kind: interoperability-note
summary: The "T" and "Z" characters in the date-time syntax may alternatively be lowercase "t" or "z" per [ABNF] and ISO 8601. Implementors in case-sensitive environments (e.g., XML) should be aware of this optionality.
section: "5.6"
