document: rfc-3339
kind: interoperability-note
summary: The "T" and "Z" characters in the date-time syntax may alternatively be lowercase "t" or "z" per [ABNF] and ISO 8601, but generators SHOULD produce uppercase to avoid issues in case-sensitive environments.
section: "5.6"
