document: rfc-3339
kind: design-rationale
summary: Numeric UTC offsets are used instead of alphabetic time zone strings because attempts to label local offsets with alphabetic strings resulted in poor interoperability historically. As a result, RFC 2822 made numeric offsets mandatory, and this profile follows that precedent.
section: "4.2"
