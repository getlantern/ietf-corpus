document: rfc-7159
kind: interoperability-note
summary: Integer values in the range [-(2^53)+1, (2^53)-1] are interoperable across implementations using IEEE 754-2008 binary64 (double precision). Numbers with greater magnitude or precision (e.g., 1E400) may not be representable and indicate potential interoperability problems.
