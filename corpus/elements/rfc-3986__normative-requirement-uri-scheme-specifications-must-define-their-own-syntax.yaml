document: rfc-3986
kind: normative-requirement
summary: URI scheme specifications MUST define their own syntax so that all strings matching the scheme-specific syntax also match the absolute-URI grammar. Scheme specifications must not define fragment identifier syntax.
section: "4.3"
rfc2119_level: MUST
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-11"
