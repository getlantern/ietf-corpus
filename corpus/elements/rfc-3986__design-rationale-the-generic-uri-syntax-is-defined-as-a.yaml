document: rfc-3986
kind: design-rationale
summary: The generic URI syntax is defined as a superset of all URI scheme syntaxes, enabling scheme-independent parsing of common components (scheme, authority, path, query, fragment) without knowing scheme-specific requirements. This decouples the evolution of identification schemes from the evolution of protocols, data formats, and implementations.
section: 1.1.1
topics:
    - http
