document: rfc-3986
kind: design-rationale
summary: The generic URI syntax is defined as a superset of all valid URI scheme syntaxes. This allows scheme-independent parsing of any URI reference into its components without knowledge of scheme-specific semantics, decoupling the evolution of naming schemes from the protocols and formats that use URIs.
section: 1.1.1
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-30"
