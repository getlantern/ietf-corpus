document: rfc-3986
kind: normative-requirement
summary: URI producers and normalizers SHOULD omit the ":" delimiter separating host from port if the port component is empty, and SHOULD omit the port component entirely if its value equals the scheme's default port.
section: 3.2.3
rfc2119_level: SHOULD
