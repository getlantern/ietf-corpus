document: rfc-3339
kind: design-rationale
summary: Alphabetic time zone labels (e.g., "EST", "PST") are avoided because their use in prior email standards caused poor interoperability — RFC 2822 made numeric offsets mandatory for the same reason. Numeric offsets are unambiguous and machine-computable.
section: "4.2"
topics:
    - email
