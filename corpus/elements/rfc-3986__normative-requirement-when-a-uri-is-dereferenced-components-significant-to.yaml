document: rfc-3986
kind: normative-requirement
summary: When a URI is dereferenced, components significant to scheme-specific processing MUST be parsed and separated before percent-encoded octets within those components can be safely decoded, to prevent data being mistaken for component delimiters.
section: "2.4"
rfc2119_level: MUST
topics:
    - http
    - security
