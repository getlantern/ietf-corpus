document: rfc-3986
kind: normative-requirement
summary: When a URI is dereferenced, components significant to the scheme-specific process MUST be parsed and separated before percent-encoded octets within those components are decoded, to prevent data from being mistaken for component delimiters. Unreserved-set octets may be decoded at any time.
section: "2.4"
rfc2119_level: MUST
topics:
    - http
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-06"
