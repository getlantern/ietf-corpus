document: rfc-3986
kind: normative-requirement
summary: When a URI is dereferenced, components significant to scheme-specific processing must be parsed and separated before percent-encoded octets within those components are decoded, to prevent data from being mistaken for component delimiters.
section: "2.4"
rfc2119_level: MUST
topics:
    - security
