document: rfc-3986
kind: protocol-element
summary: Unreserved characters (ALPHA / DIGIT / "-" / "." / "_" / "~") carry no special delimiting meaning and need not be percent-encoded. A URI differing from another only by replacing an unreserved character with its percent-encoded equivalent identifies the same resource.
section: "2.3"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-13"
