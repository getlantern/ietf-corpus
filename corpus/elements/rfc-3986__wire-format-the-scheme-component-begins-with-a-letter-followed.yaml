document: rfc-3986
kind: wire-format
summary: 'The scheme component begins with a letter followed by letters, digits, "+", "-", or ".". The ABNF is: scheme = ALPHA *( ALPHA / DIGIT / "+" / "-" / "." ). Schemes are case-insensitive; canonical form is lowercase.'
