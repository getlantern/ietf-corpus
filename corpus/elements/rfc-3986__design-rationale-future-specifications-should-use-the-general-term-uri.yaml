document: rfc-3986
kind: design-rationale
summary: Future specifications should use the general term "URI" rather than the more restrictive "URL" or "URN". The URL/URN distinction depends on persistence and naming authority practice, not on the scheme itself; any scheme's instances may have characteristics of both names and locators.
section: 1.1.3
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
