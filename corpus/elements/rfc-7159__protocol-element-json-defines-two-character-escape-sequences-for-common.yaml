document: rfc-7159
kind: protocol-element
summary: JSON defines two-character escape sequences for common characters (`\"`, `\\`, `\/`, `\b`, `\f`, `\n`, `\r`, `\t`) and a six-character `\uXXXX` form for any BMP code point. Hex letters A–F may be upper or lower case in `\uXXXX` sequences.
