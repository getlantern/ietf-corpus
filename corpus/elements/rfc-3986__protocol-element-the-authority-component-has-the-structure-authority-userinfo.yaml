document: rfc-3986
kind: protocol-element
summary: 'The authority component has the structure: authority = [ userinfo "@" ] host [ ":" port ]. It is preceded by "//" and terminated by the next "/", "?", "#", or end of URI. When authority is present, the path must be empty or begin with "/".'
section: "3.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
