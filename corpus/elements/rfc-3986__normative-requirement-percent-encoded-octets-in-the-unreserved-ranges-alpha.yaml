document: rfc-3986
kind: normative-requirement
summary: Percent-encoded octets in the unreserved ranges (ALPHA, DIGIT, hyphen, period, underscore, tilde) should not be created by URI producers and should be decoded to their unreserved character equivalents by URI normalizers.
section: "2.3"
rfc2119_level: SHOULD NOT
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-30"
