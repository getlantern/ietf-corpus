document: rfc-3986
kind: protocol-element
summary: 'Base URI precedence is established in four layers from highest to lowest: base URI embedded in content (5.1.1), base URI from the encapsulating entity such as a MIME container (5.1.2), the URI used to retrieve the representation after any redirects (5.1.3), and a default application-defined base URI (5.1.4).'
section: "5.1"
