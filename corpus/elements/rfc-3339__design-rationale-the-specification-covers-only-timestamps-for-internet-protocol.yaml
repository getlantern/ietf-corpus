document: rfc-3339
kind: design-rationale
summary: The specification covers only timestamps for Internet protocol events (instants in time) and excludes time periods, intervals, and scheduling with ambiguous future daylight-saving transitions. This limited scope simplifies the format and avoids political/administrative uncertainties.
section: "1"
