document: rfc-3339
kind: design-rationale
summary: Alphabetic timezone labels (e.g. military single-letter codes) have historically caused poor interoperability in email, which is why RFC 2822 mandated numeric offsets. This specification follows the same approach, expressing all offsets numerically as local-time-minus-UTC.
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-13"
