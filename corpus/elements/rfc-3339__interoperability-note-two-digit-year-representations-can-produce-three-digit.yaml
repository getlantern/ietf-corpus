document: rfc-3339
kind: interoperability-note
summary: Two-digit year representations can produce three-digit results (year - 1900 for years after 1999) or non-numeric decade characters. Implementations wishing to handle such broken software may add 1900 to three-digit years or detect and interpret non-numeric decades appropriately.
section: "3"
