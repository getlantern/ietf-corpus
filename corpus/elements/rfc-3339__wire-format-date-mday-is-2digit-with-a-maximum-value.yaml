document: rfc-3339
kind: wire-format
summary: 'date-mday is 2DIGIT with a maximum value that varies by month and year: 28 or 29 for February (depending on leap year), 30 for April/June/September/November, and 31 for remaining months. The hour field is restricted to 00–23; ISO 8601''s value of 24 is not permitted.'
