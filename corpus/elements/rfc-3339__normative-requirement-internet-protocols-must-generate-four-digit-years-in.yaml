document: rfc-3339
kind: normative-requirement
summary: Internet protocols MUST generate four-digit years in dates. The use of 2-digit years is deprecated; if a 2-digit year is received, it should be accepted ONLY if an incorrect interpretation will not cause a protocol or processing failure.
section: "3"
rfc2119_level: MUST
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-30"
