document: rfc-3986
kind: protocol-element
summary: A URI reference (URI-reference = URI / relative-ref) is either a full URI or a relative reference. If the prefix does not match the syntax of a scheme followed by its colon separator, it is treated as a relative reference. Five URI components (scheme, authority, path, query, fragment) can always be extracted by a generic parser.
section: "4.1"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
