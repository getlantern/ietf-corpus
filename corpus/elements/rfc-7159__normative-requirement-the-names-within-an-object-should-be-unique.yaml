document: rfc-7159
kind: normative-requirement
summary: The names within an object SHOULD be unique. When names are not unique, the behavior of receiving software is unpredictable — implementations differ on whether to report the last pair, an error, or all duplicates.
section: "4"
rfc2119_level: SHOULD
