document: rfc-7159
kind: protocol-element
summary: A JSON text is defined as 'ws value ws', where a value may be an object, array, number, string, or one of the literal names false, null, or true. This expands the prior RFC 4627 constraint that required a JSON text to be an object or array.
section: "2"
topics:
