document: rfc-7159
kind: protocol-element
summary: A JSON text is defined as 'ws value ws' — a serialized value optionally surrounded by whitespace. This revision removes the RFC 4627 constraint that a JSON text must be an object or array; any JSON value is a valid JSON text.
section: "2"
