document: rfc-3339
kind: interoperability-note
summary: Numeric offsets are mandatory; attempts to label local offsets with alphabetic timezone strings have resulted in poor interoperability in the past. Numeric offsets represent local time minus UTC, so UTC equivalent time is obtained by subtracting the offset.
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
