document: rfc-7159
kind: security-consideration
summary: Using JavaScript's eval() or equivalent functions in other languages to parse JSON texts constitutes an unacceptable security risk, since the text could contain executable code along with data declarations. JSON is a subset of JavaScript syntax, making eval() parsing technically feasible but dangerous.
section: "12"
topics:
    - json
    - security
