document: rfc-3986
kind: interoperability-note
summary: URI suffix references (e.g., "www.example.com/path" without a scheme) are common in traditional media but depend on context-based heuristics that change over time. They should be avoided whenever possible and must never be used where long-term references are expected.
section: "4.5"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-25"
