document: rfc-3986
kind: interoperability-note
summary: Older implementations may fail to separate a reference's query or fragment component from its path before merging with the base path and removing dot-segments. This causes incorrect resolution when query strings contain the substrings "/../" or "/./".
section: 5.2.4
topics:
    - http
