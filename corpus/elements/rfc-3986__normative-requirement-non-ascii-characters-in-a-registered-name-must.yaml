document: rfc-3986
kind: normative-requirement
summary: Non-ASCII characters in a registered name MUST first be encoded as UTF-8 octets, then each octet percent-encoded. URI producing applications MUST NOT use percent-encoding in the host component unless representing a UTF-8 character sequence.
section: 3.2.2
rfc2119_level: MUST NOT
topics:
    - http
    - dns
