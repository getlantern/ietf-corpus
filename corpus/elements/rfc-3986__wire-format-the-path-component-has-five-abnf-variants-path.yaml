document: rfc-3986
kind: wire-format
summary: The path component has five ABNF variants (path-abempty, path-absolute, path-noscheme, path-rootless, path-empty) to handle all valid URI contexts. Dot-segments "." and ".." are defined for relative-position expression and are removed by the remove_dot_segments algorithm during resolution.
section: "3.3"
