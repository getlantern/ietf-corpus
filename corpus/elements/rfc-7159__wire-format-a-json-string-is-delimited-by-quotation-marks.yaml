document: rfc-7159
kind: wire-format
summary: 'A JSON string is delimited by quotation marks (%x22) and may contain any Unicode character except those that must be escaped: quotation mark, reverse solidus, and control characters U+0000 through U+001F. Escape sequences use ''\uXXXX'' (four hex digits) for BMP characters and a 12-character surrogate-pair sequence for code points above U+FFFF.'
section: "7"
