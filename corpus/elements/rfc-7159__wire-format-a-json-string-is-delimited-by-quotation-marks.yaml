document: rfc-7159
kind: wire-format
summary: A JSON string is delimited by quotation marks (U+0022). Characters U+0000–U+001F, quotation mark, and reverse solidus MUST be escaped. Escape sequences are '\' followed by a single character code or '\uXXXX' for BMP characters, or a 12-character surrogate pair sequence for characters outside the BMP.
section: "7"
topics:
