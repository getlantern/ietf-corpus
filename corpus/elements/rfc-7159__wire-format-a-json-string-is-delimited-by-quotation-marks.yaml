document: rfc-7159
kind: wire-format
summary: A JSON string is delimited by quotation marks (%x22). All Unicode characters are allowed except quotation mark, reverse solidus, and control characters (U+0000–U+001F), which must be escaped. Escape sequences include two-character shorthands (e.g., \n) and six-character \uXXXX forms; non-BMP characters use a 12-character UTF-16 surrogate pair encoding.
section: "7"
topics:
