document: rfc-3986
kind: security-consideration
summary: Some platforms accept non-standard dotted IP address notation (octal, hexadecimal, fewer than four octets). Only the standard dotted-decimal four-octet form is valid per this grammar; other forms may bypass security checks relying on address matching.
section: "7.4"
topics:
