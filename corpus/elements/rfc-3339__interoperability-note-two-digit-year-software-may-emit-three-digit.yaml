document: rfc-3339
kind: interoperability-note
summary: Two-digit-year software may emit three-digit years (year - 1900) for years after 1999, or non-numeric decade characters. Robust parsers may add 1900 to three-digit years and should detect and interpret non-numeric decade fields appropriately.
section: "3"
