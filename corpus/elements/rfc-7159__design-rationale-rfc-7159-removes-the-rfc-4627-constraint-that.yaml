document: rfc-7159
kind: design-rationale
summary: RFC 7159 removes the RFC 4627 constraint that a JSON text must be an object or array, allowing any JSON value as a top-level text. This change reflects observed practice and improves consistency with ECMA-404; implementations generating only objects or arrays remain interoperable since all parsers will accept them.
section: "1.3"
topics:
    - json
