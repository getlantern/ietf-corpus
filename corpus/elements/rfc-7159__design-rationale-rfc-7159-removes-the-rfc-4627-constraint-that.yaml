document: rfc-7159
kind: design-rationale
summary: RFC 7159 removes the RFC 4627 constraint that a JSON text must be an object or array, allowing any JSON value at the top level. Implementations that generate only objects or arrays remain interoperable since all implementations will accept these as valid JSON texts.
section: "1.3"
topics:
    - json
