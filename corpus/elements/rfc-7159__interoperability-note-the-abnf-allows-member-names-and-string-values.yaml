document: rfc-7159
kind: interoperability-note
summary: The ABNF allows member names and string values to contain bit sequences that cannot encode Unicode characters (e.g., '\uDEAD', a single unpaired UTF-16 surrogate). Behavior of software receiving such values is unpredictable and may cause fatal runtime exceptions.
section: "8.2"
topics:
