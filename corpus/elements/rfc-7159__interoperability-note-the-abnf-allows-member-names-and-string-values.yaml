document: rfc-7159
kind: interoperability-note
summary: The ABNF allows member names and string values containing bit sequences that cannot encode valid Unicode characters, such as unpaired UTF-16 surrogates (e.g., '\uDEAD'). Software receiving such values behaves unpredictably and may suffer fatal runtime exceptions.
section: "8.2"
topics:
