document: rfc-3986
kind: design-rationale
summary: The fragment identifier is handled exclusively by the user agent and is separated from the URI before any scheme-specific dereference occurs. This design prevents resource providers from blocking selective referencing by authors and allows new media types to be deployed without new URI schemes.
section: "3.5"
topics:
    - http
