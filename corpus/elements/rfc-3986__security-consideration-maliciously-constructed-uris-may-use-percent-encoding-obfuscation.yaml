document: rfc-3986
kind: security-consideration
summary: Maliciously constructed URIs may use percent-encoding obfuscation, misleading userinfo, or unusual syntax to confuse applications or bypass access controls. Scheme-specific parsers should flag scheme-restriction violations as errors rather than silently ignoring unused parts, to reduce the set of equivalent URIs and detect abuses.
section: "7.2"
topics:
    - security
