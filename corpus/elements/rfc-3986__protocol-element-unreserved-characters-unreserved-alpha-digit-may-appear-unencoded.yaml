document: rfc-3986
kind: protocol-element
summary: Unreserved characters (unreserved = ALPHA / DIGIT / "-" / "." / "_" / "~") may appear unencoded anywhere in a URI. URIs differing only in percent-encoding of an unreserved character are equivalent; normalizers should decode such octets to their unreserved character form.
section: "2.3"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
