document: rfc-3339
kind: interoperability-note
summary: ISO 8601 permits the "T" separator and "Z" suffix to be lowercase. Specifications in case-sensitive environments MAY further restrict the format to require uppercase; applications generating the format SHOULD use uppercase to maximize compatibility.
section: "5.6"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-04"
