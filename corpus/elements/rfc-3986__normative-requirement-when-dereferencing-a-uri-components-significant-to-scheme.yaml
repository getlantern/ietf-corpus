document: rfc-3986
kind: normative-requirement
summary: When dereferencing a URI, components significant to scheme-specific processing MUST be parsed and separated before percent-encoded octets within those components can be safely decoded; premature decoding may cause delimiter confusion.
section: "2.4"
rfc2119_level: MUST
