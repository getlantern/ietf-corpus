document: rfc-3339
kind: protocol-element
summary: 'The date-mday maximum value is month- and year-dependent: 28 for February in normal years, 29 in leap years, 30 for April/June/September/November, and 31 for January/March/May/July/August/October/December. The hour field is restricted to 00-23 even though ISO 8601 permits 24.'
