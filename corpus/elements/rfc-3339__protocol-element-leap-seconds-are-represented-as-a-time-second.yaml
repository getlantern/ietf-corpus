document: rfc-3339
kind: protocol-element
summary: Leap seconds are represented as a time-second value of "60" in timestamps of the form YYYY-MM-DDT23:59:60Z, occurring simultaneously in all time zones; in non-UTC zones the leap second is represented at the shifted local equivalent time.
section: "5.7"
