document: rfc-3986
kind: security-consideration
summary: Malicious URIs can be crafted to mislead users, for example by embedding a trusted-looking domain in the userinfo subcomponent (e.g., "http://trusted.example.com@malicious.example.com/"). Scheme-specific parsers should flag references that violate scheme restrictions as errors rather than silently ignoring unused parts.
section: "7.2"
topics:
    - security
    - http
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-18"
