document: rfc-3986
kind: normative-requirement
summary: 'IPv6 literal addresses are enclosed in square brackets (the only place square brackets appear in URI syntax): IP-literal = "[" ( IPv6address / IPvFuture ) "]". An unknown IPvFuture version flag SHOULD cause an "address mechanism not supported" error.'
section: 3.2.2
rfc2119_level: SHOULD
