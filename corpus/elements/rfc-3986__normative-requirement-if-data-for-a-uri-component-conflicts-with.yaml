document: rfc-3986
kind: normative-requirement
summary: If data for a URI component conflicts with a reserved character's delimiter role, the conflicting data MUST be percent-encoded before the URI is formed. A reserved character found in a component with no known delimiter role must be interpreted as representing the data octet for that character's US-ASCII encoding.
section: "2.2"
rfc2119_level: MUST
topics:
    - http
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-18"
