document: rfc-3339
kind: interoperability-note
summary: If date and time components are ordered from least to most precise (year, month, day, hour, minute, second) and all timestamps share the same offset string and fractional-second digit count, they can be sorted lexicographically as strings using strcmp().
section: "5.1"
