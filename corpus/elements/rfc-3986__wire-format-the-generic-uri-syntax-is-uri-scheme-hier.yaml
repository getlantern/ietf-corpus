document: rfc-3986
kind: wire-format
summary: 'The generic URI syntax is: URI = scheme ":" hier-part [ "?" query ] [ "#" fragment ], where hier-part may be an authority with path-abempty, a path-absolute, path-rootless, or path-empty. Both the scheme and path components are required, though the path may be empty.'
