summary: 'The generic URI syntax is: URI = scheme ":" hier-part [ "?" query ] [ "#" fragment ], where hier-part is one of "//" authority path-abempty, path-absolute, path-rootless, or path-empty. Scheme and path are required; path may be empty.'
