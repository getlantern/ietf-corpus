document: rfc-3986
kind: wire-format
summary: 'The generic URI syntax is: URI = scheme ":" hier-part [ "?" query ] [ "#" fragment ], where hier-part is "//" authority path-abempty, path-absolute, path-rootless, or path-empty. Scheme and path are always present; authority, query, and fragment are optional.'
