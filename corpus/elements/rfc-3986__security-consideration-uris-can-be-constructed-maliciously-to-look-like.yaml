document: rfc-3986
kind: security-consideration
summary: URIs can be constructed maliciously to look like a trusted resource while actually directing the user elsewhere. Scheme-specific parsers should flag scheme-constraint violations as errors rather than ignoring unused parts, to detect potential misleading URIs.
section: "7.2"
topics:
    - security
    - http
