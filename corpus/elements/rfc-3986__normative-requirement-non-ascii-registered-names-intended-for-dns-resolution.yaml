document: rfc-3986
kind: normative-requirement
summary: Non-ASCII registered names intended for DNS resolution MUST be transformed to the IDNA encoding [RFC3490] prior to name lookup. URI producers SHOULD supply registered names in IDNA encoding rather than percent-encoding to maximize interoperability with legacy URI resolvers.
section: 3.2.2
rfc2119_level: MUST
topics:
    - dns
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
