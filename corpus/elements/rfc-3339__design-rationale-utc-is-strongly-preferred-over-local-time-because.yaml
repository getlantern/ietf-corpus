document: rfc-3339
kind: design-rationale
summary: UTC is strongly preferred over local time because daylight saving rules are convoluted and can change unpredictably based on local law, making true interoperability impossible without a common reference. The spec explicitly avoids modeling local-timezone-aware scheduling semantics.
section: "4.1"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-18"
