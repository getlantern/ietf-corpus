document: rfc-3986
kind: design-rationale
summary: URIs provide identification only; access to the identified resource is neither guaranteed nor implied. Operations on URIs are defined by the protocols and data formats that use them, not by this specification — intentionally decoupling identification from interaction.
section: 1.2.2
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-11"
