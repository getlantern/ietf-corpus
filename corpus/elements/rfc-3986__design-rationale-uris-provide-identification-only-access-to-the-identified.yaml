document: rfc-3986
kind: design-rationale
summary: URIs provide identification only; access to the identified resource is neither guaranteed nor implied by the presence of a URI. Operations associated with a URI are defined by the protocols and data formats that use it, not by this specification, deliberately separating identification from interaction.
section: 1.2.2
topics:
    - http
