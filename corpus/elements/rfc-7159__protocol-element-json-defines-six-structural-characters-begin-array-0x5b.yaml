summary: 'JSON defines six structural characters: begin-array ''['' (0x5B), begin-object ''{'' (0x7B), end-array '']'' (0x5D), end-object ''}'' (0x7D), name-separator '':'' (0x3A), and value-separator '','' (0x2C). Insignificant whitespace (space, tab, line feed, carriage return) is allowed before or after any of these.'
