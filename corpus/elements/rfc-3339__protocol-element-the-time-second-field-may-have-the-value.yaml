document: rfc-3339
kind: protocol-element
summary: The time-second field may have the value "60" at the end of months in which a positive leap second occurs (historically June 30 or December 31, expressed as XXXX-MM-DDT23:59:60Z). If a leap second is subtracted, the maximum value is "58".
section: "5.7"
