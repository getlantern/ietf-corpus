document: rfc-3339
kind: protocol-element
summary: 'The time-second field may have the value "60" at the end of months in which a positive leap second occurs (to date: June 30 or December 31 at 23:59:60Z). A negative leap second reduces the maximum to "58". In non-UTC time zones, the leap second point is shifted by the zone offset.'
section: "5.7"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
