document: rfc-3986
kind: wire-format
summary: IPv6 addresses in URI host are encapsulated in square brackets as IP-literal = "[" ( IPv6address / IPvFuture ) "]"; this is the only place square brackets are allowed in URI syntax. Future IP literal formats use an IPvFuture rule starting with "v" followed by a version number.
section: 3.2.2
topics:
