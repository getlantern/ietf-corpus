document: rfc-3339
kind: interoperability-note
summary: If timestamps share the same time zone string (all "Z" or all "+00:00") and the same number of fractional second digits, they may be sorted lexicographically (e.g., with strcmp()) to yield a time-ordered sequence. Optional punctuation or varying formats would break this property.
section: "5.1"
