document: rfc-3339
kind: wire-format
summary: The time-second field may have the value "60" at the end of months in which a positive leap second occurs (historically June 30 or December 31, encoded as XXXX-06-30T23:59:60Z or XXXX-12-31T23:59:60Z). For a negative leap second, the maximum value is "58".
section: "5.7"
