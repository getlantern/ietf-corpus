document: rfc-3339
kind: design-rationale
summary: Numeric offsets follow only ISO 8601 zones that differ from UTC by an integral number of minutes. Historical time zones with non-integral-minute offsets (e.g., Netherlands +00:19:32.13) must be approximated to the nearest representable offset.
section: "4.2"
