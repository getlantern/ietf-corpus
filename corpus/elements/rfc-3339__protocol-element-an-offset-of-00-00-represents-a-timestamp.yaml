document: rfc-3339
kind: protocol-element
summary: An offset of '-00:00' represents a timestamp where UTC time is known but the local offset is unknown. This is semantically distinct from '+00:00' or 'Z', which imply UTC is the preferred reference point.
section: "4.3"
