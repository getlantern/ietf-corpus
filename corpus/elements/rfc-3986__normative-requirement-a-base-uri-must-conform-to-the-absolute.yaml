document: rfc-3986
kind: normative-requirement
summary: A base URI MUST conform to the absolute-URI syntax rule and MUST be stripped of any fragment component before use. Relative references can only be used reliably when the base URI is well defined; a sender of relative references is responsible for ensuring base URI establishment.
section: "5.1"
rfc2119_level: MUST
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
