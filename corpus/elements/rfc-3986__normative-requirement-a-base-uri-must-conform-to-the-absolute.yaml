document: rfc-3986
kind: normative-requirement
summary: 'A base URI MUST conform to the absolute-URI syntax rule and MUST be established by the parser prior to parsing relative URI references. The order of precedence for base URI sources is: embedded in content, encapsulating entity, retrieval URI, then application default.'
section: "5.1"
rfc2119_level: MUST
topics:
    - http
