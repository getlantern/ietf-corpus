document: rfc-3986
kind: normative-requirement
summary: A base URI MUST conform to the absolute-URI syntax rule and must be stripped of any fragment component before use. Relative references other than fragment-only references are only usable when a base URI is known.
section: "5.1"
rfc2119_level: MUST
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-11"
