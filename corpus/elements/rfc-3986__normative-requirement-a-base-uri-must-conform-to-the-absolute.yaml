document: rfc-3986
kind: normative-requirement
summary: A base URI must conform to the absolute-URI syntax rule (no fragment component). If obtained from a URI reference, that reference must be converted to absolute form and stripped of any fragment before use as a base URI.
section: "5.1"
rfc2119_level: MUST
topics:
    - http
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-23"
