document: rfc-3986
kind: normative-requirement
summary: A base URI MUST conform to the absolute-URI syntax rule and must not contain a fragment component. If the base URI is obtained from a URI reference, that reference must first be converted to absolute form and stripped of any fragment.
section: "5.1"
rfc2119_level: MUST
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-09"
