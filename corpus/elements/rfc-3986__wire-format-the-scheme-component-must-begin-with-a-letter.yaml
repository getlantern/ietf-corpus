document: rfc-3986
kind: wire-format
summary: 'The scheme component must begin with a letter and may be followed by letters, digits, plus, period, or hyphen: scheme = ALPHA *( ALPHA / DIGIT / "+" / "-" / "." ). Schemes are case-insensitive; the canonical form is lowercase.'
