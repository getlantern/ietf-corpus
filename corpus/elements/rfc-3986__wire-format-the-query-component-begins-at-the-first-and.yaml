document: rfc-3986
kind: wire-format
summary: The query component begins at the first "?" and ends at "#" or end of URI (query = *( pchar / "/" / "?" )). The fragment begins at "#" and runs to end of URI with identical character grammar. Both may contain "/" and "?" as data characters.
section: "3.4"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
