document: rfc-7159
kind: interoperability-note
summary: Numbers representable as IEEE 754-2008 binary64 (double precision) integers in the range [-(2**53)+1, (2**53)-1] are interoperable across implementations. Numbers with greater magnitude or precision (e.g., 1E400) may cause interoperability problems since not all implementations can represent them.
