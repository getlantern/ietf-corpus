document: rfc-3986
kind: design-rationale
summary: 'URI identification is intentionally separated from resource access: the URI provides identification only; the operations that may be performed on a resource are defined by the protocols that use URIs, not by the URI specification. A URI does not guarantee that a resource is accessible.'
section: 1.2.2
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-13"
