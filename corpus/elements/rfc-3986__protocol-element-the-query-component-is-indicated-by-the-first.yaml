document: rfc-3986
kind: protocol-element
summary: The query component is indicated by the first "?" and terminated by "#" or end of URI (query = *( pchar / "/" / "?" )). The fragment is indicated by "#" and extends to end of URI; fragment semantics are defined by the retrieved representation's media type, not the URI scheme, and cannot be redefined by scheme specifications.
section: "3.4"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-25"
