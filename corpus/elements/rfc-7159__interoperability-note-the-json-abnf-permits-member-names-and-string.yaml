document: rfc-7159
kind: interoperability-note
summary: The JSON ABNF permits member names and string values to contain bit sequences that cannot encode valid Unicode characters, such as unpaired UTF-16 surrogates (e.g., "\uDEAD"). Software receiving such values behaves unpredictably and may return wrong string lengths or suffer fatal runtime exceptions.
section: "8.2"
topics:
    - json
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-25"
