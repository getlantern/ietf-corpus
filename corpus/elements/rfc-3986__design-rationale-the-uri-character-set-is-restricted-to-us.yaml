document: rfc-3986
kind: design-rationale
summary: 'The URI character set is restricted to US-ASCII letters, digits, and a few special characters to support global transcription: a URI written on a napkin must be re-enterable from any keyboard regardless of locale. Transcribability was explicitly considered more important than using the most semantically meaningful characters.'
section: 1.2.1
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
