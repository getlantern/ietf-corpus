document: rfc-3986
kind: design-rationale
summary: The URI character set is restricted to basic Latin letters, digits, and a few special characters because the ability to transcribe a URI from one medium to another (e.g., handwritten on paper to typed on a keyboard) across languages and locales was considered more important than allowing the most semantically meaningful characters.
section: 1.2.1
