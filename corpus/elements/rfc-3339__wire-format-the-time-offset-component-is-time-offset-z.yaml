document: rfc-3339
kind: wire-format
summary: The time offset component is `time-offset = "Z" / time-numoffset`, where `time-numoffset = ("+" / "-") time-hour ":" time-minute`. Numeric offsets represent the difference "local time minus UTC" and are mandatory; alphabetic timezone strings are not permitted.
section: "5.6"
