document: rfc-3986
kind: wire-format
summary: 'The query component begins at the first "?" character and is terminated by "#" or end of URI. ABNF: query = *( pchar / "/" / "?"). The fragment begins at "#" and extends to end of URI. ABNF: fragment = *( pchar / "/" / "?").'
section: "3.4"
topics:
    - http
