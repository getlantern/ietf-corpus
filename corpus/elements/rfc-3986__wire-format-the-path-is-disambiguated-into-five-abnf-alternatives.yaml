document: rfc-3986
kind: wire-format
summary: 'The path is disambiguated into five ABNF alternatives: path-abempty (empty or begins with "/"), path-absolute (begins with "/" but not "//"), path-noscheme (no colon in first segment), path-rootless (begins with a segment), and path-empty. Exactly one matches any given URI reference.'
section: "3.3"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
