document: rfc-3986
kind: normative-requirement
summary: Scheme names are case-insensitive, but the canonical form is lowercase. Implementations SHOULD accept uppercase letters as equivalent to lowercase in scheme names for robustness but SHOULD produce only lowercase scheme names for consistency.
section: "3.1"
rfc2119_level: SHOULD
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-20"
