document: rfc-3986
kind: normative-requirement
summary: Scheme names are case-insensitive, but the canonical form is lowercase. Documents specifying schemes MUST use lowercase letters, and implementations SHOULD accept uppercase equivalents for robustness but SHOULD only produce lowercase.
section: "3.1"
rfc2119_level: SHOULD
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-11"
