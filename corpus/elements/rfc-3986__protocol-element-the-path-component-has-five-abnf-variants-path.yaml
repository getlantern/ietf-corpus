document: rfc-3986
kind: protocol-element
summary: The path component has five ABNF variants (path-abempty, path-absolute, path-noscheme, path-rootless, path-empty) to disambiguate context. If authority is present the path must be empty or begin with "/"; without authority the path cannot begin with "//".
section: "3.3"
