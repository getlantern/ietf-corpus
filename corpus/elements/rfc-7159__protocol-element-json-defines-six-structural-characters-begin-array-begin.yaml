document: rfc-7159
kind: protocol-element
summary: 'JSON defines six structural characters: begin-array ([), begin-object ({), end-array (]), end-object (}), name-separator (:), and value-separator (,). Insignificant whitespace (space, horizontal tab, line feed, carriage return) is allowed before or after any structural character.'
