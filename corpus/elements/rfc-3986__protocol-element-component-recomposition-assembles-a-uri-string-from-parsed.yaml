document: rfc-3986
kind: protocol-element
summary: Component recomposition assembles a URI string from parsed components by appending scheme+":", then "//"+authority if defined, then path, then "?"+query if defined, then "#"+fragment if defined. The distinction between undefined (delimiter absent) and empty (delimiter present, no value) components must be preserved.
section: "5.3"
topics:
    - http
