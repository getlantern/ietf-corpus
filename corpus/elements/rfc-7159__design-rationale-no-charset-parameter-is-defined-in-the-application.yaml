document: rfc-7159
kind: design-rationale
summary: No 'charset' parameter is defined in the application/json media type registration because JSON's encoding is fully determined by the UTF-8/16/32 detection rules in the specification; adding a charset parameter has no effect on compliant recipients.
section: "11"
topics:
