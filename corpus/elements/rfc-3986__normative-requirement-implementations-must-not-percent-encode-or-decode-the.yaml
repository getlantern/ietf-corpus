document: rfc-3986
kind: normative-requirement
summary: Implementations MUST NOT percent-encode or decode the same string more than once. Decoding an already-decoded string risks misinterpreting a literal "%" data octet as the start of a percent-encoding; encoding an already-encoded string double-encodes the "%" character.
section: "2.4"
rfc2119_level: MUST NOT
topics:
    - http
    - security
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-18"
