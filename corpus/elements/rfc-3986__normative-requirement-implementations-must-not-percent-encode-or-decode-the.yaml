document: rfc-3986
kind: normative-requirement
summary: Implementations MUST NOT percent-encode or decode the same string more than once, as doing so can cause a percent data octet to be misinterpreted as the start of a percent-encoding or vice versa.
section: "2.4"
rfc2119_level: MUST NOT
topics:
    - http
    - security
