document: rfc-3986
kind: normative-requirement
summary: Implementations must not percent-encode or decode the same string more than once. Decoding an already decoded string may misinterpret a data octet as a percent-encoding prefix, and double-encoding corrupts the URI.
section: "2.4"
rfc2119_level: MUST NOT
topics:
    - http
    - security
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-23"
