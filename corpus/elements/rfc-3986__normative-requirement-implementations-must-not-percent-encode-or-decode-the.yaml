document: rfc-3986
kind: normative-requirement
summary: Implementations MUST NOT percent-encode or decode the same string more than once, as decoding an already-decoded string may cause a data "%" octet to be misinterpreted as beginning a percent-encoding sequence.
section: "2.4"
rfc2119_level: MUST NOT
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-13"
