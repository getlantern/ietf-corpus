document: rfc-3986
kind: normative-requirement
summary: Implementations MUST NOT percent-encode or decode the same string more than once; double-decoding may cause a percent data octet to be mistaken for the beginning of a percent-encoding, and vice versa.
section: "2.4"
rfc2119_level: MUST NOT
topics:
    - http
    - security
