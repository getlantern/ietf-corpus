document: rfc-3986
kind: normative-requirement
summary: Implementations MUST NOT percent-encode or decode the same string more than once; double-decoding can cause a percent-encoded data octet to be misinterpreted as the start of a percent-encoding.
section: "2.4"
rfc2119_level: MUST NOT
topics:
    - security
