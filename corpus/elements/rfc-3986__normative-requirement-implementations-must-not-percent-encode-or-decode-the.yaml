document: rfc-3986
kind: normative-requirement
summary: Implementations MUST NOT percent-encode or decode the same string more than once; decoding an already-decoded string can misinterpret a literal percent data octet as the start of a percent-encoded sequence, or vice versa.
section: "2.4"
rfc2119_level: MUST NOT
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
