document: rfc-3986
kind: normative-requirement
summary: Implementations MUST NOT percent-encode or decode the same string more than once; decoding an already-decoded string may misinterpret a percent data octet as the start of a percent-encoding, and encoding an already-encoded string produces double-encoding.
section: "2.4"
rfc2119_level: MUST NOT
topics:
    - security
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-20"
