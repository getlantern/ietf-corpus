document: rfc-3986
kind: wire-format
summary: IPv4 addresses in the host are represented as four decimal octets in dotted-decimal notation (dec-octet "." dec-octet "." dec-octet "." dec-octet), where dec-octet covers values 0–255. Only this form is allowed by the grammar; other dotted notations accepted by some platforms are not valid URI syntax.
section: 3.2.2
topics:
