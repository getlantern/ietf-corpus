document: rfc-3339
kind: wire-format
summary: The Internet Date/Time Format is defined by the ABNF production `date-time = full-date "T" full-time`, where `full-date = date-fullyear "-" date-month "-" date-mday` and `full-time = partial-time time-offset`. The "T" separator and all punctuation are mandatory; `time-offset` is either "Z" or a numeric `("+" / "-") time-hour ":" time-minute` value.
section: "5.6"
