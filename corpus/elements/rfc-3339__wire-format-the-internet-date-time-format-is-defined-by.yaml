document: rfc-3339
kind: wire-format
summary: 'The Internet Date/Time Format is defined by the ABNF: date-time = full-date "T" full-time, where full-date = date-fullyear "-" date-month "-" date-mday (4-2-2 digits) and full-time = partial-time time-offset. The time-offset is either "Z" or a numeric "+"/"-" HH:MM offset. Fractional seconds (time-secfrac = "." 1*DIGIT) are optional.'
