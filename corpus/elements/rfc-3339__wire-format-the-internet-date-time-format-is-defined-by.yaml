document: rfc-3339
kind: wire-format
summary: 'The Internet Date/Time Format is defined by the ABNF: `date-time = full-date "T" full-time`, where `full-date = date-fullyear "-" date-month "-" date-mday` (4-2-2 digit fields) and `full-time = partial-time time-offset`. The separator "T" and UTC suffix "Z" may be lowercase per ABNF and ISO 8601.'
