document: rfc-3339
kind: protocol-element
summary: Numeric time offsets are calculated as 'local time minus UTC', so the equivalent UTC time is obtained by subtracting the offset from local time. For example, 18:50:00-04:00 is the same instant as 22:50:00Z.
section: "4.2"
extracted_by: claude-sonnet-4-6
