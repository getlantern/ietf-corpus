document: rfc-3986
kind: state-machine
summary: 'Relative reference resolution transforms reference R against base URI B via a precedence algorithm: if R has a scheme, use R almost directly; if R has authority, use B''s scheme with R''s remaining parts; if R has empty path, inherit B''s path (and optionally B''s query); otherwise merge B''s path with R''s relative path. Dot-segments are removed from the target path at each applicable step. The fragment always comes from R.'
section: 5.2.2
topics:
    - http
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-27"
