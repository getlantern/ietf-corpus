document: rfc-3339
kind: wire-format
summary: The date-fullyear field is exactly 4DIGIT; date-month is 2DIGIT (01-12); date-mday is 2DIGIT (01-31 depending on month/year); time-hour is 2DIGIT (00-23); time-minute is 2DIGIT (00-59); time-second is 2DIGIT (00-60 accounting for leap seconds); time-secfrac is "." followed by 1 or more digits.
section: "5.6"
