document: rfc-3986
kind: design-rationale
summary: A URI only provides identification; access to the resource is neither guaranteed nor implied by its presence. Operations on a URI are defined by the protocol or data format in which it appears, not by this specification — this separates identification from interaction.
section: 1.2.2
topics:
    - http
