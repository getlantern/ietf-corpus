document: rfc-3986
kind: design-rationale
summary: A URI only provides identification; access to the resource is neither guaranteed nor implied. Operations on a resource (access, update, replace) are defined by the protocols and data formats that use URIs, not by the URI specification itself. This separation allows URIs to be used purely as names without any retrieval intent.
section: 1.2.2
topics:
    - http
