document: rfc-3986
kind: design-rationale
summary: A URI only provides identification; access to the resource is neither guaranteed nor implied. Operations on URIs are defined by the protocols and data formats that use them, not by the URI specification. This separates identification from interaction.
section: 1.2.2
topics:
    - http
