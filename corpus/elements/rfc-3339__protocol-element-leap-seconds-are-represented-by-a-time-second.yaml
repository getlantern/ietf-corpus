document: rfc-3339
kind: protocol-element
summary: Leap seconds are represented by a `time-second` value of "60" at the end of months in which a leap second occurs (historically June 30 or December 31), expressed as `YYYY-MM-DDT23:59:60Z`. A subtracted leap second reduces the maximum value of `time-second` to "58".
section: "5.7"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-04"
