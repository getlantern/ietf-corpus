document: rfc-3339
kind: protocol-element
summary: 'Leap seconds are represented by a time-second value of ''60'', occurring as an extra second at the end of a UTC day: YYYY-MM-DDT23:59:60Z. In non-UTC time zones, the leap second point shifts by the zone offset so it occurs at the same instant globally.'
section: "5.7"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
