document: rfc-3986
kind: protocol-element
summary: The reference resolution algorithm (Section 5.2.2) transforms a URI reference R against base URI B into target URI T by progressively inheriting scheme, authority, path, and query from B when R's corresponding components are undefined. remove_dot_segments is applied to the merged path before forming T.
section: 5.2.2
