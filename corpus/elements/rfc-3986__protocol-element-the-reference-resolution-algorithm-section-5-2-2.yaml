summary: 'The reference resolution algorithm (Section 5.2.2) transforms reference R against base URI Base into target T by checking in order: whether R has a scheme (use R wholesale with dot-segment removal), whether R has an authority, whether R''s path is empty, and whether R''s path starts with "/".'
