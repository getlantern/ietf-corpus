document: rfc-7159
kind: interoperability-note
summary: String comparison implementations that transform textual representations into sequences of Unicode code units and compare numerically code-unit-by-code-unit are interoperable. Implementations comparing strings with escaped characters unconverted may incorrectly treat '\\' and '\u005C' as unequal.
section: "8.3"
topics:
    - json
