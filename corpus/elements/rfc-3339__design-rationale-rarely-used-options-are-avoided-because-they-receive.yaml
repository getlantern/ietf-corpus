document: rfc-3339
kind: design-rationale
summary: Rarely used options are avoided because they receive less testing in alpha/beta stages, causing bugs to go undiscovered. Fractional seconds is the only optional feature retained, expected only for applications requiring strict ordering or unusual precision.
section: "5.3"
