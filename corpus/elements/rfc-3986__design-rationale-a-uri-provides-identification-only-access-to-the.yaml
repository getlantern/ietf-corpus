document: rfc-3986
kind: design-rationale
summary: A URI provides identification only; access to the resource is neither guaranteed nor implied by the presence of a URI. Operations on the resource are defined by the protocol or data format in which the URI appears, not by this specification — separating identification from interaction.
section: 1.2.2
topics:
    - http
