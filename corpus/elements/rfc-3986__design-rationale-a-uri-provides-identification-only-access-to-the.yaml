document: rfc-3986
kind: design-rationale
summary: A URI provides identification only; access to the resource is neither guaranteed nor implied by a URI's presence. Operations associated with a URI reference are defined by the protocol element, data format, or natural language text in which the URI appears, not by this specification.
section: 1.2.2
extracted_by: claude-sonnet-4-6
