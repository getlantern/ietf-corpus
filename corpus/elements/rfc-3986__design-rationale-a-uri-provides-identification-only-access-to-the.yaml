document: rfc-3986
kind: design-rationale
summary: A URI provides identification only; access to the resource is neither guaranteed nor implied. Operations on a URI are defined by the protocol element or data format in which it appears, not by the URI specification, allowing URIs to denote abstract concepts, people, and non-network-accessible resources.
section: 1.2.2
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
