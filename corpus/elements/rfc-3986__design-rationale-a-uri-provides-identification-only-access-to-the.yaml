document: rfc-3986
kind: design-rationale
summary: A URI provides identification only; access to the resource is neither guaranteed nor implied by its presence. Operations on a URI (access, update, retrieve) are defined by the protocols that use URIs. This separation allows URIs to name non-network-accessible resources and decouples naming from interaction.
section: 1.2.2
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-20"
