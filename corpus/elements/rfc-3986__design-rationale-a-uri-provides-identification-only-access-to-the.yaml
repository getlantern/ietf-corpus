document: rfc-3986
kind: design-rationale
summary: A URI provides identification only; access to the resource is neither guaranteed nor implied by a URI's presence. Operations on URIs are defined by the protocols that use them, not by the URI syntax specification. Even schemes named after protocols do not imply resource access via that protocol.
section: 1.2.2
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-30"
