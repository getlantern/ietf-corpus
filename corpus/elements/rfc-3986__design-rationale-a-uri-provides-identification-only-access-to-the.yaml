document: rfc-3986
kind: design-rationale
summary: A URI provides identification only; access to the resource is neither guaranteed nor implied. Operations associated with a URI reference are defined by the protocols that make use of URIs, not by the URI specification. URI schemes named after protocols (e.g., "http") do not imply access via that protocol.
section: 1.2.2
topics:
    - http
