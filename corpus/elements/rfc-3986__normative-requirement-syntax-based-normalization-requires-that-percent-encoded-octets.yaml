document: rfc-3986
kind: normative-requirement
summary: Syntax-based normalization requires that percent-encoded octets in the unreserved character ranges (ALPHA, DIGIT, "-", ".", "_", "~") should be decoded, and scheme names and host names should be lowercased, to produce a canonical URI for comparison.
section: 6.2.2
rfc2119_level: SHOULD
topics:
    - http
