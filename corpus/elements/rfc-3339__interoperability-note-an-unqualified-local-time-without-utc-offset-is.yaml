document: rfc-3339
kind: interoperability-note
summary: An unqualified local time (without UTC offset) is deemed unacceptable for Internet use because it will fail to parse correctly in approximately 23/24 of the globe. All date and time values used in Internet protocols MUST be fully qualified with a UTC offset.
section: "4.4"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
