document: rfc-3986
kind: design-rationale
summary: 'The URI character set is deliberately restricted to basic Latin letters, digits, and a few special characters to enable global transcription: a URI must be writable on paper, readable across keyboard layouts, and typeable on systems across languages and locales. Transcribability was considered more important than using the most semantically meaningful characters.'
section: 1.2.1
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-30"
