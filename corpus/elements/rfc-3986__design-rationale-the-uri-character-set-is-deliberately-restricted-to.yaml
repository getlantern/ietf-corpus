document: rfc-3986
kind: design-rationale
summary: The URI character set is deliberately restricted to basic Latin letters, digits, and a small set of symbols to support global transcription across keyboards, input devices, and media (including ink on paper). Transcribability was prioritized over expressiveness with non-ASCII characters.
section: 1.2.1
