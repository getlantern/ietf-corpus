document: rfc-3986
kind: wire-format
summary: 'The host subcomponent is one of: IP-literal (IPv6address or IPvFuture enclosed in "[" and "]"), IPv4address (dotted-decimal, four octets 0-255), or reg-name (sequence of unreserved / pct-encoded / sub-delims characters). The first-match-wins rule disambiguates IPv4address from reg-name.'
section: 3.2.2
topics:
