document: rfc-3986
kind: protocol-element
summary: The reference transformation algorithm (Section 5.2.2) resolves a URI reference R against a base URI by selecting scheme, authority, path, and query from R or the base depending on which components of R are defined, then always taking R's fragment. The remove_dot_segments routine is applied to all resulting paths.
section: 5.2.2
topics:
