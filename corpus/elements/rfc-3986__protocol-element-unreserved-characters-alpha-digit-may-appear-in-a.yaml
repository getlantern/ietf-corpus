document: rfc-3986
kind: protocol-element
summary: Unreserved characters (ALPHA / DIGIT / "-" / "." / "_" / "~") may appear in a URI without percent-encoding. URIs that differ only in whether an unreserved character is percent-encoded are equivalent and identify the same resource.
section: "2.3"
topics:
    - http
