document: rfc-3986
kind: protocol-element
summary: Unreserved characters (ALPHA / DIGIT / "-" / "." / "_" / "~") may appear in a URI without percent-encoding. URIs that differ only in the replacement of an unreserved character with its percent-encoded equivalent identify the same resource.
section: "2.3"
topics:
    - http
