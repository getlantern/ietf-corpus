document: rfc-7159
kind: design-rationale
summary: RFC 7159 relaxes the RFC 4627 constraint that a JSON text must be an object or array, allowing any JSON value as a top-level text, because this removes an inconsistency with ECMAScript and other JSON specifications and reflects actual widespread practice.
section: "1.3"
topics:
    - json
