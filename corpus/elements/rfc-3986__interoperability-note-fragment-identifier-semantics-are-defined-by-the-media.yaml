document: rfc-3986
kind: interoperability-note
summary: Fragment identifier semantics are defined by the media type of the potentially retrieved representation and cannot be redefined by URI schemes. If a primary resource has multiple representations, the fragment should identify the same secondary resource consistently across all of them.
section: "3.5"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-25"
