document: rfc-3986
kind: normative-requirement
summary: Scheme names begin with a letter followed by any mix of letters, digits, "+", "-", or ".". Although schemes are case-insensitive, the canonical form is lowercase; implementations should accept uppercase for robustness but must only produce lowercase scheme names.
section: "3.1"
rfc2119_level: SHOULD
topics:
    - http
    - registry
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-23"
