document: rfc-3986
kind: wire-format
summary: The scheme component is defined as scheme = ALPHA *( ALPHA / DIGIT / "+" / "-" / "." ), starting with a letter. Schemes are case-insensitive but the canonical form is lowercase; documents specifying schemes must use lowercase letters.
