document: rfc-3339
kind: design-rationale
summary: The format orders components from least precise (year) to most precise (second/fraction), enabling lexicographic string comparison (e.g., strcmp) to produce chronological ordering—provided all timestamps share the same time zone string and fractional-second digit count. Optional punctuation or variable-length components would break this property.
section: "5.1"
