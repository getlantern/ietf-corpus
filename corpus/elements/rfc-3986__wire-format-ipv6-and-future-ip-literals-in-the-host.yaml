document: rfc-3986
kind: wire-format
summary: 'IPv6 and future IP literals in the host subcomponent are enclosed in square brackets: IP-literal = "[" ( IPv6address / IPvFuture ) "]". Square brackets are permitted only here in URI syntax. IPvFuture uses a version flag: "v" 1*HEXDIG "." 1*( unreserved / sub-delims / ":" ).'
