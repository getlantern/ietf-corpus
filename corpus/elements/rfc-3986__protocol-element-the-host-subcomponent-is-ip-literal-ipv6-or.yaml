document: rfc-3986
kind: protocol-element
summary: The host subcomponent is IP-literal (IPv6 or IPvFuture address enclosed in square brackets), IPv4address in dotted-decimal notation, or reg-name. The first-match-wins algorithm disambiguates IPv4address from reg-name; host is case-insensitive.
section: 3.2.2
topics:
