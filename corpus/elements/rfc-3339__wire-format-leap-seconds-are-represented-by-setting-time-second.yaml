document: rfc-3339
kind: wire-format
summary: Leap seconds are represented by setting time-second to "60" at the end of a month in which a leap second occurs (historically June 30 or December 31), expressed as XXXX-MM-DDT23:59:60Z. A subtracted leap second makes the maximum time-second value "58".
section: "5.7"
