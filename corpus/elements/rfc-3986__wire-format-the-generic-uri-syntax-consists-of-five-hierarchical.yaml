document: rfc-3986
kind: wire-format
summary: 'The generic URI syntax consists of five hierarchical components: scheme, authority, path, query, and fragment. The ABNF is: URI = scheme ":" hier-part [ "?" query ] [ "#" fragment ]. The scheme and path are required; path may be empty.'
