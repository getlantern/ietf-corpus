document: rfc-3986
kind: design-rationale
summary: 'URIs are designed for global transcription: they consist only of basic Latin letters, digits, and a few special characters so they can be written on paper, read aloud, or entered on any keyboard. The ability to transcribe a resource identifier from one medium to another was considered more important than using the most meaningful components.'
section: 1.2.1
topics:
