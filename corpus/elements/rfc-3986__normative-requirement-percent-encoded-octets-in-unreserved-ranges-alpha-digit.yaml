document: rfc-3986
kind: normative-requirement
summary: Percent-encoded octets in unreserved ranges (ALPHA, DIGIT, hyphen, period, underscore, tilde) should not be produced by URI producers, and normalizers should decode them to their unreserved character equivalents.
section: "2.3"
rfc2119_level: SHOULD
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-25"
