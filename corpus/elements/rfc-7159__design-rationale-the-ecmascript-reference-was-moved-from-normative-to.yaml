document: rfc-7159
kind: design-rationale
summary: The ECMAScript reference was moved from normative to informative because JSON's design goals (minimal, portable, textual, JavaScript subset) are captured entirely in the ABNF grammar, and the spec should not be tied to a specific ECMAScript edition.
