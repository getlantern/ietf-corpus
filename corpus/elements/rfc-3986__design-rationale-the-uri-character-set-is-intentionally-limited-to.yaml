document: rfc-3986
kind: design-rationale
summary: The URI character set is intentionally limited to basic Latin letters, digits, and a few special characters to support global transcription — the ability to write a URI on a napkin and correctly re-enter it into a computer. Transcribability was considered more important than having maximally meaningful component names.
section: 1.2.1
topics:
    - http
