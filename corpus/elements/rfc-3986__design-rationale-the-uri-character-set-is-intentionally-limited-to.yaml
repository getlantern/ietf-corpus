document: rfc-3986
kind: design-rationale
summary: The URI character set is intentionally limited to basic Latin letters, digits, and a few special characters to enable global transcription across keyboards, input devices, languages, and locales. The ability to transcribe a URI from one medium to another was considered more important than having maximally meaningful component names.
section: 1.2.1
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-20"
