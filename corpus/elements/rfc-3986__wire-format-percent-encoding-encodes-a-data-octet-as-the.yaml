document: rfc-3986
kind: wire-format
summary: Percent-encoding encodes a data octet as the character triplet "%" followed by two hexadecimal digits representing the octet's numeric value (e.g., "%20" for space). Uppercase and lowercase hex digits are equivalent, but producers and normalizers should use uppercase.
section: "2.1"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-25"
