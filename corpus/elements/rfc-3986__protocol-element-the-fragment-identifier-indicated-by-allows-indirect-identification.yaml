document: rfc-3986
kind: protocol-element
summary: The fragment identifier (indicated by "#") allows indirect identification of a secondary resource. Its semantics are defined by the media type of the primary resource, are independent of the URI scheme, and cannot be redefined by scheme specifications. The fragment is separated before dereference and processed solely by the user agent.
section: "3.5"
topics:
    - http
