summary: 'Two-character escape sequences are defined for common characters: `\"` (U+0022), `\\` (U+005C), `\/` (U+002F), `\b` (U+0008), `\f` (U+000C), `\n` (U+000A), `\r` (U+000D), `\t` (U+0009). The grammar is `char = unescaped / escape ( %x22 / %x5C / %x2F / %x62 / %x66 / %x6E / %x72 / %x74 / %x75 4HEXDIG )`.'
