document: rfc-3339
kind: interoperability-note
summary: Leap seconds occur simultaneously across all time zones; in non-UTC zones the leap second point is shifted by the zone offset so it happens at the same instant globally. For example, 1990-12-31T23:59:60Z equals 1990-12-31T15:59:60-08:00.
section: "5.7"
