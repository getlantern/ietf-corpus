document: rfc-3986
kind: design-rationale
summary: The fragment identifier is separated from the rest of the URI prior to scheme-specific dereference and processed solely by the user agent, making it independent of URI scheme. This prevents information providers from denying reference authors the right to refer selectively to parts of a resource.
section: "3.5"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-25"
