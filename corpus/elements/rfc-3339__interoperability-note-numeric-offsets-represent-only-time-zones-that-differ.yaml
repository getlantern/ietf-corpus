document: rfc-3339
kind: interoperability-note
summary: Numeric offsets represent only time zones that differ from UTC by an integral number of minutes. Historical time zones with non-integral offsets (e.g., the Netherlands +00:19:32.13 prior to 1937) must be converted to the closest representable UTC offset.
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-08"
