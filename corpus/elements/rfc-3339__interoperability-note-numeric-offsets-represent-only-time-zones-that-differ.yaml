document: rfc-3339
kind: interoperability-note
summary: Numeric offsets represent only time zones that differ from UTC by an integral number of minutes. Historical time zones with non-integral offsets (e.g., Netherlands +00:19:32.13) must be approximated to the nearest representable HH:MM value.
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-20"
