document: rfc-7159
kind: wire-format
summary: JSON strings begin and end with quotation marks (%x22). Control characters U+0000–U+001F, quotation mark, and reverse solidus MUST be escaped. Non-BMP characters are encoded as 12-character UTF-16 surrogate pair escape sequences (e.g., '\uD834\uDD1E' for U+1D11E).
section: "7"
