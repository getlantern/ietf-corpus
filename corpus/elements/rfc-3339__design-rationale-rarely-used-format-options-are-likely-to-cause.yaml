document: rfc-3339
kind: design-rationale
summary: Rarely used format options are likely to cause interoperability problems because they receive less testing in alpha/beta cycles. The only optional element retained in the Internet Date/Time Format is fractional seconds, included only for applications requiring strict ordering or unusual precision.
section: "5.3"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
