document: rfc-3986
kind: protocol-element
summary: The remove_dot_segments algorithm (Section 5.2.4) processes "." and ".." path segments using an input buffer and output buffer, consuming the input left-to-right and adjusting the output accordingly. Extra ".." segments beyond the root do not change the authority component.
section: 5.2.4
