document: rfc-3986
kind: normative-requirement
summary: When a new URI scheme defines textual components from the Universal Character Set (UCS), data SHOULD first be encoded as UTF-8 octets, then only octets not corresponding to unreserved characters SHOULD be percent-encoded.
section: "2.5"
rfc2119_level: SHOULD
