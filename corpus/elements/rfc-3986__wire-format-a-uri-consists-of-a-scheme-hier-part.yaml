document: rfc-3986
kind: wire-format
summary: 'A URI consists of a scheme, hier-part, optional query, and optional fragment: `URI = scheme ":" hier-part [ "?" query ] [ "#" fragment ]`. The hier-part may begin with authority (preceded by "//") followed by a path, or one of several path-only forms.'
