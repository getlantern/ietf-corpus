document: rfc-3986
kind: normative-requirement
summary: When a new URI scheme defines a component carrying Unicode text, the data should first be encoded as UTF-8 octets, then only octets not corresponding to unreserved characters should be percent-encoded. For example, LATIN CAPITAL LETTER A WITH GRAVE is represented as "%C3%80".
section: "2.5"
rfc2119_level: SHOULD
topics:
    - http
    - dns
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-23"
