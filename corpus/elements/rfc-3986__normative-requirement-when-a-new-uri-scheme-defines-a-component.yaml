document: rfc-3986
kind: normative-requirement
summary: When a new URI scheme defines a component containing Universal Character Set text, the data SHOULD first be encoded as UTF-8 octets, and only octets not corresponding to unreserved characters should then be percent-encoded.
section: "2.5"
rfc2119_level: SHOULD
