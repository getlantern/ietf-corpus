document: rfc-3339
kind: wire-format
summary: The `time-offset` field is either "Z" (UTC) or a numeric offset `(+/-) time-hour ":" time-minute`. Alphabetic timezone designators are not used. Numeric offsets are computed as local time minus UTC.
section: "5.6"
