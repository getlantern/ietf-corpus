document: rfc-3339
kind: design-rationale
summary: Fractional seconds (time-secfrac) are the only rarely-used optional element retained in the format; they are expected only for applications requiring strict timestamp ordering or unusual precision. All other optional ISO 8601 elements are omitted to reduce parsing bugs.
section: "5.3"
