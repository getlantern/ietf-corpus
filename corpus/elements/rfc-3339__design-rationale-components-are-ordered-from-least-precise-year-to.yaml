document: rfc-3339
kind: design-rationale
summary: Components are ordered from least precise (year) to most precise (second/fraction), enabling timestamps in the same timezone with the same fractional-second precision to be correctly sorted lexicographically using strcmp(), without requiring date-parsing logic.
