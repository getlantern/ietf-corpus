document: rfc-3986
kind: interoperability-note
summary: Some older implementations fail to separate a reference's query and fragment components from the path before merging with the base path and removing dot-segments. This causes incorrect resolution when query data contains the strings "/../" or "/./", an error that is rarely noticed in typical usage.
section: 5.2.4
topics:
    - http
