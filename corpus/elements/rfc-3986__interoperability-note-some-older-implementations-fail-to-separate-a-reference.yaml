document: rfc-3986
kind: interoperability-note
summary: Some older implementations fail to separate a reference's query or fragment component from its path before merging with the base path during relative resolution, causing incorrect behavior when query strings contain "/../" or "/./". All parsers SHOULD be capable of resolving abnormal dot-segment examples consistently.
section: 5.2.4
topics:
    - http
