document: rfc-3986
kind: normative-requirement
summary: Data octets corresponding to reserved characters MUST be percent-encoded before a URI is formed if they would conflict with the reserved character's delimiter role. Once formed, a URI is always in its percent-encoded form.
section: "2.4"
rfc2119_level: MUST
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-11"
