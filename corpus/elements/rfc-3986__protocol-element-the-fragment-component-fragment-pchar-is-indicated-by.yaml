document: rfc-3986
kind: protocol-element
summary: The fragment component (fragment = *( pchar / "/" / "?" )) is indicated by "#" and is separated from the URI before dereferencing. Fragment resolution is performed solely by the user agent; its semantics are defined by the media type of the retrieved representation, not by the URI scheme.
section: "3.5"
topics:
    - http
