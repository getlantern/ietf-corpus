document: rfc-3986
kind: normative-requirement
summary: URI producing applications MUST NOT use percent-encoding in the host component unless it represents a UTF-8 character sequence. Non-ASCII registered names must first be encoded as UTF-8, then each octet percent-encoded. When the name is an internationalized domain name for DNS resolution, it MUST be transformed to IDNA encoding prior to lookup.
section: 3.2.2
rfc2119_level: MUST NOT
topics:
    - dns
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-20"
