document: rfc-3986
kind: normative-requirement
summary: URI producing applications MUST NOT use percent-encoding in the host component unless it is used to represent a UTF-8 character sequence. Non-ASCII registered names must first be encoded as UTF-8, then each octet percent-encoded.
section: 3.2.2
rfc2119_level: MUST NOT
topics:
    - http
    - dns
