document: rfc-3986
kind: normative-requirement
summary: URI producing applications must not use percent-encoding in host unless representing a UTF-8 character sequence. Non-ASCII registered names intended for DNS lookup must be transformed to IDNA encoding (RFC 3490) prior to resolution; producers should provide names in IDNA form.
section: 3.2.2
rfc2119_level: MUST NOT
topics:
    - dns
