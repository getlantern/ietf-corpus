document: rfc-3986
kind: normative-requirement
summary: URI producing applications MUST NOT use percent-encoding in the host subcomponent unless it represents a UTF-8 character sequence. Non-ASCII internationalized domain names intended for DNS MUST be transformed to IDNA encoding prior to lookup.
section: 3.2.2
rfc2119_level: MUST NOT
topics:
    - dns
