document: rfc-3339
kind: wire-format
summary: time-second is encoded as 2DIGIT with a range of 00–58, 00–59, or 00–60 depending on leap second rules. The value '60' is permitted only at the end of a month in which a leap second occurs (e.g., XXXX-06-30T23:59:60Z or XXXX-12-31T23:59:60Z).
section: "5.7"
