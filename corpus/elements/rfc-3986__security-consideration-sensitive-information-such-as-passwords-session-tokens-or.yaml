document: rfc-3986
kind: security-consideration
summary: Sensitive information such as passwords, session tokens, or personal data should not be included in a URI, as URIs are frequently transmitted in the clear and logged by servers, proxies, and browser history. The userinfo "user:password" format is specifically deprecated.
section: "7.5"
topics:
    - security
    - privacy
