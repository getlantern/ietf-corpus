document: rfc-3986
kind: security-consideration
summary: Sensitive information such as passwords, session tokens, or personal data should not be included in URI components, as URIs routinely appear in HTTP Referer headers, server access logs, browser history, and bookmarks, making such data visible to unintended parties.
section: "7.5"
topics:
    - security
    - privacy
