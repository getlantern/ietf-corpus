document: rfc-3986
kind: normative-requirement
summary: Use of the format "user:password" in the userinfo field is deprecated. Applications SHOULD NOT render as clear text any data after the first colon in a userinfo subcomponent unless the data after the colon is the empty string.
section: 3.2.1
rfc2119_level: SHOULD NOT
topics:
    - security
    - http
