document: rfc-3986
kind: design-rationale
summary: The URI character set is restricted to letters, digits, and a few graphic symbols from the basic Latin alphabet to support global transcription — the ability to write a URI on a napkin and type it into a computer. The ability to transcribe was considered more important than using the most meaningful characters.
section: 1.2.1
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-25"
