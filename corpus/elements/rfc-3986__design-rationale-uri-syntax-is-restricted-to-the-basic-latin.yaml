document: rfc-3986
kind: design-rationale
summary: URI syntax is restricted to the basic Latin alphabet, digits, and a few special characters specifically to support global transcription — the ability to write a URI on paper and type it into any computer. The ability to transcribe was considered more important than having the most semantically meaningful component characters.
section: 1.2.1
topics:
    - http
