document: rfc-3986
kind: design-rationale
summary: 'URI syntax is restricted to the basic Latin alphabet, digits, and a few special characters to support global transcription: the ability to write a URI on a napkin and later enter it on a computer. Transcribability was considered more important than maximally meaningful component characters.'
section: 1.2.1
topics:
    - http
