document: rfc-3986
kind: normative-requirement
summary: URI producers SHOULD NOT create percent-encoded octets for unreserved characters (ALPHA, DIGIT, "-", ".", "_", "~"). URI normalizers SHOULD decode such encodings to their corresponding unreserved characters, as URIs differing only in that way identify the same resource.
section: "2.3"
rfc2119_level: SHOULD NOT
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-20"
