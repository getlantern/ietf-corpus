document: rfc-3986
kind: security-consideration
summary: Some platforms interpret non-standard IP address formats (octal, hexadecimal, fewer than four dotted-decimal parts) that differ from the RFC 3986 grammar. An application may be misled into connecting to a different host than expected if it fails to reject these forms.
section: "7.4"
topics:
    - security
    - http
    - ip
