document: rfc-3986
kind: security-consideration
summary: Some platforms accept rare IP address formats (octal, hexadecimal, fewer than four dotted octets) not allowed by the URI grammar. User agents resolving host names must reject such forms to prevent attackers from bypassing access controls via alternate address representations.
section: "7.4"
topics:
