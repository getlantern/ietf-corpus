document: rfc-3986
kind: security-consideration
summary: Some platforms accept rare IP address formats (octal, hexadecimal, or fewer than four dotted-decimal octets) that are not allowed by the URI grammar. These non-standard formats may bypass security checks that rely on recognizing address forms, and implementations should be alert to their use.
section: "7.4"
topics:
