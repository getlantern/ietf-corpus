summary: 'The six structural characters are: begin-array ''['' (%x5B), begin-object ''{'' (%x7B), end-array '']'' (%x5D), end-object ''}'' (%x7D), name-separator '':'' (%x3A), and value-separator '','' (%x2C). Each may be preceded or followed by insignificant whitespace (space %x20, horizontal tab %x09, line feed %x0A, carriage return %x0D).'
