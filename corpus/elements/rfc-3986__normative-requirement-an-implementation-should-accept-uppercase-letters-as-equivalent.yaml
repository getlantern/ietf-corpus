document: rfc-3986
kind: normative-requirement
summary: An implementation SHOULD accept uppercase letters as equivalent to lowercase in scheme names for robustness, but SHOULD produce only lowercase scheme names for consistency. Documents that specify URI schemes MUST define those scheme names with lowercase letters.
section: "3.1"
rfc2119_level: MUST
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
