document: rfc-3986
kind: normative-requirement
summary: An implementation SHOULD accept uppercase letters as equivalent to lowercase in scheme names (e.g., "HTTP" as well as "http") for robustness, but SHOULD produce only lowercase scheme names for consistency.
section: "3.1"
rfc2119_level: SHOULD
