document: rfc-3986
kind: normative-requirement
summary: An implementation SHOULD accept uppercase letters as equivalent to lowercase in scheme names for robustness but SHOULD produce only lowercase scheme names. Scheme specifications must define their own syntax such that all conforming strings also match the absolute-URI grammar.
section: "3.1"
rfc2119_level: SHOULD
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-09"
