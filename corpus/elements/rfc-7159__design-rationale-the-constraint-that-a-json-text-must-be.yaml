document: rfc-7159
kind: design-rationale
summary: The constraint that a JSON text must be an object or array (from RFC 4627) was removed because it conflicted with other JSON specifications and real-world practice; any JSON value is now a valid JSON text, though object- and array-only generators remain interoperable.
section: "1.3"
topics:
    - json
