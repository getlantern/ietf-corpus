document: rfc-3339
kind: wire-format
summary: The time-offset field encodes the UTC relationship as either "Z" (UTC, offset 00:00) or a numeric offset in the form ("±") HH:MM. The offset "-00:00" is reserved to indicate that UTC is known but the local offset is unknown, and is semantically distinct from "+00:00" or "Z".
