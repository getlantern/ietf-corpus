document: rfc-3339
kind: design-rationale
summary: Fractional seconds are the only rarely-used option retained in the format. Rarely-used options cause interoperability problems because they receive less testing; retaining only fractional seconds limits this risk while satisfying strict ordering and high-precision use cases.
section: "5.3"
