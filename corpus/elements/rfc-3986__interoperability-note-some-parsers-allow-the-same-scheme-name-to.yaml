document: rfc-3986
kind: interoperability-note
summary: Some parsers allow the same scheme name to appear in a relative reference when it matches the base URI scheme, a loophole from RFC 1630. Its use should be avoided but is allowed for backward compatibility; strict parsers treat a reference with a defined scheme as absolute.
section: 5.4.2
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-30"
