document: rfc-3986
kind: design-rationale
summary: The fragment identifier is separated from the URI before any dereference and resolved solely by the user agent, independent of the URI scheme. This design prevents origin servers from denying reference authors the right to point to secondary resources within a primary resource.
section: "3.5"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-13"
