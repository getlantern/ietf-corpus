document: rfc-3986
kind: design-rationale
summary: The fragment identifier is separated from the URI prior to dereferencing and is processed solely by the user agent. This design prevents information providers from denying reference authors the right to refer to portions of a resource selectively, and avoids leaking fragment data to origin servers.
section: "3.5"
topics:
    - privacy
    - http
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-30"
