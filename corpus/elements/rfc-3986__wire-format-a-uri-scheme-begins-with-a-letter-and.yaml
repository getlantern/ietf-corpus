document: rfc-3986
kind: wire-format
summary: 'A URI scheme begins with a letter and is followed by any combination of letters, digits, "+", "-", or ".": scheme = ALPHA *( ALPHA / DIGIT / "+" / "-" / "." ). Schemes are case-insensitive but the canonical form is lowercase.'
section: "3.1"
