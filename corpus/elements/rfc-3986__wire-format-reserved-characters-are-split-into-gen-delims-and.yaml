document: rfc-3986
kind: wire-format
summary: Reserved characters are split into gen-delims (`":" "/" "?" "#" "[" "]" "@"`) and sub-delims (`"!" "$" "&" "'" "(" ")" "*" "+" "," ";" "="`). Unreserved characters are `ALPHA / DIGIT / "-" / "." / "_" / "~"`.
