document: rfc-3986
kind: wire-format
summary: 'Reserved characters are split into gen-delims (: / ? # [ ] @) and sub-delims (! $ & '' ( ) * + , ; =). These characters serve as delimiters and are protected from normalization; URIs differing only in whether a reserved character is percent-encoded are not equivalent.'
section: "2.2"
