document: rfc-3986
kind: wire-format
summary: 'Reserved characters are split into gen-delims (: / ? # [ ] @) and sub-delims (! $ & '' ( ) * + , ; =). URIs differing only in whether a reserved character appears literal or percent-encoded are not equivalent and will be interpreted differently.'
