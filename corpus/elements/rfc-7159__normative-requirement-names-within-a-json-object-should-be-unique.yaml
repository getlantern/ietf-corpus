document: rfc-7159
kind: normative-requirement
summary: 'Names within a JSON object SHOULD be unique. When names are not unique, behavior of receiving software is unpredictable: some report only the last pair, others error, others report all pairs including duplicates.'
section: "4"
rfc2119_level: SHOULD
topics:
    - json
