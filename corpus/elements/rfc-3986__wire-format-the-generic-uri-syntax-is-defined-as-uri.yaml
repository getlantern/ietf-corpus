document: rfc-3986
kind: wire-format
summary: 'The generic URI syntax is defined as: URI = scheme ":" hier-part [ "?" query ] [ "#" fragment ], where hier-part may begin with "//" authority followed by path-abempty, or be a path-absolute, path-rootless, or path-empty. The scheme and path components are required, though path may be empty.'
