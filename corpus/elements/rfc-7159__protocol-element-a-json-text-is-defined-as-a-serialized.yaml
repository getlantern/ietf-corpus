document: rfc-7159
kind: protocol-element
summary: 'A JSON text is defined as a serialized value: any JSON value optionally surrounded by insignificant whitespace (JSON-text = ws value ws). This removes the RFC 4627 constraint that a JSON text must be an object or array.'
