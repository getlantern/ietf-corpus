document: rfc-3339
kind: design-rationale
summary: UTC is mandated over local time because daylight saving rules are convoluted and change unpredictably based on local law, making true interoperability impossible without a common reference. This specification explicitly does not cater to local time zone rules.
section: "4.1"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
