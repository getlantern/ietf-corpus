document: rfc-7159
kind: interoperability-note
summary: 'UTF-8 is the most interoperable encoding: many implementations cannot successfully read JSON texts encoded in UTF-16 or UTF-32. Implementations that produce UTF-8 JSON maximize the number of receivers that can parse them.'
section: "8.1"
topics:
    - json
