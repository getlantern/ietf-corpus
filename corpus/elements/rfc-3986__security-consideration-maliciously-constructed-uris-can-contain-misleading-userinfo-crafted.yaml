document: rfc-3986
kind: security-consideration
summary: Maliciously constructed URIs can contain misleading userinfo crafted to look like a trusted domain name (e.g., "http://trusted.example.com@evil.example.net/"). Applications rendering URIs for user feedback should visually distinguish the userinfo subcomponent from the host.
section: "7.2"
topics:
    - security
    - http
extracted_by: claude-sonnet-4-6
extracted_at: "2026-07-26"
