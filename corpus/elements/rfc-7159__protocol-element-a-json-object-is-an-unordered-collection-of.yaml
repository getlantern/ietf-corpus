document: rfc-7159
kind: protocol-element
summary: A JSON object is an unordered collection of zero or more name/value members, where each name is a string, separated from its value by a colon, and members are separated by commas, enclosed in curly braces. Member ordering is not guaranteed to be visible to calling software.
