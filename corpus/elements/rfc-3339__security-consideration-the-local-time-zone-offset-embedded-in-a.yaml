document: rfc-3339
kind: security-consideration
summary: The local time zone offset embedded in a timestamp may reveal information useful to an attacker for determining when systems are less likely to be monitored and thus more susceptible to probing. Sites with this concern may choose to emit timestamps in UTC only (offset "Z").
section: "7"
topics:
    - security
    - privacy
