document: rfc-3339
kind: security-consideration
summary: The local time zone offset embedded in a timestamp may reveal geographic location and help an attacker determine when systems are less likely to be monitored. Sites concerned about this may choose to emit timestamps in UTC only (using 'Z').
section: "7"
topics:
    - security
    - privacy
