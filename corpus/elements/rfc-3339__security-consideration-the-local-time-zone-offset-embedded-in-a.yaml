document: rfc-3339
kind: security-consideration
summary: The local time zone offset embedded in a timestamp may reveal when systems are less likely to be monitored and therefore more susceptible to security probes. Sites concerned about this may choose to emit timestamps in UTC only (offset "Z" or "+00:00").
section: "7"
topics:
    - security
    - privacy
