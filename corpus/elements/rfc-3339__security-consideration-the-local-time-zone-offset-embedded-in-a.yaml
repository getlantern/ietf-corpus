document: rfc-3339
kind: security-consideration
summary: The local time zone offset embedded in a timestamp may reveal the geographic location of a site, which an attacker could use to infer times when systems are less likely to be monitored. Sites concerned about this exposure may choose to emit all timestamps in UTC only (offset "Z" or "+00:00").
section: "7"
topics:
    - security
    - privacy
