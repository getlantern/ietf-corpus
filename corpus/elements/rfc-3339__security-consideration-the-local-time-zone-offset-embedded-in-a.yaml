document: rfc-3339
kind: security-consideration
summary: The local time zone offset embedded in a timestamp can reveal the geographic location of a site, which may be useful to an attacker for determining periods when systems are less likely to be monitored. Sites wishing to avoid this information leakage may emit times in UTC only (offset "Z").
section: "7"
topics:
    - security
    - privacy
