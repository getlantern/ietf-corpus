document: rfc-3986
kind: wire-format
summary: The query component (query = *( pchar / "/" / "?" )) begins at the first "?" and ends at "#" or end of URI. The fragment component (fragment = *( pchar / "/" / "?" )) begins at "#" and extends to end of URI; both allow "/" and "?" as data characters.
section: "3.4"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-09"
