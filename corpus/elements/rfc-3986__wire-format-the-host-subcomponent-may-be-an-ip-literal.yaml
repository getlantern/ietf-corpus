document: rfc-3986
kind: wire-format
summary: 'The host subcomponent may be an IP-literal (IPv6 or IPvFuture enclosed in square brackets), an IPv4address in dotted-decimal form, or a reg-name. ABNF: host = IP-literal / IPv4address / reg-name. The host is case-insensitive.'
section: 3.2.2
topics:
