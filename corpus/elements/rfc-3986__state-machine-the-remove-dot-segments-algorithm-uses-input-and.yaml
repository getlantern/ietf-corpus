document: rfc-3986
kind: state-machine
summary: 'The remove_dot_segments algorithm uses input and output string buffers: (A) strip leading "../" or "./"; (B) replace "/./ " or "/."-as-complete-segment with "/"; (C) replace "/../" or "/.."-as-complete-segment with "/" and remove the last output segment; (D) drop isolated "." or ".."; (E) otherwise move the first path segment (including leading "/") to output.'
section: 5.2.4
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
