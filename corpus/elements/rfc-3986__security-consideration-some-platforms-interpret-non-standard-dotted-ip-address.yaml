document: rfc-3986
kind: security-consideration
summary: Some platforms interpret non-standard dotted IP address notations (octal, hexadecimal, fewer than four octets) that differ from the dotted-decimal form required by this grammar. This can be exploited to bypass access controls that compare the textual host string rather than the resolved address.
section: "7.4"
topics:
