document: rfc-3986
kind: security-consideration
summary: Some platforms interpret non-standard dotted IP address notation (octal, hex, fewer than four parts) that differs from the four-octet dotted-decimal form defined in this grammar. Only the standard dotted-decimal form is valid; non-standard forms can be exploited to bypass access controls or fool users.
section: "7.4"
topics:
    - security
