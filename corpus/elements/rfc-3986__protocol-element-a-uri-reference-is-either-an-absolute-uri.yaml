document: rfc-3986
kind: protocol-element
summary: A URI-reference is either an absolute URI or a relative-ref. A relative reference is resolved against a base URI using the algorithm in Section 5.2, which produces a target URI by conditionally inheriting scheme, authority, path, and query components from the base.
section: "4.1"
