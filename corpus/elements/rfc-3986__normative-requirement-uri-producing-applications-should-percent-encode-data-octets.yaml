document: rfc-3986
kind: normative-requirement
summary: URI producing applications SHOULD percent-encode data octets corresponding to reserved characters unless the URI scheme explicitly allows those characters as data. If a reserved character appears with no known delimiting role, it MUST be interpreted as the data octet for that character in US-ASCII.
section: "2.2"
rfc2119_level: SHOULD
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-09"
