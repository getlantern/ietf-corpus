document: rfc-3339
kind: wire-format
summary: 'The date-time wire encoding uses fixed-width fields: date-fullyear (4DIGIT), date-month (2DIGIT, 01-12), date-mday (2DIGIT), time-hour (2DIGIT, 00-23), time-minute (2DIGIT, 00-59), time-second (2DIGIT, 00-60), optional time-secfrac ("." 1*DIGIT), and time-offset ("Z" or ("±") time-hour ":" time-minute). Fields are separated by literal "-", "T", ":", and "+"/"-" characters.'
section: "5.6"
