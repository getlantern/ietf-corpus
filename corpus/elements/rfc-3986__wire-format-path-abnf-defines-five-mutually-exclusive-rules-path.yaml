document: rfc-3986
kind: wire-format
summary: 'Path ABNF defines five mutually exclusive rules: path-abempty (empty or starts with /), path-absolute (/ but not //), path-noscheme (no leading colon), path-rootless (begins with a segment), and path-empty. The applicable rule is determined by context (presence/absence of authority).'
section: "3.3"
