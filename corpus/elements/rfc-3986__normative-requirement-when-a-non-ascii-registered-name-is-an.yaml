document: rfc-3986
kind: normative-requirement
summary: When a non-ASCII registered name is an internationalized domain name intended for DNS resolution, it MUST be transformed to IDNA encoding prior to name lookup. URI producers SHOULD provide such names in IDNA encoding rather than percent-encoding to maximize interoperability with legacy resolvers.
section: 3.2.2
rfc2119_level: MUST
topics:
    - http
    - dns
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-27"
