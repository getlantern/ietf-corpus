document: rfc-3986
kind: normative-requirement
summary: For syntax-based normalization, percent-encoded octets in the ranges of unreserved characters (ALPHA, DIGIT, "-", ".", "_", "~") should not be created by URI producers and should be decoded by URI normalizers. Scheme and host components should be lowercased.
section: 6.2.2
rfc2119_level: SHOULD
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
