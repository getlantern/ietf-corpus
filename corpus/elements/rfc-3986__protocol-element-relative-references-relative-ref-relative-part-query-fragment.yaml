document: rfc-3986
kind: protocol-element
summary: Relative references (relative-ref = relative-part [ "?" query ] [ "#" fragment ]) take advantage of the hierarchical URI syntax to express a target URI relative to a base URI. Network-path references begin with "//", absolute-path references with "/", and relative-path references with neither.
section: "4.2"
