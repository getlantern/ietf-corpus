document: rfc-7159
kind: interoperability-note
summary: Implementations that transform string representations into sequences of Unicode code units and compare numerically (code unit by code unit) are interoperable. Comparing strings with escaped characters unconverted may incorrectly find that 'a\\b' and 'a\u005Cb' are not equal.
section: "8.3"
topics:
    - json
