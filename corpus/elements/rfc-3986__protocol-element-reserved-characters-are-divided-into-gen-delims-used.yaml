document: rfc-3986
kind: protocol-element
summary: Reserved characters are divided into gen-delims (":" "/" "?" "#" "[" "]" "@") used as component delimiters, and sub-delims ("!" "$" "&" "'" "(" ")" "*" "+" "," ";" "=") available for subcomponent use. URIs differing only in whether a reserved character is percent-encoded are NOT equivalent.
section: "2.2"
topics:
