document: rfc-3986
kind: protocol-element
summary: Unreserved characters (ALPHA, DIGIT, "-", ".", "_", "~") may appear without percent-encoding in any URI component. URIs differing only in whether an unreserved character is percent-encoded or literal are equivalent and identify the same resource.
section: "2.3"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-25"
