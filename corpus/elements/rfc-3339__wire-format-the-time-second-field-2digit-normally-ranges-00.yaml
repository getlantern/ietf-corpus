document: rfc-3339
kind: wire-format
summary: The `time-second` field (2DIGIT) normally ranges 00–59, but MAY be "60" at the end of a month containing an inserted leap second (e.g., XXXX-06-30T23:59:60Z or XXXX-12-31T23:59:60Z). A subtracted leap second makes the maximum "58".
section: "5.7"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-09"
