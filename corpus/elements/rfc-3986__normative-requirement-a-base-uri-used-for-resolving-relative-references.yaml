document: rfc-3986
kind: normative-requirement
summary: A base URI used for resolving relative references MUST conform to the absolute-URI syntax rule (scheme, hier-part, optional query, no fragment). If the base URI is obtained from a URI reference, that reference must be converted to absolute form and stripped of any fragment prior to use.
section: "5.1"
rfc2119_level: MUST
topics:
    - http
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-27"
