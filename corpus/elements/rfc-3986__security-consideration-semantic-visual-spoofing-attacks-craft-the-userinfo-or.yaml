document: rfc-3986
kind: security-consideration
summary: Semantic (visual spoofing) attacks craft the userinfo or path subcomponents of a URI to resemble a trusted domain name when displayed. Applications rendering URIs for users should distinguish the userinfo subcomponent visually, and scheme-specific resolution should flag URIs that violate scheme syntax rather than silently ignoring unused parts.
section: "7.6"
topics:
    - security
    - http
