document: rfc-3986
kind: design-rationale
summary: 'URI identification is intentionally decoupled from resource access: a URI''s presence does not imply that the resource is accessible or that dereferencing will succeed. All operations on a URI (access, update, replace) are defined by the protocol or data format in which the URI appears, not by this specification.'
section: 1.2.2
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
