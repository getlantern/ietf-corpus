document: rfc-7159
kind: design-rationale
summary: RFC 7159 expands the definition of 'JSON text' to allow any JSON value (not just objects or arrays, as RFC 4627 required). This reflects observed practice and acknowledges that implementations generating only objects or arrays remain interoperable with all conforming receivers.
section: "1.3"
topics:
    - json
