document: rfc-7159
kind: interoperability-note
summary: The ABNF permits member names and string values to contain bit sequences that cannot encode Unicode characters, such as unpaired UTF-16 surrogates (e.g., `\uDEAD`). Receiving software behavior is unpredictable and may include incorrect string length results or fatal runtime exceptions.
section: "8.2"
topics:
    - json
