document: rfc-7159
kind: interoperability-note
summary: The ABNF permits member names and string values to contain bit sequences that do not encode valid Unicode characters (e.g., single unpaired UTF-16 surrogates such as "\uDEAD"). Software receiving such values behaves unpredictably, including returning wrong string lengths or suffering fatal runtime exceptions.
section: "8.2"
topics:
    - json
