document: rfc-3339
kind: design-rationale
summary: Fractional seconds are the only optional element retained in the profile. They are expected to be used only by applications requiring strict ordering or unusual precision; their rarity means they are unlikely to cause interoperability problems compared to other rarely used ISO 8601 options.
section: "5.3"
