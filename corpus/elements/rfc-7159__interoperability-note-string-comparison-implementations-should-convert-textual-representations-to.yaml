document: rfc-7159
kind: interoperability-note
summary: String comparison implementations should convert textual representations to Unicode code unit sequences and compare numerically, code unit by code unit. Implementations that compare strings with escaped characters unconverted may incorrectly find that 'a\\b' and 'a\u005Cb' are not equal.
section: "8.3"
topics:
    - json
