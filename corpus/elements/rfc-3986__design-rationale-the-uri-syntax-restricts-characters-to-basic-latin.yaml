document: rfc-3986
kind: design-rationale
summary: The URI syntax restricts characters to basic Latin letters, digits, and a few special characters to enable global transcription — i.e., a URI can be written on paper or a napkin and re-entered on any computer regardless of locale or keyboard. Transcribability was considered more important than meaningful components.
section: 1.2.1
topics:
    - http
