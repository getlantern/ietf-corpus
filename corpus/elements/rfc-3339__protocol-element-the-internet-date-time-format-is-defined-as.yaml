document: rfc-3339
kind: protocol-element
summary: 'The Internet Date/Time Format is defined as: date-time = full-date "T" full-time, where full-date = date-fullyear "-" date-month "-" date-mday and full-time = partial-time time-offset. This is a conformant subset of ISO 8601 extended format with most fields and punctuation mandatory.'
