document: rfc-3986
kind: design-rationale
summary: The URI generic syntax is defined as a superset of all valid URI schemes, allowing a scheme-independent parser to decompose any URI reference into its major components without knowing the scheme-specific grammar, decoupling protocol evolution from identifier evolution.
section: 1.1.1
