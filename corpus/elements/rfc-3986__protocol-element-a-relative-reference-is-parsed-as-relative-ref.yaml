document: rfc-3986
kind: protocol-element
summary: 'A relative reference is parsed as: relative-ref = relative-part [ "?" query ] [ "#" fragment ]. Three forms exist: network-path reference (begins "//"), absolute-path reference (begins "/"), and relative-path reference (no leading slash). A first path segment containing ":" must be preceded by "./" to avoid misinterpretation as a scheme.'
section: "4.2"
topics:
    - http
