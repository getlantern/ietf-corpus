document: rfc-3986
kind: security-consideration
summary: 'Semantic attacks use the visual gap between how a URI is displayed and how it is interpreted: a userinfo subcomponent crafted to look like a trusted domain name (e.g., "http://trusted.example.com@evil.example.com/") can fool users. Applications should visually distinguish userinfo from the rest of a URI in any user-facing display.'
section: "7.6"
topics:
    - security
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-22"
