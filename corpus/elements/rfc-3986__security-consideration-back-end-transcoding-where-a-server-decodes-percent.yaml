document: rfc-3986
kind: security-consideration
summary: Back-end transcoding — where a server decodes percent-encoded URIs and re-encodes them using a different character encoding — can produce URIs that resolve to unintended resources and may be exploited to bypass access controls or inject characters not present in the original URI.
section: "7.3"
topics:
    - http
    - security
