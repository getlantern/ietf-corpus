document: rfc-3986
kind: security-consideration
summary: Some platforms accept IP address forms other than dotted-decimal (octal octets, hex notation, fewer than four parts) that map to unexpected hosts. URIs containing such formats may bypass access controls; implementations should only accept the dotted-decimal IPv4 form defined in the grammar.
section: "7.4"
topics:
    - security
    - ip
