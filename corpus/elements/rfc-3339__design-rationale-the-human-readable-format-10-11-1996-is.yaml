document: rfc-3339
kind: design-rationale
summary: The human-readable format "10/11/1996" is unsuitable for global interchange because different countries interpret it differently; a balance between human readability and unambiguous machine parsing motivates the chosen ISO 8601 profile with fixed-length numeric fields and mandatory separators.
section: "5.2"
