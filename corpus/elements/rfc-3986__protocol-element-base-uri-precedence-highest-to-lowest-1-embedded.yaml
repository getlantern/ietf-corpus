document: rfc-3986
kind: protocol-element
summary: 'Base URI precedence (highest to lowest): (1) embedded in content, (2) from the encapsulating entity, (3) the retrieval URI (last URI after redirects), (4) application-defined default. A sender of content containing relative references must ensure a base URI can be established.'
section: "5.1"
