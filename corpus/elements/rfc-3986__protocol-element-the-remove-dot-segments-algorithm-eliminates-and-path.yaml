document: rfc-3986
kind: protocol-element
summary: The remove_dot_segments algorithm eliminates "." and ".." path segments using an input/output buffer loop, consuming prefixes "../", "./", "/./", "/../" in priority order, discarding excess ".." segments beyond the root, and never allowing dot-segments to change the authority component.
section: 5.2.4
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
