document: rfc-3986
kind: interoperability-note
summary: The "user:password" format in the userinfo field is deprecated. Applications should not render clear-text password data and may ignore or reject such data when received, as passing authentication information in clear text has proven to be a security risk.
section: 3.2.1
topics:
    - security
