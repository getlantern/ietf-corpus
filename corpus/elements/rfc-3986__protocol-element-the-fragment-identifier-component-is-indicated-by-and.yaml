document: rfc-3986
kind: protocol-element
summary: The fragment identifier component is indicated by "#" and terminated by end of URI. Its semantics are defined by the media type of the retrieved representation and are processed solely by the user agent; fragment identifier syntax cannot be redefined by scheme specifications.
section: "3.5"
topics:
    - http
