document: rfc-7159
kind: wire-format
summary: A JSON string is enclosed in quotation marks (%x22). All Unicode characters may appear except quotation mark, reverse solidus, and control characters U+0000–U+001F, which must be escaped. Escape sequences include two-character forms (e.g., \n, \t) and six-character \uXXXX Unicode escapes; characters outside the BMP are encoded as a 12-character UTF-16 surrogate pair sequence.
section: "7"
topics:
    - json
