document: rfc-7159
kind: wire-format
summary: A JSON string is enclosed in quotation marks (U+0022). Characters that must be escaped include quotation mark, reverse solidus, and control characters U+0000–U+001F. Non-BMP characters are encoded as a 12-character UTF-16 surrogate pair escape sequence (e.g., \uD834\uDD1E for U+1D11E).
