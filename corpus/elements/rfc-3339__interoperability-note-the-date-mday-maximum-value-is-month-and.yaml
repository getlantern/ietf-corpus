document: rfc-3339
kind: interoperability-note
summary: The date-mday maximum value is month- and year-dependent (28–31 for day, with February varying by leap year). Implementations MUST validate date-mday against the actual month/year to avoid accepting invalid dates such as February 30.
section: "5.7"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-18"
