document: rfc-3986
kind: wire-format
summary: 'The query component begins after the first "?" and ends at "#" or end of URI: query = *( pchar / "/" / "?" ). The fragment component begins after "#" and ends at end of URI: fragment = *( pchar / "/" / "?" ). Both allow "/" and "?" as data characters within them.'
section: "3.4"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-09-20"
