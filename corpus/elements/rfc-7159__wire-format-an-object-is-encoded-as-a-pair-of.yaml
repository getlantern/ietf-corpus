document: rfc-7159
kind: wire-format
summary: An object is encoded as a pair of curly brackets surrounding zero or more name/value members. Each member consists of a string name, a colon name-separator, and a value; members are separated by commas. `object = begin-object [ member *( value-separator member ) ] end-object`.
section: "4"
