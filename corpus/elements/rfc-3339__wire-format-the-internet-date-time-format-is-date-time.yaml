document: rfc-3339
kind: wire-format
summary: 'The Internet Date/Time Format is: date-time = full-date ''T'' full-time, where full-date = date-fullyear ''-'' date-month ''-'' date-mday (4DIGIT ''-'' 2DIGIT ''-'' 2DIGIT) and full-time = partial-time time-offset. The ''T'' separator and ''Z'' suffix may be lower case per ABNF and ISO 8601.'
section: "5.6"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-07-26"
