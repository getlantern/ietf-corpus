document: rfc-3339
kind: wire-format
summary: 'The Internet Date/Time Format is: date-time = full-date ''T'' full-time, where full-date = date-fullyear ''-'' date-month ''-'' date-mday (4-2-2 digits) and full-time = partial-time time-offset. The ''T'' separator and ''Z'' offset marker may be upper or lower case.'
section: "5.6"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
