document: rfc-3986
kind: security-consideration
summary: Some platforms accept non-standard IP address notations (octal, hex, fewer than four octets) that may be interpreted differently than the URI producer intended. Only the standard four-octet dotted-decimal form is permitted by the URI grammar; applications should reject other forms.
section: "7.4"
