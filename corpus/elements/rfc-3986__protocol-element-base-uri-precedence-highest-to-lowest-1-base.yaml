document: rfc-3986
kind: protocol-element
summary: 'Base URI precedence (highest to lowest): (1) base URI embedded in content, (2) base URI of the encapsulating entity, (3) URI used to retrieve the representation (last URI after redirects), (4) application-defined default base URI. A sender of relative references is responsible for ensuring a well-defined base URI can be established.'
section: "5.1"
topics:
    - http
