document: rfc-7159
kind: wire-format
summary: 'Six structural characters define JSON''s grammar: begin-array (%x5B), begin-object (%x7B), end-array (%x5D), end-object (%x7D), name-separator (%x3A), and value-separator (%x2C). Insignificant whitespace (space, tab, line feed, carriage return) is permitted before or after any structural character.'
