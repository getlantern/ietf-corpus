document: rfc-7159
kind: wire-format
summary: JSON numbers use base-10 decimal with an optional minus sign, integer part (no leading zeros), optional fraction (decimal point followed by one or more digits), and optional exponent (E or e, optional sign, one or more digits). Infinity and NaN are not permitted.
