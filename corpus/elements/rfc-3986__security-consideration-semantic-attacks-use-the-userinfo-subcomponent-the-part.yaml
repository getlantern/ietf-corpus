document: rfc-3986
kind: security-consideration
summary: Semantic attacks use the userinfo subcomponent (the part before "@") to make a URI appear to identify a trusted domain (e.g., "http://trusted.example.com@attacker.example.com/"). Applications rendering URIs for user feedback should visually distinguish userinfo from the host portion.
section: "7.6"
topics:
    - security
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
