document: rfc-3339
kind: design-rationale
summary: The full ISO 8601 grammar (documented in Appendix A) is deemed too complex for Internet protocols. This specification defines a simpler conformant subset of ISO 8601 extended format by making most fields and punctuation mandatory.
section: "5.5"
