document: rfc-3339
kind: interoperability-note
summary: Programs using two-digit years may represent years after 1999 as three digits (subtracting 1900 without checking digit count) or as non-numeric characters. Implementations wishing to handle such broken software may add 1900 to three-digit years or detect non-numeric decades.
section: "3"
