document: rfc-3986
kind: protocol-element
summary: Component recomposition assembles a URI string by appending scheme+":", then "//"+authority if defined, then path, then "?"+query if defined, then "#"+fragment if defined. An undefined component (separator absent) must be distinguished from an empty component (separator present with empty value).
section: "5.3"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
