document: rfc-3986
kind: security-consideration
summary: Maliciously constructed URIs may disguise the actual target resource through unusual percent-encoding, deceptive path forms, or misleading authority components. Scheme-specific resolution processes should flag URIs that violate scheme restrictions as errors rather than silently ignoring unused parts.
section: "7.2"
topics:
    - security
