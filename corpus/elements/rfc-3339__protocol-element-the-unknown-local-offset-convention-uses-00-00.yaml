document: rfc-3339
kind: protocol-element
summary: The unknown-local-offset convention uses "-00:00" to indicate that UTC is known but the local offset is unknown. This is semantically distinct from "Z" or "+00:00", which indicate UTC is the preferred reference point. RFC 2822 employs a similar convention for email.
section: "4.3"
topics:
    - email
