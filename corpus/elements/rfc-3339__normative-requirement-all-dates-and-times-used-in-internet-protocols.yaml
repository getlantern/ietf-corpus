document: rfc-3339
kind: normative-requirement
summary: All dates and times used in Internet protocols MUST be fully qualified with a UTC offset or 'Z'. Unqualified local time is deemed unacceptable for the Internet because interpretation fails in approximately 23/24 of the globe.
section: "4.4"
rfc2119_level: MUST
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
