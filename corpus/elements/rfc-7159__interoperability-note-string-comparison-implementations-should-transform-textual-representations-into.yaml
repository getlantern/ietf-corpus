document: rfc-7159
kind: interoperability-note
summary: String comparison implementations SHOULD transform textual representations into Unicode code unit sequences and compare numerically, code unit by code unit. Comparing strings with escaped characters unconverted may incorrectly find unequal strings that are semantically equal.
section: "8.3"
topics:
