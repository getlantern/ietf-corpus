document: rfc-3986
kind: protocol-element
summary: The fragment identifier is indicated by "#" and terminated by end of URI. Fragment semantics are defined by the media type of the retrieved representation, are independent of the URI scheme, and cannot be redefined by scheme specifications. The fragment is separated from the URI before dereferencing and is resolved solely by the user agent.
section: "3.5"
topics:
    - http
