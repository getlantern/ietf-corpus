document: rfc-3339
kind: design-rationale
summary: The only rarely-used option included in the format is fractional seconds (time-secfrac), because rarely-used options are less likely to be tested in alpha/beta and thus more likely to harbor parsing bugs. Fractional seconds are retained for applications requiring strict timestamp ordering or unusual precision.
section: "5.3"
