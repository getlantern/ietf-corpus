document: rfc-3339
kind: interoperability-note
summary: Two-digit-year software may emit years after 1999 as three digits (by subtracting 1900 without checking digit count) or as non-numeric characters. Robust parsers may compensate by adding 1900 to three-digit years or detecting non-numeric decades.
section: "3"
