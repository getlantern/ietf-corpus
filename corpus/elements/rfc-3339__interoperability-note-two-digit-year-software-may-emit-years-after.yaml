document: rfc-3339
kind: interoperability-note
summary: Two-digit year software may emit years after 1999 as three-digit values (e.g., 100 for 2000) or as non-numeric characters; robust implementations should handle these cases by adding 1900 or detecting non-numeric decades.
section: "3"
