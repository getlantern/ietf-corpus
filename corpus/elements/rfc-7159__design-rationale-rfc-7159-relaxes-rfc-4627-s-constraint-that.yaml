document: rfc-7159
kind: design-rationale
summary: RFC 7159 relaxes RFC 4627's constraint that a JSON text must be an object or array, allowing any JSON value as a top-level JSON text. The rationale is that implementations generating only objects or arrays remain interoperable, while the restriction was unnecessarily narrow given how JSON is used in practice.
section: "1.3"
topics:
    - json
