document: rfc-3986
kind: protocol-element
summary: The fragment identifier is separated from the URI before any dereference and is resolved solely by the user agent; it is never passed to the server. Fragment semantics are defined by the media type of the retrieved representation, not the URI scheme, and cannot be redefined by scheme specifications.
section: "3.5"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-11-01"
