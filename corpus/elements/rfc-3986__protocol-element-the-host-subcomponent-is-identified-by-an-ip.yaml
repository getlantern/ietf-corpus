document: rfc-3986
kind: protocol-element
summary: 'The host subcomponent is identified by an IP literal in square brackets (IPv6 or IPvFuture), an IPv4 address in dotted-decimal form, or a registered name. Host is case-insensitive. IPv6 literals use: IP-literal = "[" ( IPv6address / IPvFuture ) "]" — the only place square brackets are permitted in URI syntax.'
section: 3.2.2
topics:
    - ip
    - dns
