document: rfc-3986
kind: design-rationale
summary: The URI syntax is a superset of all valid URI scheme syntaxes, enabling a scheme-independent generic parser to decompose any URI reference into its components without knowing scheme-specific semantics. This decouples the evolution of schemes from protocols and data formats that use URIs.
section: 1.1.1
topics:
    - http
