document: rfc-3339
kind: design-rationale
summary: Non-integral minute UTC offsets (which exist in historical time zones, e.g., Netherlands +00:19:32.13 before 1937) cannot be represented exactly in the HH:MM offset format; applications must convert such timestamps to the closest representable UTC offset.
section: "4.2"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-04"
