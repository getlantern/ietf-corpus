document: rfc-7159
kind: wire-format
summary: JSON numbers are base-10, composed of an optional minus sign, an integer part (no leading zeros), an optional fractional part (decimal point followed by one or more digits), and an optional exponent part (E/e, optional sign, one or more digits). Infinity and NaN are not permitted.
