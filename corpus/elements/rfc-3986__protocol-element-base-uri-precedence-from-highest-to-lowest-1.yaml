document: rfc-3986
kind: protocol-element
summary: 'Base URI precedence from highest to lowest: (1) base URI embedded in content, (2) base URI from the encapsulating entity, (3) retrieval URI (last URI after redirects), (4) application-defined default. The innermost (highest-precedence) defined base wins.'
section: "5.1"
