document: rfc-3986
kind: protocol-element
summary: 'Base URI precedence from highest to lowest: (1) base URI embedded in content, (2) base URI of the encapsulating entity (e.g., MIME container), (3) URI used to retrieve the representation — with redirects, the final URI applies, (4) application-defined default base URI.'
