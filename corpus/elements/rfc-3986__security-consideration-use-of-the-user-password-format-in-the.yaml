document: rfc-3986
kind: security-consideration
summary: Use of the "user:password" format in the userinfo field is deprecated. Applications should not render as clear text any data after the first colon within a userinfo subcomponent and should reject storage of such data in unencrypted form. The passing of authentication information in clear text has proven to be a security risk in nearly every case.
section: 3.2.1
topics:
    - security
    - privacy
extracted_by: claude-sonnet-4-6
extracted_at: "2026-08-16"
