document: rfc-3986
kind: design-rationale
summary: The URI syntax uses only basic Latin letters, digits, and a small set of special characters to prioritize global transcription across keyboards, languages, and media. The ability to reliably transcribe a URI from one medium to another was considered more important than maximizing component meaningfulness.
section: 1.2.1
topics:
    - http
