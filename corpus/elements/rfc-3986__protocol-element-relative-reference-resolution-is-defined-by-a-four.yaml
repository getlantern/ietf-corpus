document: rfc-3986
kind: protocol-element
summary: 'Relative reference resolution is defined by a four-step precedence hierarchy for establishing the base URI: (1) base embedded in content, (2) base from the encapsulating entity, (3) the retrieval URI, (4) application-defined default. The innermost-defined base has highest precedence.'
section: "5.1"
topics:
    - http
