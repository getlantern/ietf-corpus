document: rfc-3986
kind: security-consideration
summary: Sensitive information such as passwords in the userinfo component may be inadvertently exposed in log files, referrer headers, or browser history. The use of the "user:password" format in URIs has proven to be a security risk and is deprecated.
section: "7.5"
topics:
    - security
    - privacy
    - http
