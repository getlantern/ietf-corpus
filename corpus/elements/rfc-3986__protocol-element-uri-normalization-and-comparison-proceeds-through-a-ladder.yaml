document: rfc-3986
kind: protocol-element
summary: 'URI normalization and comparison proceeds through a ladder of equivalence tests: simple string comparison, syntax-based normalization (case normalization, percent-encoding normalization, path segment normalization), scheme-based normalization, and protocol-based normalization. URIs differing only in percent-encoding of unreserved characters are equivalent.'
section: "6.2"
