document: rfc-3339
kind: design-rationale
summary: Date and time components are ordered from least precise to most precise (year to second) so that timestamps with the same time zone, same offset string, and same fractional-second width can be correctly sorted using a simple string comparison (e.g., strcmp()). Optional punctuation would violate this property.
section: "5.1"
