document: rfc-3339
kind: design-rationale
summary: Date and time components are ordered from least precise (year) to most precise (second/fraction) so that, when timestamps share the same time zone string and fractional-second digit count, they can be correctly sorted using a simple lexicographic string comparison (e.g., strcmp()).
section: "5.1"
