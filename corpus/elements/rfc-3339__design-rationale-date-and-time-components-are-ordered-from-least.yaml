document: rfc-3339
kind: design-rationale
summary: Date and time components are ordered from least precise (year) to most precise (second/fraction) so that timestamps with the same time zone and same number of fractional second digits can be sorted correctly using simple string comparison (e.g., strcmp()).
section: "5.1"
