document: rfc-3339
kind: design-rationale
summary: Date and time components are ordered from least precise to most precise (year-month-day T hour:minute:second) so that lexicographic string sorting (e.g., strcmp) produces chronological ordering, provided all timestamps use the same timezone and fractional-second precision.
section: "5.1"
