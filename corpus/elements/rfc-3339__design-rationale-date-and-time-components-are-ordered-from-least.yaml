document: rfc-3339
kind: design-rationale
summary: Date and time components are ordered from least precise (year) to most precise (second/fraction), so that timestamps with the same time zone string and equal fractional-second digits can be correctly sorted lexicographically using strcmp(). Optional punctuation would violate this property.
section: "5.1"
