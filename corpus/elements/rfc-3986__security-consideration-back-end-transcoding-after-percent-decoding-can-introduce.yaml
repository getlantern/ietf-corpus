document: rfc-3986
kind: security-consideration
summary: Back-end transcoding after percent-decoding can introduce unsafe characters. Systems that decode percent-encoded octets before passing data to back-end processes must ensure decoded data cannot be misinterpreted as control sequences or delimiters in the target system.
section: "7.3"
topics:
    - security
