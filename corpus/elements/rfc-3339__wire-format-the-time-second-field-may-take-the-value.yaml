document: rfc-3339
kind: wire-format
summary: The time-second field may take the value "60" only at the end of months in which a leap second occurs (historically June 30 or December 31, represented as XXXX-MM-DDT23:59:60Z). A negative leap second reduces the maximum to "58"; otherwise the maximum is "59".
section: "5.7"
extracted_by: claude-sonnet-4-6
extracted_at: "2026-10-18"
